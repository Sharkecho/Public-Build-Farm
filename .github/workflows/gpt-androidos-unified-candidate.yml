name: GPT-AndroidOS unified audio UI candidate

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/gpt-androidos-unified-candidate.yml
  push:
    branches: [codex/unified-audio-ui-bindings-20261010]
    paths: [.github/workflows/gpt-androidos-unified-candidate.yml]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  source-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      NATIVE_REUSED: 'false'
    steps:
      - name: Keep source and patch line endings unchanged
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Check out fixed private audio source
        uses: actions/checkout@v4
        with:
          repository: Sharkecho/GPT-AndroidOS
          ref: 57af7dc6bdf13f9db8044026f8563d55a9d21dd9
          path: source
          fetch-depth: 8
          token: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          persist-credentials: false

      - name: Verify source revision and fetch public dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = (git -C source rev-parse HEAD).Trim()
          if ($actual -ne '57af7dc6bdf13f9db8044026f8563d55a9d21dd9') { throw "Source mismatch: $actual" }
          git -C source submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Public submodule checkout failed' }
          "SOURCE_SHA=$actual" >> $env:GITHUB_ENV

      - name: Run audio source contracts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File source/application/tests/run_all_contract_tests.ps1
          if ($LASTEXITCODE -ne 0) { throw "Audio contracts failed: $LASTEXITCODE" }
          & pwsh -NoProfile -File source/unified-android/tests/main_activity_syntax_test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Activity syntax check failed before native compilation' }
          foreach ($name in @('automatic_input_policy_test','live_control_locks_test','u2_indicator_test','tone_sample_policy_test','audio_module_library_test','realtime_tune_policy_test','tuning_monitor_test','foreground_authorization_test')) {
            & pwsh -NoProfile -File "source/unified-android/tests/$name.ps1"
            if ($LASTEXITCODE -ne 0) { throw "Live/tone ownership regression failed: $name" }
          }
          & pwsh -NoProfile -File source/application/tests/story_playback_java_test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Ordered story/WAV/segment/progress regression failed' }

      - name: Set up MSVC for native host tests
        uses: ilammy/msvc-dev-cmd@v1

      - name: Run native DSP, engine, and session tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $native = Join-Path $env:GITHUB_WORKSPACE 'source\application\native'
          $out = Join-Path $env:RUNNER_TEMP 'note9-native-tests'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          & cl.exe /nologo /std:c++20 /EHsc /W4 /WX "/Fe:$(Join-Path $out 'dsp.exe')" (Join-Path $native 'tests\native_dsp_chain_test.cpp')
          if ($LASTEXITCODE -ne 0) { throw 'Native DSP compile failed' }
          & (Join-Path $out 'dsp.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Native DSP test failed' }
          & cl.exe /nologo /std:c++20 /EHsc /W4 /WX "/Fe:$(Join-Path $out 'engine.exe')" (Join-Path $native 'tests\native_audio_engine_test.cpp') (Join-Path $native 'native_audio_engine.cpp')
          if ($LASTEXITCODE -ne 0) { throw 'Native engine compile failed' }
          & (Join-Path $out 'engine.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Native engine test failed' }
          & cl.exe /nologo /std:c++20 /EHsc /W4 /WX "/Fe:$(Join-Path $out 'session.exe')" (Join-Path $native 'tests\native_session_test.cpp') (Join-Path $native 'native_session.cpp') (Join-Path $native 'native_audio_engine.cpp')
          if ($LASTEXITCODE -ne 0) { throw 'Native session compile failed' }
          & (Join-Path $out 'session.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Native session test failed' }
          'PASS: native DSP, engine, and session host tests'

      - name: Prepare Android SDK and NDK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = if ($env:ANDROID_HOME) { $env:ANDROID_HOME } else { $env:ANDROID_SDK_ROOT }
          if (-not $sdk) { throw 'Android SDK root is absent on runner' }
          $manager = Get-Command sdkmanager.bat -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $manager) {
            $manager = Get-ChildItem (Join-Path $sdk 'cmdline-tools') -Recurse -Filter sdkmanager.bat -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $manager) { throw 'sdkmanager.bat is absent on runner' }
          $managerPath = if ($manager.Source) { $manager.Source } else { $manager.FullName }
          & $managerPath --sdk_root=$sdk '--install' 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          if ($LASTEXITCODE -ne 0) { throw "Android SDK install failed: $LASTEXITCODE" }
          if (-not (Test-Path (Join-Path $sdk 'ndk\29.0.14206865\build\cmake\android.toolchain.cmake'))) { throw 'NDK toolchain missing' }
          "ANDROID_SDK_ROOT=$sdk" >> $env:GITHUB_ENV

      - name: Check immutable native inputs against the verified baseline
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $baseline = '3455a1dcbf4f8c0ce08f0fa0de2c8dccea8fa947'
          git -C source cat-file -e "${baseline}^{commit}"
          if ($LASTEXITCODE -ne 0) { 'NATIVE_REUSE_ELIGIBLE=false' >> $env:GITHUB_ENV; exit 0 }
          git -C source diff --exit-code $baseline HEAD -- application/native application/third_party/mobRealVoice application/build.ps1 application/scripts application/src/android/llama/cpp application/src/com/note9/uac2/NativeAudioEngine.java application/src/com/note9/uac2/NativeAudioSession.java application/src/com/note9/uac2/NativeAudioSnapshot.java application/src/com/note9/uac2/BeatriceRuntime.java agent/clawgui.lock unified-android/audio/build.gradle.kts
          if ($LASTEXITCODE -eq 0) { 'NATIVE_REUSE_ELIGIBLE=true' >> $env:GITHUB_ENV }
          elseif ($LASTEXITCODE -eq 1) { 'NATIVE_REUSE_ELIGIBLE=false' >> $env:GITHUB_ENV }
          else { throw 'Cannot validate native input provenance' }

      - name: Download immutable baseline artifact (full rebuild if unavailable)
        id: native_archive
        if: env.NATIVE_REUSE_ELIGIBLE == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'native-baseline-11669242676.zip'
          $start = [Diagnostics.ProcessStartInfo]::new('gh.exe')
          foreach ($arg in @('api','repos/Sharkecho/Public-Build-Farm/actions/artifacts/11669242676/zip')) { $start.ArgumentList.Add($arg) }
          $start.UseShellExecute = $false
          $start.CreateNoWindow = $true
          $start.RedirectStandardOutput = $true
          $start.RedirectStandardError = $true
          $process = [Diagnostics.Process]::Start($start)
          $file = [IO.File]::Create($archive)
          try { $process.StandardOutput.BaseStream.CopyTo($file) } finally { $file.Dispose() }
          $process.WaitForExit()
          if ($process.ExitCode -ne 0) { throw 'Baseline artifact unavailable; rebuilding all native inputs' }

      - name: Verify baseline integrity and stage unchanged native libraries
        if: steps.native_archive.outcome == 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'native-baseline-11669242676.zip'
          $expected = '1e26c5bda7263d511cb6d800188b99fe7db067fc82f18b57a8cfa64fccfc4547'
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw 'Baseline artifact SHA-256 mismatch; refusing reuse' }
          $expanded = Join-Path $env:RUNNER_TEMP 'native-baseline-11669242676'
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded
          $apks = @(Get-ChildItem -LiteralPath $expanded -Recurse -File -Filter app-debug.apk)
          if ($apks.Count -ne 1) { throw 'Ambiguous native baseline APK' }
          & (Join-Path $env:ANDROID_SDK_ROOT 'build-tools/36.0.0/apksigner.bat') verify $apks[0].FullName
          if ($LASTEXITCODE -ne 0) { throw 'Baseline APK signature invalid' }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $target = Join-Path $env:GITHUB_WORKSPACE 'source/build/unified-audio-native/arm64-v8a'
          New-Item -ItemType Directory -Path $target -Force | Out-Null
          $zip = [IO.Compression.ZipFile]::OpenRead($apks[0].FullName)
          try {
            foreach ($name in @('libvoice_model_bridge.so','libLiteRt.so','libllama-android.so','libllama.so','libggml.so','libggml-cpu.so','libggml-base.so')) {
              $entry = $zip.GetEntry("lib/arm64-v8a/$name")
              if ($null -eq $entry -or $entry.Length -eq 0) { throw "Missing verified baseline JNI: $name" }
              [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $target $name))
            }
          } finally { $zip.Dispose() }
          'NATIVE_REUSED=true' >> $env:GITHUB_ENV
          'NATIVE_BASELINE_RUN=38050030270; ARCHIVE_SHA256_VERIFIED=true' >> $env:GITHUB_STEP_SUMMARY

      - name: Prepare pinned ONNX and LiteRT dependencies
        if: env.NATIVE_REUSED != 'true'
        shell: pwsh
        run: |
          & pwsh -NoProfile -File source/application/scripts/prepare-ci-deps.ps1
          if ($LASTEXITCODE -ne 0) { throw "Model dependency preparation failed: $LASTEXITCODE" }

      - name: Build pinned official llama Android JNI
        if: env.NATIVE_REUSED != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $llamaRevision = '4b2a4778f81f222c12271ce3b1997990b3071faf'
          $llamaRoot = Join-Path $env:RUNNER_TEMP 'llama-cpp'
          git clone --filter=blob:none --no-checkout https://github.com/ggml-org/llama.cpp.git $llamaRoot
          if ($LASTEXITCODE -ne 0) { throw 'llama.cpp clone failed' }
          git -C $llamaRoot fetch --depth=1 origin $llamaRevision
          if ($LASTEXITCODE -ne 0) { throw 'llama.cpp revision fetch failed' }
          git -C $llamaRoot checkout --detach $llamaRevision
          if ($LASTEXITCODE -ne 0 -or (git -C $llamaRoot rev-parse HEAD).Trim() -ne $llamaRevision) { throw 'llama.cpp revision mismatch' }
          $out = Join-Path $env:GITHUB_WORKSPACE 'source\build\note9-llama-jni'
          $toolchain = Join-Path $env:ANDROID_SDK_ROOT 'ndk\29.0.14206865\build\cmake\android.toolchain.cmake'
          $commonInclude = (Join-Path $llamaRoot 'common').Replace('\', '/')
          cmake.exe -S (Join-Path $llamaRoot 'examples\llama.android\llama\src\main\cpp') -B $out -G Ninja "-DCMAKE_TOOLCHAIN_FILE=$toolchain" '-DANDROID_ABI=arm64-v8a' '-DANDROID_PLATFORM=android-26' '-DCMAKE_BUILD_TYPE=Release' '-DGGML_OPENMP=OFF' '-DLLAMA_BUILD_COMMON=ON' '-DLLAMA_CURL=OFF' "-DCMAKE_CXX_FLAGS=-I$commonInclude"
          if ($LASTEXITCODE -ne 0) { throw "llama JNI configure failed: $LASTEXITCODE" }
          cmake.exe --build $out --target llama-android --parallel 4
          if ($LASTEXITCODE -ne 0) { throw "llama JNI build failed: $LASTEXITCODE" }

      - name: Build debug signed Note9 audio APK
        if: env.NATIVE_REUSED != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & pwsh -NoProfile -File source/application/build.ps1 -OutputName note9-audio-candidate-debug.apk
          if ($LASTEXITCODE -ne 0) { throw "APK build failed: $LASTEXITCODE" }

      - name: Check out pinned Agent runtime
        uses: actions/checkout@v4
        with:
          repository: ZJU-REAL/ClawGUI
          ref: d990d3e3f2390ced708771d9681d3c4f9a6cbef5
          path: upstream
          persist-credentials: false

      - name: Stage verified audio native libraries and unified launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $apk = Join-Path $env:GITHUB_WORKSPACE 'source/application/build/story-orchestrator/note9-audio-candidate-debug.apk'
          $target = Join-Path $env:GITHUB_WORKSPACE 'source/build/unified-audio-native/arm64-v8a'
          New-Item -ItemType Directory -Force -Path $target | Out-Null
          if ($env:NATIVE_REUSED -ne 'true') {
            $archive = [IO.Compression.ZipFile]::OpenRead($apk)
            try {
              foreach ($name in @('libvoice_model_bridge.so','libLiteRt.so','libllama-android.so','libllama.so','libggml.so','libggml-cpu.so','libggml-base.so')) {
                $entry = $archive.GetEntry("lib/arm64-v8a/$name")
                if ($null -eq $entry -or $entry.Length -eq 0) { throw "Missing same-run JNI: $name" }
                [IO.Compression.ZipFileExtensions]::ExtractToFile($entry, (Join-Path $target $name))
              }
            } finally { $archive.Dispose() }
          }
          & pwsh -NoProfile -File source/unified-android/prepare-agent.ps1 -ClawGuiRoot upstream
          if ($LASTEXITCODE -ne 0) { throw 'Unified launcher patch failed' }
          "CLAWGUI_APP_DIR=$(Join-Path $env:GITHUB_WORKSPACE 'upstream/clawgui-app')" >> $env:GITHUB_ENV

      - name: Build single unified APK and targeted JNI test APK
        shell: pwsh
        working-directory: source/unified-android
        run: |
          $ErrorActionPreference = 'Stop'
          & (Join-Path $env:CLAWGUI_APP_DIR 'gradlew.bat') --no-daemon --max-workers=2 :app:assembleDebug :app:assembleDebugAndroidTest
          if ($LASTEXITCODE -ne 0) { throw 'Unified APK build failed' }
          foreach ($test in Get-ChildItem tests -Filter '*contract_test.ps1') {
            & pwsh -NoProfile -File $test.FullName
            if ($LASTEXITCODE -ne 0) { throw "Unified contract failed: $($test.Name)" }
          }
          & pwsh -NoProfile -File tests/live_input_meter_test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Live input meter or output worker completion tests failed' }
          & pwsh -NoProfile -File tests/tone_kotlin_compile_test.ps1 -AndroidJar (Join-Path $env:ANDROID_SDK_ROOT 'platforms/android-36/android.jar')
          if ($LASTEXITCODE -ne 0) { throw 'Tone compile regression failed' }
          & pwsh -NoProfile -File tests/guardian_policy_test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Guardian startup/record policy regression failed' }
          & pwsh -NoProfile -File tests/guardian_compile_test.ps1 -AndroidJar (Join-Path $env:ANDROID_SDK_ROOT 'platforms/android-36/android.jar')
          if ($LASTEXITCODE -ne 0) { throw 'Guardian compile regression failed' }

      - name: Verify APK identity and archive candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $apk = 'upstream/clawgui-app/app/build/outputs/apk/debug/app-debug.apk'
          if (-not (Test-Path $apk) -or (Get-Item $apk).Length -eq 0) { throw 'Built APK missing or empty' }
          $tools = Join-Path $env:ANDROID_SDK_ROOT 'build-tools\36.0.0'
          & (Join-Path $tools 'apksigner.bat') verify --verbose --print-certs $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK signature verification failed' }
          $badging = & (Join-Path $tools 'aapt.exe') dump badging $apk
          if ($LASTEXITCODE -ne 0) { throw 'APK package inspection failed' }
          $packageLine = $badging | Select-String '^package:' | Select-Object -First 1
          if (-not $packageLine -or $packageLine.Line -notmatch "name='com\.clawgui\.ng' versionCode='1' versionName='0\.2\.0'") { throw "Unexpected package identity or version: $packageLine" }
          $labels = @($badging | Select-String '^application-label(?:-[^:]+)?:')
          if ($labels.Count -eq 0 -or @($labels | Where-Object { $_.Line -notmatch "^application-label(?:-[^:]+)?:'GPT-AndroidOS'$" }).Count -ne 0) { throw 'Unified APK has an incorrect localized application label' }
          $badging | Select-String "^application-label:|^application-label-zh(?:-CN)?:"
          $badging | Select-String '^package:|^native-code:'
          $manifestTree = (& (Join-Path $tools 'aapt.exe') dump xmltree $apk AndroidManifest.xml) -join "`n"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot inspect built APK manifest' }
          $activities = $manifestTree -split '(?m)^\s+E: activity\s+\('
          $owner = @($activities | Where-Object { $_ -match 'android:name[^\r\n]*"com\.clawgui\.ng\.ui\.UnifiedMainActivity"' })
          if ($owner.Count -ne 1 -or $owner[0] -notmatch 'android:launchMode[^\r\n]*\(type 0x10\)0x2\b') {
            throw 'Effective APK launcher must be singleTask to prevent duplicate audio owners'
          }
          $sha = (Get-FileHash $apk -Algorithm SHA256).Hash
          "SOURCE_SHA=$env:SOURCE_SHA" >> $env:GITHUB_STEP_SUMMARY
          'AUDIO_SOURCE_CONTRACTS=PASS' >> $env:GITHUB_STEP_SUMMARY
          'NATIVE_HOST_TESTS=PASS' >> $env:GITHUB_STEP_SUMMARY
          'ANDROID_APK=DEBUG_BUILD_VERIFIED' >> $env:GITHUB_STEP_SUMMARY
          "APK_SHA256=$sha" >> $env:GITHUB_STEP_SUMMARY
          'NOTE9_DEVICE_TEST=NOT_RUN' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload debug candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: gpt-androidos-unified-candidate-apks
          path: |
            upstream/clawgui-app/app/build/outputs/apk/debug/app-debug.apk
            upstream/clawgui-app/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 3

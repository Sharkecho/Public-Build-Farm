# Reproducible LineageOS 20 kernel gate for the Note9 (SM-N960N / crownlte).
#
# WHY THIS EXISTS
#   The phone runs LineageOS 20 (20.0-20241226-NIGHTLY-crownlte) on kernel
#   4.9.118-g6a9461f9460c. Before a UAC2 kernel can be built on top of it, the
#   baseline has to be proven reproducible: build the pinned commit with the
#   official recipe and the result must match the kernel inside the ROM's
#   boot.img. If the baseline does not match, no UAC2 result can be trusted
#   either — a difference in the output could equally come from the UAC2 change
#   or from the build environment.
#
# WHAT THIS DOES NOT DO
#   It does not touch boot packaging. No boot.img splice, no Odin package, no
#   AnyKernel3, no TWRP zip, no vendor partition, no init rc. Those are separate
#   steps that must not be entangled with proving the baseline.
#
# GATE ORDER (each step fails closed)
#   source identity -> toolchain identity -> baseline build -> ROM comparison
#   -> config comparison -> (only then) UAC2 build
#
# The UAC2 step is entered only when every earlier marker is PASS. A SHA256
# mismatch against the ROM is reported as REVIEW_REQUIRED rather than treated as
# a failure, because a mismatch has causes that need reading, not retrying.

name: Note9 LineageOS 20 Kernel Gate (public build farm)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/note9-lineage20-kernel.yml"
  workflow_dispatch:
    inputs:
      build_mode:
        description: baseline | uac2 | compare
        type: string
        default: compare
        required: true

permissions:
  contents: read

env:
  BUILD_MODE: ${{ inputs.build_mode || 'compare' }}
  KERNEL_REPO_URL: https://github.com/LineageOS/android_kernel_samsung_exynos9810
  KERNEL_BRANCH: lineage-20
  KERNEL_COMMIT: 6a9461f9460ca51d1217e5069a5d5556fcc79e63
  DEFCONFIG: exynos9810-crownlte_defconfig
  ARCH: arm64
  # The stock kernel carried by the ROM's boot.img, and the size any replacement
  # must equal. Taken from work/lineage20/bootimg/boot_header_forensics.txt.
  ROM_KERNEL_SIZE: "29028372"
  ROM_KERNEL_SHA256: 96b54bc6a37c8b1b3504018e688c3d6ca34779a47b34e38f2b2442531174f073
  # The config the phone reports through /proc/config.gz, used as the reference
  # for the config comparison. Captured read-only from the running ROM and
  # committed into this repository, so the gate is reproducible on a runner with
  # no phone attached.
  ROM_CONFIG_REF: baseline-ref/rom-proc-config.txt

jobs:
  gate:
    name: kernel gate (${{ inputs.build_mode || 'compare' }})
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: "runner facts"
        run: |
          set -uo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          echo "RUNNER_ARCH=$RUNNER_ARCH"
          echo "IMAGE=$(cat /etc/os-release | grep PRETTY_NAME | cut -d= -f2-)"
          nproc; free -g | head -2; df -h / | tail -1

      # ------------------------------------------------------------------ assets
      - name: "stage ROM reference config"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The phone's /proc/config.gz, captured read-only from the running ROM.
          # Fetched from the release rather than vendored into this repository: it
          # is 164 KB of machine-generated text that changes on every ROM build,
          # and keeping it in git would mean a commit for every nightly. The gate
          # therefore downloads the exact copy this run compares against and
          # records its sha256, so the comparison is still pinned.
          mkdir -p evidence baseline-ref
          echo "ROM_CONFIG_REF=release:lo20-baseline-ref/rom-proc-config.txt"
          if gh release download lo20-baseline-ref \
                --repo "$GITHUB_REPOSITORY" \
                --pattern "rom-proc-config.txt" \
                --dir baseline-ref --clobber; then
            echo "ROM_CONFIG_SOURCE=release lo20-baseline-ref"
          else
            echo "ROM_CONFIG_SOURCE=checkout fallback"
            test -f "$GITHUB_WORKSPACE/$ROM_CONFIG_REF" || {
              echo "ROM_CONFIG_MISSING (release download failed and no committed copy)"
              exit 1
            }
            cp "$GITHUB_WORKSPACE/$ROM_CONFIG_REF" baseline-ref/rom-proc-config.txt
          fi
          REF=baseline-ref/rom-proc-config.txt
          echo "ROM_CONFIG_REF_SHA256=$(sha256sum "$REF" | awk '{print $1}')"
          echo "ROM_CONFIG_REF_LINES=$(grep -c '^CONFIG' "$REF")"
          # The baseline this gate compares against must not have UAC2; if the ROM
          # ever ships with it enabled, the premise of a one-line diff is gone.
          grep -E "^# CONFIG_USB_CONFIGFS_F_UAC2 is not set$" "$REF" >/dev/null || {
            echo "ROM_CONFIG_PRECONDITION=FAIL (ROM does not have F_UAC2 disabled)"
            exit 1
          }
          echo "ROM_CONFIG_PRECONDITION=PASS (F_UAC2 is not set in the ROM config)"

      - name: "source identity — checkout the pinned commit"
        run: |
          set -euo pipefail
          echo "KERNEL_REPO=$KERNEL_REPO_URL"
          echo "KERNEL_BRANCH=$KERNEL_BRANCH"
          echo "EXPECTED_COMMIT=$KERNEL_COMMIT"
          mkdir -p evidence
          {
            echo "KERNEL_REPO=$KERNEL_REPO_URL"
            echo "KERNEL_BRANCH=$KERNEL_BRANCH"
            echo "EXPECTED_COMMIT=$KERNEL_COMMIT"
          } > evidence/source-identity.txt

          # Full clone, no sparse checkout, no exclusion of anything. A previous
          # attempt did this on Windows and had to drop drivers/gpu/drm/nouveau
          # because "aux.c" is a reserved filename there; on Linux that problem
          # does not exist and excluding it would break the "identical to the ROM
          # build" claim, so the tree must be whole.
          git clone --no-single-branch "$KERNEL_REPO_URL" src
          cd src
          # Checkout the pinned commit by full hash. Never follow the branch head:
          # lineage-20 could move, and the gate must test one specific tree.
          git checkout --detach "$KERNEL_COMMIT"

          ACTUAL_COMMIT="$(git rev-parse HEAD)"
          echo "ACTUAL_COMMIT=$ACTUAL_COMMIT"
          if [ "$ACTUAL_COMMIT" != "$KERNEL_COMMIT" ]; then
            echo "SOURCE_IDENTITY=FAIL (wanted $KERNEL_COMMIT, got $ACTUAL_COMMIT)"
            exit 1
          fi
          TREE_TAG="$(git describe --tags --always 2>/dev/null || echo none)"
          echo "TREE_TAG=$TREE_TAG"
          echo "SOURCE_IDENTITY=PASS" | tee -a evidence/source-identity.txt

      # ---------------------------------------------------------------- STEP 3
      - name: "toolchain identity — AOSP clang r416183b"
        run: |
          set -euo pipefail
          mkdir -p "$HOME/toolchains"

          # The phone's /proc/version says: Android (7284624, based on r416183b)
          # clang version 12.0.5. r416183b is an AOSP prebuilts revision of clang.
          # Fetch exactly that revision; a nearby clang is not a substitute,
          # because a different clang changes the emitted code and would make a
          # byte-for-byte comparison against the ROM meaningless.
          AOSP_REPO="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86"
          REV="clang-r416183b"
          echo "CLANG_REPO=$AOSP_REPO"
          echo "CLANG_TAG_REV=$REV"

          if ! git clone --depth 1 --branch "$REV" "$AOSP_REPO" "$HOME/toolchains/clang" 2>&1 | tail -3; then
            echo "CLANG_TAG_REV_LOOKUP=FAILED"
          fi

          # Locate the clang binary inside the prebuilt tree.
          CLANG_BIN="$(find "$HOME/toolchains/clang" -type f -name clang -perm -u+x 2>/dev/null | head -1)"
          if [ -z "$CLANG_BIN" ]; then
            echo "TOOLCHAIN_IDENTITY=FAIL (no clang binary found under $HOME/toolchains/clang)"
            echo "  The prebuilt tree for $REV could not be fetched. Refusing to"
            echo "  continue with a different clang — that would invalidate the"
            echo "  byte-for-byte comparison against the ROM kernel."
            exit 1
          fi
          CLANG_DIR="$(dirname "$CLANG_BIN")"
          CLANG_PATH="$CLANG_DIR"
          echo "CLANG_PATH=$CLANG_PATH"

          # Verify the identity rather than trusting the tag name.
          RAW_VER="$("$CLANG_BIN" --version 2>/dev/null | head -3)"
          echo "CLANG_VERSION_RAW=$RAW_VER"
          if ! echo "$RAW_VER" | grep -q "12\.0\.5"; then
            echo "TOOLCHAIN_IDENTITY=FAIL (clang does not report 12.0.5)"
            exit 1
          fi
          if ! echo "$RAW_VER" | grep -qi "r416183b"; then
            echo "TOOLCHAIN_IDENTITY=FAIL (clang does not report r416183b)"
            echo "  got: $RAW_VER"
            exit 1
          fi
          CLANG_VERSION="$("$CLANG_BIN" --version | head -1)"
          CLANG_REVISION="r416183b"
          echo "CLANG_VERSION=$CLANG_VERSION"
          echo "CLANG_REVISION=$CLANG_REVISION"

          LD_VERSION="$(ld --version | head -1)"
          MAKE_VERSION="$(make --version | head -1)"
          echo "LD_VERSION=$LD_VERSION"
          echo "MAKE_VERSION=$MAKE_VERSION"

          mkdir -p evidence
          {
            echo "CLANG_PATH=$CLANG_PATH"
            echo "CLANG_VERSION=$CLANG_VERSION"
            echo "CLANG_REVISION=$CLANG_REVISION"
            echo "LD_VERSION=$LD_VERSION"
            echo "MAKE_VERSION=$MAKE_VERSION"
            echo "TOOLCHAIN_IDENTITY=PASS"
          } > evidence/toolchain.txt
          cat evidence/toolchain.txt

      # ---------------------------------------------------------------- STEP 4
      - name: "baseline defconfig"
        run: |
          set -euo pipefail
          cd src
          DEFCONFIG_PATH="arch/$ARCH/configs/$DEFCONFIG"
          test -f "$DEFCONFIG_PATH" || { echo "DEFCONFIG_MISSING=$DEFCONFIG_PATH"; exit 1; }
          DEFCONFIG_SHA256="$(sha256sum "$DEFCONFIG_PATH" | awk '{print $1}')"
          echo "DEFCONFIG_PATH=$DEFCONFIG_PATH"
          echo "DEFCONFIG_SHA256=$DEFCONFIG_SHA256"

          export PATH="$CLANG_PATH:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          # CROSS_COMPILE is empty in the defconfig; the kernel is built with clang
          # directly, so no gcc prefix is used.
          export CROSS_COMPILE=
          export LLVM=1
          make O=../build-baseline ARCH=arm64 "$DEFCONFIG" 2>&1 | tail -20

          mkdir -p ../evidence/baseline
          cp ../build-baseline/.config ../evidence/baseline/.config
          GENERATED_CONFIG_SHA256="$(sha256sum ../build-baseline/.config | awk '{print $1}')"
          echo "GENERATED_CONFIG_SHA256=$GENERATED_CONFIG_SHA256"

          # The baseline must not have UAC2. If it does, the defconfig changed
          # underneath us and the whole premise ("only one config line differs")
          # is wrong.
          if grep -qE "^CONFIG_USB_CONFIGFS_F_UAC2=y" ../build-baseline/.config; then
            echo "BASELINE_CONFIG_UAC2=SET (unexpected — the pinned defconfig already enables it)"
            exit 1
          fi
          echo "BASELINE_CONFIG_UAC2=# CONFIG_USB_CONFIGFS_F_UAC2 is not set"

          {
            echo "DEFCONFIG=$DEFCONFIG"
            echo "DEFCONFIG_PATH=$DEFCONFIG_PATH"
            echo "DEFCONFIG_SHA256=$DEFCONFIG_SHA256"
            echo "GENERATED_CONFIG_SHA256=$GENERATED_CONFIG_SHA256"
            echo "ARCH=$ARCH"
            echo "CROSS_COMPILE=(empty)"
            echo "LLVM=1"
            echo "CLANG=$CLANG_PATH"
            echo "BASELINE_CONFIG_UAC2=# CONFIG_USB_CONFIGFS_F_UAC2 is not set"
          } > ../evidence/baseline/build-recipe.txt
          echo "$GENERATED_CONFIG_SHA256  .config" > ../evidence/baseline/config.sha256

      # ---------------------------------------------------------------- STEP 5
      - name: "baseline build"
        run: |
          set -euo pipefail
          cd src
          export PATH="$CLANG_PATH:$PATH"
          export ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE= LLVM=1
          mkdir -p ../evidence/baseline
          set +e
          make O=../build-baseline ARCH=arm64 -j"$(nproc)" Image \
            2>&1 | tee ../evidence/baseline/build.log | tail -30
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "BASELINE_BUILD=FAIL (make exited $rc)"
            exit 1
          fi
          test -f ../build-baseline/arch/arm64/boot/Image || {
            echo "BASELINE_BUILD=FAIL (no Image produced)"; exit 1; }

          SIZE="$(stat -c '%s' ../build-baseline/arch/arm64/boot/Image)"
          SHA="$(sha256sum ../build-baseline/arch/arm64/boot/Image | awk '{print $1}')"
          KVER="$(strings ../build-baseline/arch/arm64/boot/Image | grep -m1 -oE 'Linux version [^ ]+')"
          echo "BASELINE_IMAGE_SIZE=$SIZE"
          echo "BASELINE_IMAGE_SHA256=$SHA"
          echo "BASELINE_KERNEL_VERSION=$KVER"
          echo "$SHA  Image" > ../evidence/baseline/Image.sha256
          cp ../build-baseline/arch/arm64/boot/Image ../evidence/baseline/Image
          echo "BASELINE_BUILD=PASS"

      # ---------------------------------------------------------------- STEP 6
      - name: "ROM kernel comparison"
        run: |
          set -euo pipefail
          SIZE="$(cat evidence/baseline/Image.sha256 | awk '{print $1}' >/dev/null; stat -c '%s' evidence/baseline/Image)"
          SHA="$(awk '{print $1}' evidence/baseline/Image.sha256)"

          SIZE_MATCH=NO
          [ "$SIZE" = "$ROM_KERNEL_SIZE" ] && SIZE_MATCH=YES
          SHA256_MATCH=NO
          [ "$SHA" = "$ROM_KERNEL_SHA256" ] && SHA256_MATCH=YES

          echo "BASELINE_IMAGE_SIZE=$SIZE"
          echo "BASELINE_IMAGE_SHA256=$SHA"
          echo "ROM_KERNEL_SIZE=$ROM_KERNEL_SIZE"
          echo "ROM_KERNEL_SHA256=$ROM_KERNEL_SHA256"
          echo "SIZE_MATCH=$SIZE_MATCH"
          echo "SHA256_MATCH=$SHA256_MATCH"

          if [ "$SIZE_MATCH" = "YES" ] && [ "$SHA256_MATCH" = "YES" ]; then
            echo "BASELINE_GATE=PASS"
          else
            # Not a failure — a difference that has to be read. A UAC2 build on
            # top of an unexplained baseline is meaningless, so the run stops
            # here and leaves the analysis for a human.
            echo "BASELINE_GATE=REVIEW_REQUIRED"
            {
              echo "Baseline vs ROM kernel — differences that need explaining"
              echo "========================================================"
              echo
              echo "sizes      baseline=$SIZE rom=$ROM_KERNEL_SIZE   match=$SIZE_MATCH"
              echo "sha256     baseline=$SHA"
              echo "           rom     =$ROM_KERNEL_SHA256   match=$SHA256_MATCH"
              echo
              echo "--- baseline embedded kernel version string ---"
              strings evidence/baseline/Image | grep -m1 "Linux version" || echo "(none found)"
              echo
              echo "--- baseline embedded compiler string ---"
              strings evidence/baseline/Image | grep -m1 -oE "clang version [0-9.]+[^)]*" || echo "(none found)"
              echo
              echo "Expected (from the ROM's own kernel, copied from the extracted"
              echo "stock Image): 4.9.118-g6a9461f9460c, clang 12.0.5 (r416183b)"
              echo
              echo "--- build timestamp / reproducible-build hints ---"
              strings evidence/baseline/Image | grep -m5 -iE "UTS_RELEASE|build id|SMP PREEMPT" || echo "(none found)"
              echo
              echo "--- config fingerprint present in the image? ---"
              strings evidence/baseline/Image | grep -m3 -iE "IKCFG|build version|config.gz" || echo "(no embedded config signature)"
            } > evidence/baseline-vs-rom-analysis.txt
            cat evidence/baseline-vs-rom-analysis.txt
            exit 1
          fi

      # ---------------------------------------------------------------- STEP 7
      - name: "config comparison against the ROM"
        run: |
          set -euo pipefail
          test -f "$GITHUB_WORKSPACE/$ROM_CONFIG_REF" || {
            echo "ROM_CONFIG_REF_MISSING=$ROM_CONFIG_REF"; exit 1; }
          # Normalise both sides to "CONFIG_X=y" or "# CONFIG_X is not set" so the
          # diff is line-comparable.
          norm() {
            grep -E "^(CONFIG_[A-Za-z0-9_]+=|# CONFIG_[A-Za-z0-9_]+ is not set)" "$1" \
              | sed 's/[[:space:]]*=[[:space:]]*\(.*\)$/=\1/' | sort -u
          }
          norm evidence/baseline/.config > /tmp/baseline.norm
          norm "$GITHUB_WORKSPACE/$ROM_CONFIG_REF" > /tmp/rom.norm

          diff -u /tmp/rom.norm /tmp/baseline.norm > evidence/config.diff || true
          COUNT="$(grep -cE '^[+-]CONFIG_' evidence/config.diff || true)"
          echo "CONFIG_DIFF_COUNT=$COUNT"

          # Drift is unexpected unless it is a recognised, benign difference. The
          # known-benign classes are listed explicitly; anything else stops the run
          # rather than being waved through.
          BENIGN=0
          UNEXPECTED=0
          if [ "$COUNT" != "0" ]; then
            # Everything the baseline sets that the ROM does not have, and vice
            # versa, listed so it can be read rather than trusted.
            grep -E '^\+CONFIG_' evidence/config.diff | sed 's/^+//' | sort > /tmp/only_baseline
            grep -E '^-CONFIG_' evidence/config.diff | sed 's/^-//' | sort > /tmp/only_rom
            {
              echo "--- present only in the baseline build ---"
              cat /tmp/only_baseline
              echo
              echo "--- present only in the ROM's /proc/config.gz ---"
              cat /tmp/only_rom
            } > evidence/config-drift-detail.txt
            echo "UNEXPECTED_CONFIG_DRIFT=REVIEW (see evidence/config-drift-detail.txt)"
            UNEXPECTED=1
          else
            echo "UNEXPECTED_CONFIG_DRIFT=0"
          fi

          # A config difference is not automatically a failure, but the gate may
          # only be called PASS when there is nothing to review.
          if [ "$UNEXPECTED" != "0" ]; then
            echo "BASELINE_GATE=REVIEW_REQUIRED (config drift present)"
            exit 1
          fi
          echo "CONFIG_GATE=PASS"
          # Only a config comparison with nothing outstanding may open the gate
          # for the UAC2 step. Written as a file because each `run:` block is a
          # fresh shell and cannot see the previous step's variables.
          echo "GATE_OPEN=yes" > evidence/gate.marker

      # ---------------------------------------------------------------- STEP 9
      - name: "uac2 build (minimum single-config change)"
        if: ${{ env.BUILD_MODE == 'uac2' || env.BUILD_MODE == 'compare' }}
        run: |
          set -euo pipefail
          test -f evidence/gate.marker || {
            echo "UAC2_BUILD=BLOCKED (earlier gate step did not write its marker)"
            exit 1
          }
          cat evidence/gate.marker

          # A second clean tree from the same pinned commit. Not a copy of the
          # baseline tree: the point is that the only difference between the two
          # builds is the single config line.
          cd ..
          git clone --reference src "$KERNEL_REPO_URL" src-uac2
          cd src-uac2
          git checkout --detach "$KERNEL_COMMIT"
          ACTUAL="$(git rev-parse HEAD)"
          test "$ACTUAL" = "$KERNEL_COMMIT" || { echo "UAC2 source commit mismatch: $ACTUAL"; exit 1; }

          export PATH="$CLANG_PATH:$PATH"
          export ARCH=arm64 SUBARCH=arm64 CROSS_COMPILE= LLVM=1
          make O=../build-uac2 ARCH=arm64 "$DEFCONFIG" 2>&1 | tail -10

          # The one and only change: turn UAC2 on. Nothing else. In particular not
          # UAC1, not ECM, not other functions — every extra USB function changes
          # the gadget's descriptor and therefore the device's USB identity.
          sed -i 's/^# CONFIG_USB_CONFIGFS_F_UAC2 is not set$/CONFIG_USB_CONFIGFS_F_UAC2=y/' \
            ../build-uac2/.config
          grep -qE "^CONFIG_USB_CONFIGFS_F_UAC2=y" ../build-uac2/.config || {
            echo "UAC2 patch did not apply"; exit 1; }

          mkdir -p ../evidence/uac2
          # Prove the diff really is one line.
          diff -u evidence/baseline/.config ../build-uac2/.config > ../evidence/uac2/config.diff || true
          CHANGED="$(grep -cE '^[+-]CONFIG_' ../evidence/uac2/config.diff || true)"
          echo "EXPECTED_CONFIG_CHANGE=CONFIG_USB_CONFIGFS_F_UAC2"
          echo "UAC2_CONFIG_LINES_CHANGED=$CHANGED"
          if [ "$CHANGED" != "2" ]; then   # one removal + one addition
            echo "UNEXPECTED_CONFIG_DRIFT=$CHANGED (expected exactly 2: one - and one +)"
            cat ../evidence/uac2/config.diff
            exit 1
          fi
          echo "UNEXPECTED_CONFIG_DRIFT=0"

          set +e
          make O=../build-uac2 ARCH=arm64 -j"$(nproc)" Image \
            2>&1 | tee ../evidence/uac2/build.log | tail -25
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -eq 0 || { echo "UAC2 build failed, see evidence/uac2/build.log"; exit 1; }

          SIZE="$(stat -c '%s' ../build-uac2/arch/arm64/boot/Image)"
          SHA="$(sha256sum ../build-uac2/arch/arm64/boot/Image | awk '{print $1}')"
          KVER="$(strings ../build-uac2/arch/arm64/boot/Image | grep -m1 -oE 'Linux version [^ ]+')"
          echo "UAC2_IMAGE_SIZE=$SIZE"
          echo "UAC2_IMAGE_SHA256=$SHA"
          echo "UAC2_KERNEL_VERSION=$KVER"
          echo "$SHA  Image" > ../evidence/uac2/Image.sha256
          cp ../build-uac2/arch/arm64/boot/Image ../evidence/uac2/Image
          cp ../build-uac2/.config ../evidence/uac2/.config
          echo "UAC2_CONFIG_VERIFIED=PASS"
          echo "UAC2_BUILD=PASS"
          echo "NOTE=UAC2 Image validated; package only after all gates pass"

      # ---------------------------------------------------------------- STEP 10
      - name: "package validated UAC2 Image with pinned AnyKernel3"
        if: ${{ env.BUILD_MODE == 'uac2' || env.BUILD_MODE == 'compare' }}
        run: |
          set -euo pipefail
          test -f evidence/gate.marker
          test -f evidence/uac2/Image
          grep -q '^CONFIG_USB_CONFIGFS_F_UAC2=y$' evidence/uac2/.config

          AK3_COMMIT="020dfeccf9d7e962a48400fc94d3e451df92eead"
          WORK="$RUNNER_TEMP/ak3"
          OUTDIR="$GITHUB_WORKSPACE/evidence/package"
          ZIP="$OUTDIR/Note9-LineageOS20-UAC2-SM-N960N-${GITHUB_RUN_ID}.zip"
          rm -rf "$WORK"
          mkdir -p "$OUTDIR"

          git clone https://github.com/osm0sis/AnyKernel3.git "$WORK"
          git -C "$WORK" checkout --detach "$AK3_COMMIT"
          test "$(git -C "$WORK" rev-parse HEAD)" = "$AK3_COMMIT"
          rm -rf "$WORK/.git"

          printf '%s\n' \
            "# AnyKernel3 Ramdisk Mod Script" \
            "properties() { '" \
            "kernel.string=Note9 LineageOS 20 UAC2 for SM-N960N / crownlte" \
            "do.devicecheck=1" \
            "do.modules=0" \
            "do.systemless=1" \
            "do.cleanup=1" \
            "do.cleanuponabort=0" \
            "device.name1=crownlte" \
            "device.name2=crownlteks" \
            "device.name3=" \
            "device.name4=" \
            "device.name5=" \
            "supported.versions=13" \
            "supported.patchlevels=" \
            "'; }" \
            "BLOCK=auto;" \
            "IS_SLOT_DEVICE=0;" \
            "RAMDISK_COMPRESSION=auto;" \
            "PATCH_VBMETA_FLAG=auto;" \
            ". tools/ak3-core.sh;" \
            "dump_boot;" \
            "write_boot;" > "$WORK/anykernel.sh"

          cp evidence/uac2/Image "$WORK/Image"
          rm -rf "$WORK/modules" "$WORK/ramdisk" "$WORK/patch" 2>/dev/null || true
          find "$WORK" -name placeholder -delete

          (cd "$WORK" && zip -r9 "$ZIP" . -x 'README.md' '.git/*' >/dev/null)
          unzip -t "$ZIP" >/dev/null
          test "$(unzip -Z1 "$ZIP" | grep -c '^Image$')" = "1"
          test "$(unzip -Z1 "$ZIP" | grep -Ec '(^|/)(boot|recovery|vendor|system).*\\.(img|lz4)$' || true)" = "0"

          IMAGE_SHA="$(sha256sum evidence/uac2/Image | awk '{print $1}')"
          ZIP_IMAGE_SHA="$(unzip -p "$ZIP" Image | sha256sum | awk '{print $1}')"
          test "$IMAGE_SHA" = "$ZIP_IMAGE_SHA"
          ZIP_SHA="$(sha256sum "$ZIP" | awk '{print $1}')"
          {
            echo "PACKAGE_GATE=PASS"
            echo "PACKAGE_FORMAT=AnyKernel3"
            echo "AK3_COMMIT=$AK3_COMMIT"
            echo "TARGET=SM-N960N/crownlte"
            echo "ANDROID=13"
            echo "KERNEL_IMAGE_SHA256=$IMAGE_SHA"
            echo "PACKAGE_SHA256=$ZIP_SHA"
            echo "PACKAGE_FILE=$(basename "$ZIP")"
            echo "BOOT_IMG_EMBEDDED=NO"
            echo "RAMDISK_REPLACED=NO"
            echo "DTB_REPLACED=NO"
            echo "MODULES_INCLUDED=NO"
          } | tee "$OUTDIR/PACKAGE_MANIFEST.txt"

      - name: "publish validated package to private note9-01 release"
        if: ${{ env.BUILD_MODE == 'uac2' || env.BUILD_MODE == 'compare' }}
        env:
          GH_TOKEN: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "${GH_TOKEN:-}" || { echo "PRIVATE_UPLOAD=FAIL (token missing)"; exit 1; }
          ZIP="$(find evidence/package -maxdepth 1 -name 'Note9-LineageOS20-UAC2-*.zip' -print -quit)"
          test -n "$ZIP" && test -f "$ZIP"
          TAG="lineage20-uac2-run-${GITHUB_RUN_ID}"
          gh release create "$TAG" "$ZIP" evidence/package/PACKAGE_MANIFEST.txt \
            --repo Sharkecho/note9-01 \
            --title "Note9 LineageOS 20 UAC2 — run ${GITHUB_RUN_ID}" \
            --notes "Fail-closed build: pinned LineageOS 20 kernel; only CONFIG_USB_CONFIGFS_F_UAC2=y; pinned AnyKernel3. Verify PACKAGE_MANIFEST.txt before flashing."
          echo "PRIVATE_UPLOAD=PASS" | tee evidence/package/private-upload.txt
          echo "PRIVATE_RELEASE_TAG=$TAG" | tee -a evidence/package/private-upload.txt

      - name: "upload package fallback artifact"
        if: ${{ env.BUILD_MODE == 'uac2' || env.BUILD_MODE == 'compare' }}
        uses: actions/upload-artifact@v4
        with:
          name: note9-lineage20-uac2-package
          path: evidence/package/
          if-no-files-found: error
          retention-days: 30

      - name: "summary"
        if: always()
        run: |
          set -uo pipefail
          {
            echo "Note9 LineageOS 20 kernel gate"
            echo "run            : $GITHUB_RUN_ID"
            echo "build_mode     : $BUILD_MODE"
            echo "kernel repo    : $KERNEL_REPO_URL"
            echo "kernel branch  : $KERNEL_BRANCH"
            echo "kernel commit  : $KERNEL_COMMIT"
            echo "defconfig      : $DEFCONFIG"
            echo
            echo "ROM_KERNEL_SIZE=$ROM_KERNEL_SIZE"
            echo "ROM_KERNEL_SHA256=$ROM_KERNEL_SHA256"
            for m in SOURCE_IDENTITY TOOLCHAIN_IDENTITY BASELINE_BUILD BASELINE_GATE CONFIG_GATE UAC2_BUILD UAC2_CONFIG_VERIFIED; do
              val="(not reached)"
              grep -h "^$m=" evidence/*.txt evidence/baseline/*.txt evidence/uac2/*.txt 2>/dev/null | tail -1 | sed 's/^/  /'
              echo "$m=$val"
            done
            echo
            echo "DEVICE_WRITES=0"
            echo "No raw boot.img/Odin image/vendor/init rc modification is produced."
            echo "AnyKernel3 package is created only after every kernel gate passes."
          } | tee evidence/SUMMARY.txt

      # ---------------------------------------------------------------- STEP 12
      - name: "upload evidence"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: note9-lineage20-kernel-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 90

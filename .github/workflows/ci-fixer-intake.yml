name: CI Fixer Intake

on:
  workflow_run:
    workflows:
      - "Note9 LiveOS LineageOS 20 Baseline"
      - "Note9-01 Kernel Build (public build farm)"
    types: [completed]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  intake:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Create CI failure intake issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const project = run.name.includes('LineageOS 20 Baseline')
              ? 'LiveOS'
              : run.name.includes('Note9-01 Kernel Build')
                ? 'Note9-Kernel'
                : 'UNKNOWN';

            const marker = `<!-- ci-fixer-run:${run.id} -->`;
            const title = `[CI-FIXER][${project}] ${run.name} #${run.run_number} failed`;
            const body = [
              marker,
              '',
              '## Automated CI failure intake',
              `- Project: **${project}**`,
              `- Workflow: **${run.name}**`,
              `- Run: ${run.html_url}`,
              `- Run ID: \`${run.id}\``,
              `- Commit: \`${run.head_sha}\``,
              `- Branch: \`${run.head_branch}\``,
              `- Conclusion: **${run.conclusion}**`,
              '',
              '## CI-Fixer protocol',
              '1. Read Engineering-Control/AGENTS.md and the matching project definition.',
              '2. Read this exact run, jobs, logs and diagnostic artifacts.',
              '3. Classify the root cause before changing code.',
              '4. Do not blindly rerun deterministic failures.',
              '5. Make the smallest necessary fix.',
              '6. Validate only the affected path, preserve rollback, and attach CI evidence.',
              '',
              'Control plane: Sharkecho/Engineering-Control',
              'Agent role: .github/agents/ci-fixer.agent.md'
            ].join('\n');

            const {data: issues} = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100
            });
            if (issues.some(i => (i.body || '').includes(marker))) {
              core.info('CI-Fixer intake already exists for this run.');
              return;
            }
            const created = await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: []
            });
            core.info(`Created CI-Fixer intake issue #${created.data.number}`);

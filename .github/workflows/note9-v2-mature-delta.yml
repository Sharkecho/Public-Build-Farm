name: Note9 V2 — Mature Delta Build
on:
  workflow_dispatch:
permissions:
  contents: read
env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_exynos9810
  KERNEL_COMMIT: 6a9461f9460ca51d1217e5069a5d5556fcc79e63
  DEFCONFIG: exynos9810-crownlte_defconfig
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r416183/clang-r416183.tar.gz
  APOLLO_URL: https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    env:
      ARCH: arm64
      SUBARCH: arm64
      ANDROID_MAJOR_VERSION: q
      PLATFORM_VERSION: 13.0.0
    steps:
      - name: Install mature build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev python3 curl libfdt-dev zip
      - name: Checkout exact running-kernel source
        run: |
          set -euo pipefail
          git clone --filter=blob:none "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach "$KERNEL_COMMIT"
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
      - name: Install pinned AOSP Clang and Apollo GCC companion
        run: |
          set -euo pipefail
          mkdir -p compiler/clang-r416183
          curl -fL --retry 4 "$CLANG_URL" | tar -xz -C compiler/clang-r416183
          curl -fL --retry 5 -o apollo.tar.gz "$APOLLO_URL"
          mkdir apollo && tar -xzf apollo.tar.gz -C apollo
          ROOT="$(find apollo -mindepth 1 -maxdepth 1 -type d | head -1)"
          TC="$ROOT/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          mkdir -p kernel/toolchain/gcc-cfp/gcc-ibv-jopp
          cp -a "$TC" kernel/toolchain/gcc-cfp/gcc-ibv-jopp/
          DEST="$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          find "$DEST/bin" -type f -exec chmod +x {} +
          find "$DEST/libexec" -type f -exec chmod +x {} + || true
          LTO="$DEST/libexec/gcc/aarch64-linux-android/4.9.x"
          ln -sfn liblto_plugin.so.0.0.0 "$LTO/liblto_plugin.so.0"
          ln -sfn liblto_plugin.so.0 "$LTO/liblto_plugin.so"
      - name: Apply proven Apollo DPU patch plus minimal V2 compatibility
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/video/fbdev/exynos/dpu_9810/decon_reg.c")
          s=p.read_text()
          s=s.replace("const double decon_clocks_table[][CLK_ID_MAX] = {","const unsigned long decon_clocks_table[][CLK_ID_MAX] = {")
          s=s.replace("{41.7, 137.5, 400, 66, 62.5, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},","{41, 137, 400, 66, 62, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},")
          s=s.replace("{ 141, 137.5, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},","{ 141, 137, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},")
          p.write_text(s)
          p=Path("drivers/usb/gadget/configfs.c")
          s=p.read_text()
          inc="#include <linux/usblog_proc_notify.h>"
          anchor="#include <linux/soc/samsung/exynos-soc.h>"
          if inc not in s:
              if anchor not in s: raise SystemExit("configfs include anchor missing")
              s=s.replace(anchor, anchor+"\\n"+inc)
          p.write_text(s)
          PY
      - name: Build V2 from proven mature UAC2 pattern
        working-directory: kernel
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/compiler/clang-r416183"
          export PATH="$TC/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=format -Wno-error=enum-compare"
          mkdir -p out/uac2
          make O=out/uac2 ARCH=arm64 "$DEFCONFIG"
          scripts/config --file out/uac2/.config -e USB_CONFIGFS_F_UAC2
          scripts/config --file out/uac2/.config -d USB_G_ANDROID
          scripts/config --file out/uac2/.config -d USB_ANDROID_SAMSUNG_COMPOSITE
          make O=out/uac2 ARCH=arm64 olddefconfig
          grep '^CONFIG_USB_CONFIGFS_F_UAC2=y$' out/uac2/.config
          grep '^# CONFIG_USB_G_ANDROID is not set$' out/uac2/.config
          grep '^# CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE is not set$' out/uac2/.config
          make O=out/uac2 ARCH=arm64 -j"$(nproc)"
          test -s out/uac2/arch/arm64/boot/Image
          test -s out/uac2/drivers/usb/gadget/function/f_uac2.o
          test -s out/uac2/drivers/usb/gadget/function/usb_f_uac2.o
          cp out/uac2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.v2"
          cp out/uac2/.config "$GITHUB_WORKSPACE/V2.config"
          sha256sum "$GITHUB_WORKSPACE/Image.v2" "$GITHUB_WORKSPACE/V2.config" > "$GITHUB_WORKSPACE/SHA256SUMS"
      - name: Upload V2 mature delta checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: note9-v2-mature-delta-kernel
          path: |
            Image.v2
            V2.config
            SHA256SUMS
          retention-days: 30

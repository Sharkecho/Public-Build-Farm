name: Note9 Package Only

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Download verified Run 11 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir verified
          gh run download 37287043519 --repo "$GITHUB_REPOSITORY" --name note9-lineage20-uac2-kernel-payload --dir verified
          unzip -l verified/*.zip || true
          find verified -maxdepth 3 -type f -print

      - name: Verify frozen UAC2 Image identity
        run: |
          set -euo pipefail
          IMG="$(find verified -type f -name Image.uac2 | head -1)"
          test -s "$IMG"
          echo "3b70691c79625811fe0b53920046fde0cd3b6492d64784273b7e2034fd5021c6  $IMG" | sha256sum -c -
          cp "$IMG" Image.uac2

      - name: Import proven Apollo GCC 4.9 dependency
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/apollo.tar.gz"
          SRC="$RUNNER_TEMP/apollo-src"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 -o "$ARCHIVE" \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"
          mkdir -p "$SRC"
          tar -xzf "$ARCHIVE" -C "$SRC"
          ROOT="$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -1)"
          TOOLCHAIN="$ROOT/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          test -d "$TOOLCHAIN/bin"
          mkdir -p kernel/toolchain/gcc-cfp/gcc-ibv-jopp
          cp -a "$TOOLCHAIN" kernel/toolchain/gcc-cfp/gcc-ibv-jopp/
          DEST="$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          find "$DEST/bin" -type f -exec chmod +x {} +
          if [ -d "$DEST/libexec" ]; then find "$DEST/libexec" -type f -exec chmod +x {} +; fi
          LTO="$DEST/libexec/gcc/aarch64-linux-android/4.9.x"
          ln -sfn liblto_plugin.so.0.0.0 "$LTO/liblto_plugin.so.0"
          ln -sfn liblto_plugin.so.0 "$LTO/liblto_plugin.so"
          test -x "$DEST/bin/aarch64-linux-android-gcc"

      - name: Build crownlte DTBs only
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y device-tree-compiler
          git clone --filter=blob:none https://github.com/LineageOS/android_kernel_samsung_exynos9810 kernel-src
          cd kernel-src
          git fetch --depth=1 origin 6a9461f9460ca51d1217e5069a5d5556fcc79e63
          git checkout --detach 6a9461f9460ca51d1217e5069a5d5556fcc79e63
          cd "$GITHUB_WORKSPACE"
          cp -a kernel-src/. kernel/
          rm -rf kernel-src
          cd kernel
          mkdir -p out/dtb
          make O=out/dtb ARCH=arm64 exynos9810-crownlte_defconfig
          make O=out/dtb ARCH=arm64 dtbs -j"$(nproc)"
          mkdir -p "$GITHUB_WORKSPACE/dtbs"
          find out/dtb/arch/arm64/boot/dts/exynos -maxdepth 1 -type f -name 'exynos9810-crownlte_*.dtb' -exec cp {} "$GITHUB_WORKSPACE/dtbs/" \;
          test "$(find "$GITHUB_WORKSPACE/dtbs" -type f -name '*.dtb' | wc -l)" -gt 0

      - name: Build official LineageOS dtbhtoolExynos and dt.img
        run: |
          set -euo pipefail
          git clone --depth=1 --branch lineage-20 https://github.com/LineageOS/android_hardware_samsung hardware-samsung
          sudo apt-get install -y libfdt-dev
          cd hardware-samsung/dtbhtool
          gcc -O2 -Ilibdtbimg -I. mkdtbimg.c dtbimg.c -lfdt -o "$GITHUB_WORKSPACE/dtbhtoolExynos"
          "$GITHUB_WORKSPACE/dtbhtoolExynos" -o "$GITHUB_WORKSPACE/dt.img" -s 2048 "$GITHUB_WORKSPACE/dtbs"
          test -s "$GITHUB_WORKSPACE/dt.img"
          sha256sum "$GITHUB_WORKSPACE/dt.img" > "$GITHUB_WORKSPACE/dt.img.sha256"

      - name: Package verified kernel and Lineage DT image
        run: |
          set -euo pipefail
          mkdir -p package
          cp Image.uac2 package/kernel
          cp dt.img package/dt.img
          cat > package/IDENTITY.txt <<'EOF'
          DEVICE=SM-N960N
          CODENAME=crownlte
          ROM=LineageOS 20
          KERNEL_SOURCE=LineageOS/android_kernel_samsung_exynos9810
          KERNEL_COMMIT=6a9461f9460ca51d1217e5069a5d5556fcc79e63
          VERIFIED_BUILD_RUN=37287043519
          VERIFIED_IMAGE_SHA256=3b70691c79625811fe0b53920046fde0cd3b6492d64784273b7e2034fd5021c6
          UAC2=CONFIG_USB_CONFIGFS_F_UAC2=y
          EOF
          (cd package && sha256sum kernel dt.img > SHA256SUMS)
          zip -r9 Note9-N960N-Lineage20-UAC2-package-materials.zip package
          sha256sum Note9-N960N-Lineage20-UAC2-package-materials.zip > Note9-N960N-Lineage20-UAC2-package-materials.zip.sha256

      - name: Upload package-only artifact
        uses: actions/upload-artifact@v4
        with:
          name: note9-n960n-uac2-package-only
          path: |
            Note9-N960N-Lineage20-UAC2-package-materials.zip
            Note9-N960N-Lineage20-UAC2-package-materials.zip.sha256
            Image.uac2
            dt.img
            dt.img.sha256
          retention-days: 30

name: CodingOS Agent Canvas Build

on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full 40-character commit SHA in the approved CodingOS repository
        required: true
        type: string
      test_scope:
        description: Verification scope
        required: true
        default: targeted
        type: choice
        options:
          - targeted
          - extended
      publish_artifacts:
        description: Upload approved non-secret build metadata only
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: codingos-agent-canvas-${{ inputs.source_sha }}
  cancel-in-progress: false

env:
  SOURCE_REPOSITORY: Sharkecho/CodingOS-AgentCanvas
  REPORT_DIR: build-farm-reports/codingos

jobs:
  build:
    name: CodingOS (${{ inputs.test_scope }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Validate approved ref
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || { echo 'source_sha must be a full commit SHA' >&2; exit 1; }

      - name: Checkout approved private source
        uses: actions/checkout@v4
        with:
          repository: Sharkecho/CodingOS-AgentCanvas
          ref: ${{ inputs.source_sha }}
          token: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Record checked out SHA
        id: checkout_sha
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$SOURCE_SHA" ]] || { echo "Checkout SHA mismatch" >&2; exit 1; }
          echo "actual_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

      - name: Lint
        run: npm run lint

      - name: Targeted Vitest
        id: targeted_tests
        run: npm test -- --run --passWithNoTests __tests__/codingos

      - name: Application build
        id: app_build
        run: npm run build

      - name: Extended library build
        id: library_build
        if: inputs.test_scope == 'extended'
        run: npm run build:lib

      - name: Write redacted build metadata
        if: always()
        shell: bash
        env:
          SOURCE_SHA: ${{ inputs.source_sha }}
          TEST_SCOPE: ${{ inputs.test_scope }}
          JOB_STATUS: ${{ job.status }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ACTUAL_SHA: ${{ steps.checkout_sha.outputs.actual_sha }}
          TARGETED_TESTS_OUTCOME: ${{ steps.targeted_tests.outcome }}
          APP_BUILD_OUTCOME: ${{ steps.app_build.outcome }}
          LIBRARY_BUILD_OUTCOME: ${{ steps.library_build.outcome }}
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"
          node - <<'NODE'
          const fs = require('node:fs');
          const path = process.env.REPORT_DIR;
          const report = {
            project: 'CodingOS-AgentCanvas',
            sourceRepository: 'Sharkecho/CodingOS-AgentCanvas',
            requestedSourceSha: process.env.SOURCE_SHA,
            actualSourceSha: process.env.ACTUAL_SHA,
            testScope: process.env.TEST_SCOPE,
            status: process.env.JOB_STATUS,
            targetedTests: process.env.TARGETED_TESTS_OUTCOME,
            appBuild: process.env.APP_BUILD_OUTCOME,
            libraryBuild: process.env.LIBRARY_BUILD_OUTCOME,
            runId: process.env.RUN_ID,
            runAttempt: process.env.RUN_ATTEMPT,
          };
          fs.writeFileSync(`${path}/build-metadata.json`, `${JSON.stringify(report, null, 2)}\n`);
          NODE

      - name: Upload approved metadata
        if: always() && inputs.publish_artifacts == true
        uses: actions/upload-artifact@v4
        with:
          name: codingos-build-metadata-${{ github.run_id }}
          path: build-farm-reports/codingos/build-metadata.json
          if-no-files-found: error
          retention-days: 7

name: MT3000 single-package build (mqvpn + FEC)
# Build ONE package ipk against a chosen OMR release, without building the full image.
# NOTE: OMR build.sh with ONLY_PREPARE=yes does NOT clone the kernel/feed trees
# (the _get_repo block is guarded). We clone them explicitly at the pins that
# build.sh itself uses for OMR_KERNEL=6.18 @ v0.64.2, then run ONLY_PREPARE so
# it applies its patches/config/feeds logic on top.

on:
  workflow_dispatch:
    inputs:
      omr_ref:
        description: "Ysurac/openmptcprouter tag/branch (must match the device: v0.64.2)"
        required: true
        default: "v0.64.2"
        type: string
      omr_kernel:
        description: "OMR_KERNEL the device runs"
        required: true
        default: "6.18"
        type: string
      package:
        description: "feed package to build"
        required: true
        default: "mqvpn"
        type: string

concurrency:
  group: mt3000-pkg-${{ inputs.package }}-${{ inputs.omr_ref }}-${{ inputs.omr_kernel }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  OMR_TARGET: gl-mt3000
  GIT_TERMINAL_PROMPT: "0"

jobs:
  build-package:
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - name: Free disk space
        run: |
          echo "== before =="; df -h /
          sudo rm -rf /usr/share/dotnet /usr/share/swift /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/.ghcup \
                      /usr/local/share/boost /usr/local/share/chromium \
                      /usr/local/lib/node_modules /opt/microsoft/msedge \
                      /usr/share/miniconda /usr/share/firefox /opt/az || true
          sudo find /opt/hostedtoolcache -mindepth 1 -maxdepth 1 -exec rm -rf {} + || true
          sudo docker image prune -af || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "== after =="; df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools rsync scons squashfs-tools subversion swig texinfo \
            unzip help2man zlib1g-dev libelf-dev file wget curl quilt patch ccache time zstd

      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: omr-work/dl
          key: omr-dl-${{ inputs.omr_ref }}-${{ inputs.omr_kernel }}

      - name: Checkout OMR at the device-matching ref
        run: |
          set -eux
          git clone --depth 1 --branch "${{ inputs.omr_ref }}" \
            https://github.com/Ysurac/openmptcprouter omr-work/omr
          git -C omr-work/omr rev-parse HEAD

      - name: Clone openwrt + feeds at build.sh's pins for this kernel
        run: |
          set -eux
          mkdir -p omr-work/omr/gl-mt3000/${{ inputs.omr_kernel }}/source \
                   omr-work/omr/feeds/${{ inputs.omr_kernel }}
          # pins below mirror build.sh @ v0.64.2, OMR_KERNEL=6.18 branch
          _get_repo() {
            mkdir -p "$1"; cd "$1"
            [ -d .git ] || git init
            git remote add origin "$2" 2>/dev/null || git remote set-url origin "$2"
            git fetch origin -f
            git checkout -f "$3" -B build
            cd - >/dev/null
          }
          K=${{ inputs.omr_kernel }}
          SRC=omr-work/omr/gl-mt3000/$K/source
          git clone --filter=blob:none https://github.com/openwrt/openwrt "$SRC/openwrt-tmp"
          mv "$SRC/openwrt-tmp"/* "$SRC/openwrt-tmp"/.[!.]* "$SRC/" 2>/dev/null || true
          rmdir "$SRC/openwrt-tmp"
          git -C "$SRC" remote add origin https://github.com/openwrt/openwrt 2>/dev/null || true
          git -C "$SRC" fetch origin -f
          git -C "$SRC" checkout -f c0e9507c32f5f3729b324fe27308a9a63007f6c0 -B build
          _get_repo omr-work/omr/feeds/$K/packages https://github.com/openwrt/packages 42be0c979ddb3a39861df1f722fef62a60158f86
          _get_repo omr-work/omr/feeds/$K/luci     https://github.com/openwrt/luci     a3cc0e14419c96ca74578b792d306cba017b9e6d
          _get_repo omr-work/omr/feeds/$K/routing  https://github.com/openwrt/routing  c7872431105f69894201dc522b7560e47d1e8ba9
          git clone --depth 1 --branch develop https://github.com/ysurac/openmptcprouter-feeds omr-work/omr/feeds/openmptcprouter

      - name: Build prep (OMR build.sh, ONLY_PREPARE)
        env:
          OMR_FEED: feeds/openmptcprouter
          OMR_LOG: "yes"
        run: |
          cd omr-work/omr
          export OMR_RELEASE="${{ inputs.omr_ref }}"
          export OMR_KERNEL="${{ inputs.omr_kernel }}"
          ONLY_PREPARE=yes ./build.sh

      - name: Build host tools + cross toolchain
        run: |
          set -eux
          SRC="omr-work/omr/${OMR_TARGET}/${{ inputs.omr_kernel }}/source"
          ( cd "$SRC" && make -j"$(( $(nproc) + 1 ))" IGNORE_ERRORS=m tools/install ) > host-tools.log 2>&1 \
            || { tail -n 200 host-tools.log; exit 1; }
          ( cd "$SRC" && make -j"$(( $(nproc) + 1 ))" IGNORE_ERRORS=m toolchain/install ) > toolchain.log 2>&1 \
            || { tail -n 200 toolchain.log; exit 1; }
          ls "$SRC"/staging_dir/toolchain-*/bin/*-gcc >/dev/null

      - name: Build the package
        run: |
          set -eux
          SRC="omr-work/omr/${OMR_TARGET}/${{ inputs.omr_kernel }}/source"
          ( cd "$SRC" && make -j"$(( $(nproc) + 1 ))" \
              "package/feeds/openmptcprouter/${{ inputs.package }}/compile" ) > pkg-build.log 2>&1 \
            || { tail -n 300 pkg-build.log; exit 1; }
          tail -n 10 pkg-build.log

      - name: Locate artifact + checksums
        run: |
          set -eux
          SRC="omr-work/omr/${OMR_TARGET}/${{ inputs.omr_kernel }}/source"
          OUT="omr-work/omr/${OMR_TARGET}/${{ inputs.omr_kernel }}/source/bin/packages/aarch64_cortex-a53"
          mkdir -p dist
          find "$OUT" -name "${{ inputs.package }}_*.ipk" -exec cp {} dist/ \;
          ls -l dist/
          ( cd dist && sha256sum *.ipk > sha256sums )

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: mt3000-pkg-${{ inputs.package }}-${{ inputs.omr_ref }}-run${{ github.run_id }}
          path: dist/
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pkg-build-logs-${{ github.run_id }}
          path: |
            host-tools.log
            toolchain.log
            pkg-build.log
          if-no-files-found: ignore

name: AI Translator Android Validation

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Private ai-translator branch/tag/SHA to validate"
        required: true
        default: "main"
        type: string
      upload_apk:
        description: "Explicitly publish the debug APK artifact"
        required: true
        default: false
        type: boolean
      build_only:
        description: "Run static analysis and the Android debug APK build without the full Flutter suite"
        required: true
        default: false
        type: boolean
      test_only:
        description: "Run Flutter analysis and integrated tests without building an APK"
        required: true
        default: false
        type: boolean
      android_test_only:
        description: "Rebuild only instrumentation; require unchanged approved application inputs"
        required: true
        default: false
        type: boolean
      app_source_sha:
        description: "Previously built immutable application SHA for instrumentation-only reuse"
        required: false
        type: string
      m2_batch:
        description: "Build isolated UI and instrumentation APKs as one encrypted private batch"
        required: true
        default: false
        type: boolean
      encrypted_delivery:
        description: "Upload only an encrypted review APK for private repository intake"
        required: true
        default: false
        type: boolean
  repository_dispatch:
    types: [ai-translator-android]
  push:
    paths:
      - "requests/ai-translator/current.json"

permissions:
  contents: read

concurrency:
  group: ai-translator-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      test_only: ${{ steps.resolve.outputs.test_only }}

    steps:
      - name: Checkout build request
        if: github.event_name == 'push' || inputs.encrypted_delivery == true
        uses: actions/checkout@v4
        with:
          path: build-farm
          fetch-depth: 1

      - name: Resolve source ref and artifact policy
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SOURCE_REF: ${{ inputs.source_ref }}
          INPUT_UPLOAD_APK: ${{ inputs.upload_apk }}
          INPUT_BUILD_ONLY: ${{ inputs.build_only }}
          INPUT_TEST_ONLY: ${{ inputs.test_only }}
          INPUT_ENCRYPTED_DELIVERY: ${{ inputs.encrypted_delivery }}
          M2_BATCH: ${{ inputs.m2_batch }}
          ANDROID_TEST_ONLY: ${{ inputs.android_test_only }}
          M2_APP_SOURCE_SHA: ${{ inputs.app_source_sha }}
          DISPATCH_SOURCE_REF: ${{ github.event.client_payload.source_ref }}
          DISPATCH_UPLOAD_APK: ${{ github.event.client_payload.upload_apk }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "push" ]; then
            SOURCE_REF="$(python3 -c 'import json; print(json.load(open("build-farm/requests/ai-translator/current.json"))["source_ref"])')"
            UPLOAD_APK="$(python3 -c 'import json; print(str(bool(json.load(open("build-farm/requests/ai-translator/current.json")).get("upload_apk", False))).lower())')"
            BUILD_ONLY="$(python3 -c 'import json; print(str(bool(json.load(open("build-farm/requests/ai-translator/current.json")).get("build_only", False))).lower())')"
            TEST_ONLY="$(python3 -c 'import json; print(str(bool(json.load(open("build-farm/requests/ai-translator/current.json")).get("test_only", False))).lower())')"
            ENCRYPTED_DELIVERY="$(python3 -c 'import json; print(str(bool(json.load(open("build-farm/requests/ai-translator/current.json")).get("encrypted_delivery", False))).lower())')"
          elif [ "$EVENT_NAME" = "repository_dispatch" ]; then
            SOURCE_REF="$DISPATCH_SOURCE_REF"
            UPLOAD_APK="${DISPATCH_UPLOAD_APK:-false}"
            BUILD_ONLY=false
            TEST_ONLY=false
            ENCRYPTED_DELIVERY=false
          else
            SOURCE_REF="${INPUT_SOURCE_REF:-main}"
            UPLOAD_APK="${INPUT_UPLOAD_APK:-false}"
            BUILD_ONLY="${INPUT_BUILD_ONLY:-false}"
            TEST_ONLY="${INPUT_TEST_ONLY:-false}"
            ENCRYPTED_DELIVERY="${INPUT_ENCRYPTED_DELIVERY:-false}"
          fi
          M2_BATCH="${M2_BATCH:-false}"
          if [ "$M2_BATCH" = true ]; then
            [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]
            test "$ENCRYPTED_DELIVERY" = true
            test "$UPLOAD_APK" = false
            test "$TEST_ONLY" = false
          fi
          ANDROID_TEST_ONLY="${ANDROID_TEST_ONLY:-false}"
          if [ "$ANDROID_TEST_ONLY" = true ]; then
            [[ "$SOURCE_REF" =~ ^[a-f0-9]{40}$ ]]
            [[ "$M2_APP_SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
            test "$ENCRYPTED_DELIVERY" = true
            test "$UPLOAD_APK" = false
            test "$TEST_ONLY" = false
            test "$M2_BATCH" = false
          fi
          echo "ANDROID_TEST_ONLY=$ANDROID_TEST_ONLY" >> "$GITHUB_ENV"
          echo "M2_APP_SOURCE_SHA=$M2_APP_SOURCE_SHA" >> "$GITHUB_ENV"
          echo "M2_BATCH=$M2_BATCH" >> "$GITHUB_ENV"
          test -n "$SOURCE_REF"
          if [ "$ENCRYPTED_DELIVERY" = true ] && [ "$UPLOAD_APK" = true ]; then
            echo 'Plaintext and encrypted APK uploads cannot be combined' >&2
            exit 1
          fi
          echo "SOURCE_REF=$SOURCE_REF" >> "$GITHUB_ENV"
          echo "UPLOAD_APK=$UPLOAD_APK" >> "$GITHUB_ENV"
          echo "BUILD_ONLY=$BUILD_ONLY" >> "$GITHUB_ENV"
          echo "TEST_ONLY=$TEST_ONLY" >> "$GITHUB_ENV"
          echo "ENCRYPTED_DELIVERY=$ENCRYPTED_DELIVERY" >> "$GITHUB_ENV"
          echo "test_only=$TEST_ONLY" >> "$GITHUB_OUTPUT"

      - name: Validate private source token is configured
        env:
          BUILD_FARM_SOURCE_TOKEN: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$BUILD_FARM_SOURCE_TOKEN"

      - name: Checkout private AI Translator source
        uses: actions/checkout@v4
        with:
          repository: Sharkecho/ai-translator
          ref: ${{ env.SOURCE_REF }}
          token: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve Flutter dependencies
        working-directory: source/mobile
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: source/mobile
        run: |
          set -euo pipefail
          if [ "$M2_BATCH" = true ] || [ "$ANDROID_TEST_ONLY" = true ]; then
            mkdir -p "$RUNNER_TEMP/m2-batch"
            flutter analyze > "$RUNNER_TEMP/m2-batch/analyze.log" 2>&1 || { echo "FLUTTER_ANALYZE=FAIL; details retained privately"; exit 1; }
            echo "FLUTTER_ANALYZE=PASS"
          else
            flutter analyze
          fi

      - name: Run Flutter tests
        if: env.BUILD_ONLY != 'true' && env.TEST_ONLY != 'true'
        working-directory: source/mobile
        run: flutter test

      - name: Run integrated Flutter tests without building
        if: env.TEST_ONLY == 'true'
        working-directory: source/mobile
        run: |
          set -euo pipefail
          echo "AI_TRANSLATOR_SOURCE_SHA=$(git rev-parse HEAD)"
          flutter test

      - name: Build Android debug APK
        if: env.TEST_ONLY != 'true' && env.M2_BATCH != 'true' && env.ANDROID_TEST_ONLY != 'true'
        working-directory: source/mobile
        run: flutter build apk --debug

      - name: Build isolated M2 QA batch
        if: env.M2_BATCH == 'true'
        working-directory: source
        env:
          M2_BATCH_OUTPUT: ${{ runner.temp }}/m2-batch
        run: |
          bash -n scripts/build-m2-qa-batch.sh
          bash scripts/build-m2-qa-batch.sh

      - name: Rebuild AndroidTest only for unchanged app inputs
        if: env.ANDROID_TEST_ONLY == 'true'
        working-directory: source
        env:
          M2_BATCH_OUTPUT: ${{ runner.temp }}/m2-batch
        run: |
          bash -n scripts/build-m2-androidtest-only.sh
          bash scripts/build-m2-androidtest-only.sh

      - name: Record build evidence
        if: env.TEST_ONLY != 'true'
        working-directory: source
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          APK="mobile/build/app/outputs/flutter-apk/app-debug.apk"
          if [ "$M2_BATCH" = true ] || [ "$ANDROID_TEST_ONLY" = true ]; then APK="$RUNNER_TEMP/m2-batch/batch.zip"; fi
          test -f "$APK"
          echo "AI_TRANSLATOR_SOURCE_SHA=$SOURCE_SHA"
          sha256sum "$APK"
          {
            echo "## AI Translator Android validation"
            echo
            printf -- '- Source ref: `%s`\n' "$SOURCE_REF"
            printf -- '- Source SHA: `%s`\n' "$SOURCE_SHA"
            echo "- Flutter analyze: PASS"
            if [ "$BUILD_ONLY" = "true" ]; then
              echo "- Flutter tests: NOT_RUN (explicit build-only request)"
            else
              echo "- Flutter tests: PASS"
            fi
            echo "- Android debug build: PASS"
            echo "- Plaintext APK uploaded: $UPLOAD_APK"
            echo "- Encrypted private-review handoff requested: $ENCRYPTED_DELIVERY"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Encrypt review APK for private intake
        if: env.ENCRYPTED_DELIVERY == 'true' && env.TEST_ONLY != 'true'
        working-directory: build-farm
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=45,<51'
          python3 -m unittest discover -s tests -p test_m2_apk_envelope.py -v
          mkdir -p "$RUNNER_TEMP/m2-review"
          PAYLOAD=../source/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if [ "$M2_BATCH" = true ] || [ "$ANDROID_TEST_ONLY" = true ]; then PAYLOAD="$RUNNER_TEMP/m2-batch/batch.zip"; fi
          python3 scripts/m2_apk_envelope.py encrypt \
            --input "$PAYLOAD" \
            --output "$RUNNER_TEMP/m2-review/apk.enc" \
            --manifest "$RUNNER_TEMP/m2-review/manifest.json" \
            --source-sha "$(git -C ../source rev-parse HEAD)" \
            --public-key security/m2_apk_review_public.pem

      - name: Upload ciphertext only
        if: env.ENCRYPTED_DELIVERY == 'true' && env.TEST_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-translator-debug-apk-encrypted
          path: |
            ${{ runner.temp }}/m2-review/apk.enc
            ${{ runner.temp }}/m2-review/manifest.json
          if-no-files-found: error
          retention-days: 3

      - name: Upload debug APK only when explicitly requested
        if: env.UPLOAD_APK == 'true' && env.TEST_ONLY != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-translator-debug-apk
          path: source/mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 3

  report-status:
    needs: [validate]
    if: ${{ always() && needs.validate.outputs.test_only != 'true' }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Publish sanitized Android gate result
        uses: actions/github-script@v7
        env:
          VALIDATION_RESULT: ${{ needs.validate.result }}
        with:
          script: |
            const owner=context.repo.owner, repo=context.repo.repo;
            const path='status/ai-translator/android-build.json';
            const result=process.env.VALIDATION_RESULT;
            const report={
              schema_version:1, gate:'trustlyta-android-build',
              run_id:context.runId,
              run_url:`https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,
              finished_at:new Date().toISOString(),
              result, verified_pass:result==='success',
              source_request_note:'See immutable source revision in workflow run'
            };
            let sha;
            try { sha=(await github.rest.repos.getContent({owner,repo,path})).data.sha; }
            catch(e) { if(e.status!==404) throw e; }
            await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,sha,
              message:`gate(android): record run ${context.runId}`,
              content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')
            });


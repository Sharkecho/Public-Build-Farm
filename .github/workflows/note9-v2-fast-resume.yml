name: Note9 V2 Fast Resume Kernel

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_exynos9810
  KERNEL_COMMIT: 6a9461f9460ca51d1217e5069a5d5556fcc79e63
  DEFCONFIG: exynos9810-crownlte_defconfig
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r416183/clang-r416183.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install mature build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev             python3 rsync unzip zip zstd curl cpio

      - name: Checkout exact running-kernel source
        run: |
          git clone --filter=blob:none "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach "$KERNEL_COMMIT"
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"

      - name: Install pinned AOSP Clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/compiler/clang-r416183"
          curl -fL --retry 4 "$CLANG_URL" | tar -xz -C "$GITHUB_WORKSPACE/compiler/clang-r416183"
          "$GITHUB_WORKSPACE/compiler/clang-r416183/bin/clang" --version

      - name: Import Apollo GCC 4.9 companion toolchain
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/apollo.tar.gz"
          SRC="$RUNNER_TEMP/apollo-src"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -o "$ARCHIVE" \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"
          mkdir -p "$SRC"
          tar -xzf "$ARCHIVE" -C "$SRC"
          ROOT="$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -1)"
          TOOLCHAIN="$ROOT/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          test -d "$TOOLCHAIN/bin"
          mkdir -p "$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp"
          cp -a "$TOOLCHAIN" "$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/"
          DEST="$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          # GitHub branch archives do not reliably preserve executable mode for every
          # nested prebuilt. Restore it for compiler wrappers and real executables.
          find "$DEST/bin" -type f -exec chmod +x {} +
          if [ -d "$DEST/libexec" ]; then
            find "$DEST/libexec" -type f -exec chmod +x {} +
          fi
          # GitHub tar archives can materialize the GCC plugin symlink without
          # the unversioned name expected by -fuse-linker-plugin. Recreate the
          # canonical link from the shipped versioned plugin.
          LTO_DIR="$DEST/libexec/gcc/aarch64-linux-android/4.9.x"
          test -s "$LTO_DIR/liblto_plugin.so.0.0.0"
          ln -sfn liblto_plugin.so.0.0.0 "$LTO_DIR/liblto_plugin.so.0"
          ln -sfn liblto_plugin.so.0 "$LTO_DIR/liblto_plugin.so"
          chmod +x "$LTO_DIR"/cc1 "$LTO_DIR"/cc1plus "$LTO_DIR"/collect2 "$LTO_DIR"/lto-wrapper "$LTO_DIR"/lto1
          GCC="$DEST/bin/aarch64-linux-android-gcc"
          test -x "$GCC"
          test -e "$LTO_DIR/liblto_plugin.so"
          "$GCC" --version
          "$GCC" -print-file-name=liblto_plugin.so

      - name: Apply proven Apollo legacy DPU compatibility patch
        working-directory: kernel
        run: |
          set -euo pipefail
          FILE="drivers/video/fbdev/exynos/dpu_9810/decon_reg.c"
          grep -q 'const double decon_clocks_table' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/video/fbdev/exynos/dpu_9810/decon_reg.c")
          s=p.read_text()
          s=s.replace("const double decon_clocks_table[][CLK_ID_MAX] = {",
                      "const unsigned long decon_clocks_table[][CLK_ID_MAX] = {")
          s=s.replace("{41.7, 137.5, 400, 66, 62.5, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},",
                      "{41, 137, 400, 66, 62, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},")
          s=s.replace("{ 141, 137.5, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},",
                      "{ 141, 137, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},")
          p.write_text(s)
          PY
          grep -q 'const unsigned long decon_clocks_table' "$FILE"
          ! grep -qE '41\.7|137\.5|62\.5' "$FILE"
          git diff --check
          git diff -- "$FILE"

      - name: Build UAC2 variant from same verified source
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          ANDROID_MAJOR_VERSION: q
          PLATFORM_VERSION: 13.0.0
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/compiler/clang-r416183"
          export PATH="$TC/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
          export LLVM=1
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=format -Wno-error=enum-compare"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/usb/gadget/configfs.c")
          s=p.read_text()
          inc="#include <linux/usblog_proc_notify.h>"
          anchor="#include <linux/soc/samsung/exynos-soc.h>"
          if inc not in s:
              if anchor not in s:
                  raise SystemExit("configfs include anchor missing")
              s=s.replace(anchor, anchor+chr(10)+inc)
          p.write_text(s)
          assert inc in p.read_text().splitlines()
          PY
          mkdir -p out/uac2
          make O=out/uac2 ARCH=arm64 "$DEFCONFIG"
          scripts/config --file out/uac2/.config -e USB_CONFIGFS_F_UAC2
          scripts/config --file out/uac2/.config -d USB_G_ANDROID
          scripts/config --file out/uac2/.config -d USB_ANDROID_SAMSUNG_COMPOSITE
          make O=out/uac2 ARCH=arm64 olddefconfig
          grep '^CONFIG_USB_CONFIGFS_F_UAC2=y$' out/uac2/.config
          make O=out/uac2 ARCH=arm64 -j"$(nproc)"
          test -s out/uac2/arch/arm64/boot/Image
          cp out/uac2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.uac2"
          sha256sum "$GITHUB_WORKSPACE/Image.uac2"

      - name: Save V2 kernel checkpoint
        run: |
          cp kernel/out/uac2/.config V2.config
          sha256sum Image.uac2 V2.config > V2-SHA256SUMS
      - name: Upload V2 kernel checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: note9-v2-kernel-checkpoint
          path: |
            Image.uac2
            V2.config
            V2-SHA256SUMS
          retention-days: 30

name: Trustlyta HTTPS Public Gate
on:
  push:
    paths:
      - '.github/workflows/trustlyta-https-public-gate.yml'
      - 'requests/ai-translator/https.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustlyta-public-https
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify public DNS, TLS and API health
        shell: bash
        run: |
          set -euo pipefail
          host=43-163-91-54.sslip.io
          ip=43.163.91.54
          actual="$(getent ahostsv4 "$host" | awk 'NR==1 {print $1}')"
          test "$actual" = "$ip" || { echo "DNS_GATE=FAIL"; exit 1; }
          echo "DNS_GATE=PASS"
          # Distinguish public port reachability from TLS/certificate errors.
          # Report only safe diagnostic categories, never print response contents.
          failed=0
          for port in 80 443; do
            if timeout 8 bash -c "echo >/dev/tcp/43.163.91.54/$port" 2>/dev/null; then
              echo "TCP_${port}=OPEN"
            else
              echo "TCP_${port}=UNREACHABLE_OR_FILTERED"
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then exit 21; fi
          code="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --connect-timeout 7 --max-time 20 --proto '=https' --tlsv1.2 "https://$host/health")"
          test "$code" = 200 || { echo "HTTPS_HEALTH_HTTP_STATUS=$code"; exit 22; }
          echo "HTTPS_PUBLIC_GATE=PASS"
          # Verify signed update feed and APK integrity from outside Singapore.
          python3 - <<'PY'
          import hashlib,json,urllib.request
          root="https://43-163-91-54.sslip.io"
          with urllib.request.urlopen(root+"/updates/android/latest.json", timeout=20) as response:
              manifest=json.loads(response.read(16385))
          assert manifest["packageName"]=="com.sharkecho.ai_translator"
          assert int(manifest["versionCode"]) >= 100
          url=manifest["apkUrl"]
          assert url.startswith(root+"/updates/android/") and url.endswith(".apk")
          expected=manifest["sha256"]
          assert len(expected)==64 and all(c in "0123456789abcdef" for c in expected)
          digest=hashlib.sha256()
          length=0
          with urllib.request.urlopen(url,timeout=40) as response:
              while True:
                  piece=response.read(65536)
                  if not piece:break
                  length+=len(piece)
                  assert length<=350*1024*1024
                  digest.update(piece)
          assert length==manifest["sizeBytes"]
          assert digest.hexdigest()==expected
          print("SIGNED_UPDATE_APK_SHA256=PASS")
          PY
  report:
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,path='status/ai-translator/https-public.json';
            const result=process.env.RESULT;
            const report={schema_version:1,gate:'trustlyta-public-https',run_id:context.runId,run_url:`https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,target:'https://43-163-91-54.sslip.io/health',result,verified_pass:result==='success',finished_at:new Date().toISOString()};
            let sha,old;
            try {const f=(await github.rest.repos.getContent({owner,repo,path})).data;sha=f.sha;old=JSON.parse(Buffer.from(f.content,'base64').toString());}
            catch(e) {if(e.status!==404)throw e;}
            if(old&&Number(old.run_id)>context.runId)return;
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,message:`gate(https-public): record run ${context.runId}`,content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});

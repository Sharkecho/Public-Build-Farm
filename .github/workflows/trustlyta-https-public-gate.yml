name: Trustlyta HTTPS Public Gate
on:
  push:
    paths:
      - '.github/workflows/trustlyta-https-public-gate.yml'
      - 'requests/ai-translator/https.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustlyta-public-https
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Verify public DNS, TLS and API health
        shell: bash
        run: |
          set -euo pipefail
          host=43-163-91-54.sslip.io
          ip=43.163.91.54
          actual="$(getent ahostsv4 "$host" | awk 'NR==1 {print $1}')"
          test "$actual" = "$ip" || { echo "DNS_GATE=FAIL"; exit 1; }
          echo "DNS_GATE=PASS"
          curl --fail --show-error --silent --location --max-time 20 --proto '=https' --tlsv1.2 "https://$host/health" | head -c 200
          echo
          echo "HTTPS_PUBLIC_GATE=PASS"
  report:
    needs: [verify]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.verify.result }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo,path='status/ai-translator/https-public.json';
            const result=process.env.RESULT;
            const report={schema_version:1,gate:'trustlyta-public-https',run_id:context.runId,run_url:`https://github.com/${owner}/${repo}/actions/runs/${context.runId}`,target:'https://43-163-91-54.sslip.io/health',result,verified_pass:result==='success',finished_at:new Date().toISOString()};
            let sha,old;
            try {const f=(await github.rest.repos.getContent({owner,repo,path})).data;sha=f.sha;old=JSON.parse(Buffer.from(f.content,'base64').toString());}
            catch(e) {if(e.status!==404)throw e;}
            if(old&&Number(old.run_id)>context.runId)return;
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,message:`gate(https-public): record run ${context.runId}`,content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});

name: Note9-01 Kernel Build (public build farm)

# PUBLIC repository ("Sharkecho/Public-Build-Farm"). This workflow only *runs* a
# build; the source it builds lives in the PRIVATE repository and is fetched at
# run time with a read-only fine-grained PAT. House rules honoured here:
#   * manual only - workflow_dispatch, never push / schedule / pull_request
#   * least privilege - contents:read + actions:read, no write scope anywhere
#   * private checkout with persist-credentials:false, token never echoed
#   * the private commit *title* is never printed; only the 40-hex commit SHA
#   * the uploaded artefact never contains the Samsung source tree, a token, or
#     any device/probe data
#   * no deployment, no release publishing, no paid larger runner
#
# Modes (build_mode input):
#   stock    - clean build of the pinned, unmodified Samsung source only
#   uac2     - apply the single-line K1 UAC2 config delta and build only that
#   compare  - stock build, then the UAC2 delta build, then a full A/B compare
#              (default; this is the K1 acceptance run)
#
# BUILD MODE = SAMSUNG'S OWN (revision 3, after run 36966826747)
#   The vendor entry points build IN THE SOURCE TREE and never pass O=:
#     build_kernel.sh:8,10        make ARCH=arm64 exynos9810-crownlteks_defconfig ; make ARCH=arm64 -j16
#     AndroidKernel.mk:66,98      $(MAKE) -C $(TARGET_KERNEL_SOURCE) ARCH=$(KERNEL_ARCH) ...
#     build.config.universal9810  FILES="arch/arm64/boot/Image:kernel ..."
#   An O= build is NOT equivalent for this tree: init/_uh.S:40 embeds a static blob with
#   `.incbin "init/uh.8g.elf"` (CONFIG_UH=y, CONFIG_UH_RKP_8G=y), and GAS resolves that
#   quoted path against the ASSEMBLER'S CWD. With O= the assembler runs in the output
#   tree, where no rule ever places that blob, so scripts/Makefile.build:434 (as_o_S)
#   fails - exactly the run-3 blocker. In-tree the CWD is the tree root, where the blob
#   ships inside the archive, so the official build works with ZERO source modification.
#   Therefore each phase now extracts its OWN pristine copy of the same verified archive:
#     stock phase -> kernel-src-stock -> in-tree build -> evidence -> tree deleted
#     uac2  phase -> kernel-src-uac2  -> single config delta -> in-tree build -> evidence
#   One tree at a time keeps peak disk use inside a standard ubuntu-22.04 runner, and the
#   two phases stay isolated by construction (no shared, patched or reused tree).
#
# On failure the run still uploads EVIDENCE (build log, failure extract, .config,
# metadata, hashes) - never a source tree, the archive, or a credential.
#
# The K1 round is a RESEARCH/BUILD round: this workflow compiles and verifies.
# It cannot and does not touch a device.

on:
  workflow_dispatch:
    inputs:
      build_mode:
        description: "stock | uac2 | compare"
        type: choice
        options: [compare, stock, uac2]
        default: compare
        required: true
      source_ref:
        description: "private source ref (branch/tag/SHA)"
        type: string
        default: main
        required: true
      source_sha256:
        description: "pinned sha256 of the private release asset (Kernel.tar.gz)"
        type: string
        default: "7CC2E3F5849F29E03C17F7D7931E793D0E59C0020A9ECD940AAF78E8F7563BF3"
        required: true
      device:
        description: "expected device model"
        type: string
        default: SM-N960N
        required: true
      defconfig:
        description: "defconfig basename inside arch/arm64/configs"
        type: string
        default: exynos9810-crownlteks_defconfig
        required: true
      runner:
        description: "runner label (fixed to the validated image)"
        type: choice
        options: [ubuntu-22.04]
        default: ubuntu-22.04
        required: true
      source_asset_tag:
        description: "private release tag holding the source asset"
        type: string
        default: source-n960n-n960nksu3fvg4
        required: true
      source_asset_name:
        description: "private release asset name"
        type: string
        default: Kernel.tar.gz
        required: true
      source_url:
        description: "optional direct URL (empty = use the private release asset)"
        type: string
        default: ""
        required: false
      baseline_run_id:
        description: "optional: earlier run id kept for the record (never downloaded)"
        type: string
        default: ""
        required: false
      baseline_image_sha256:
        description: "optional: earlier baseline Image sha256 kept for the record"
        type: string
        default: ""
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: note9-01-kernel-${{ inputs.source_ref }}-${{ inputs.build_mode }}
  cancel-in-progress: false

env:
  SOURCE_ARCHIVE: downloads/Kernel.tar.gz
  KERNEL_SOURCE_ASSET: Kernel.tar.gz
  KERNEL_SOURCE_SHA256_FIXED: 7CC2E3F5849F29E03C17F7D7931E793D0E59C0020A9ECD940AAF78E8F7563BF3
  KERNEL_SOURCE_SIZE_FIXED: "202034479"
  KERNEL_SOURCE_MEMBERS_FIXED: "66961"
  DEFCONFIG_SHA256_BEFORE_FIXED: 417e43beb5c9dc6f574f3e42ce8d4550a2b625c199d3d4392c2be14433c7f7f2
  DEFCONFIG_SHA256_AFTER_FIXED: 06682be8cfa1befd65d14a6bc905c1c74b3e6a1c318404dd9c881674fe54f12a
  SRC_ROOT: kernel-src-stock
  STOCK_SRC: kernel-src-stock
  UAC2_SRC: kernel-src-uac2
  STOCK_OUT: build-stock
  UAC2_OUT: build-uac2
  RESULTS: results
  SOURCE_REPO_DIR: source-repo
  BUILD_MODE_SAMSUNG: in-tree
  MIN_FREE_GB: "12"

jobs:
  preflight:
    name: preflight · ${{ inputs.build_mode }} · ${{ inputs.device }}
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    outputs:
      source_sha256: ${{ steps.sha.outputs.value }}
    steps:
      - name: input gate
        run: |
          set -uo pipefail
          echo "TARGET=note9-01-k1-kernel-build"
          echo "BUILD_MODE_INPUT=${{ inputs.build_mode }}"
          echo "DEVICE_INPUT=${{ inputs.device }}"
          echo "DEFCONFIG_INPUT=${{ inputs.defconfig }}"
          echo "RUNNER_INPUT=${{ inputs.runner }}"
          echo "SOURCE_REF_INPUT=${{ inputs.source_ref }}"
          echo "SOURCE_ASSET_TAG_INPUT=${{ inputs.source_asset_tag }}"
          echo "SOURCE_ASSET_NAME_INPUT=${{ inputs.source_asset_name }}"
          echo "SOURCE_URL_INPUT_PRESENT=$([ -n "${{ inputs.source_url }}" ] && echo YES || echo NO)"
          echo "BASELINE_RUN_ID_NOTE=${{ inputs.baseline_run_id }}"
          echo "BASELINE_IMAGE_SHA256_NOTE=${{ inputs.baseline_image_sha256 }}"
          case "${{ inputs.build_mode }}" in
            stock|uac2|compare) ;;
            *) echo "PREFLIGHT=FAIL (unsupported build_mode '${{ inputs.build_mode }}')"; exit 1 ;;
          esac
          [ "${{ inputs.device }}" = "SM-N960N" ] || { echo "PREFLIGHT=FAIL (device must be SM-N960N)"; exit 1; }
          [ "${{ inputs.defconfig }}" = "exynos9810-crownlteks_defconfig" ] || { echo "PREFLIGHT=FAIL (unexpected defconfig)"; exit 1; }
          [ "${{ inputs.runner }}" = "ubuntu-22.04" ] || { echo "PREFLIGHT=FAIL (runner must be ubuntu-22.04)"; exit 1; }
          echo "PREFLIGHT=OK"

      - name: normalise the pinned sha256 input
        id: sha
        run: |
          set -uo pipefail
          VALUE="$(printf '%s' "${{ inputs.source_sha256 }}" | tr 'A-F' 'a-f')"
          if ! printf '%s' "$VALUE" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "SOURCE_INTEGRITY=FAIL (malformed source_sha256 input)"
            exit 1
          fi
          if [ "$VALUE" != "$(printf '%s' "${KERNEL_SOURCE_SHA256_FIXED}" | tr 'A-F' 'a-f')" ]; then
            echo "SOURCE_INTEGRITY=FAIL (source_sha256 input is not the pinned asset hash)"
            exit 1
          fi
          echo "value=${VALUE}" >> "$GITHUB_OUTPUT"
          echo "SOURCE_SHA256_INPUT=${VALUE}"
          echo "SOURCE_SHA256_PINNED=OK"

      - name: token presence (existence only, never the value)
        env:
          SOURCE_TOKEN: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "${SOURCE_TOKEN:-}" ]; then
            echo "TOKEN_PRESENT=NO"
            echo "PREFLIGHT=FAIL (BUILD_FARM_SOURCE_TOKEN is not configured)"
            exit 1
          fi
          echo "TOKEN_PRESENT=YES"
          echo "REQUIRED_PERMISSION=Contents:Read-only on the private source repository"
          echo "SOURCE_MODE=$([ -n "${{ inputs.source_url }}" ] && echo DIRECT_URL || echo PRIVATE_RELEASE_ASSET)"

  build:
    name: ${{ inputs.build_mode }} · ${{ inputs.device }}
    needs: preflight
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 330
    steps:
      - name: runner capacity
        run: |
          set -uo pipefail
          echo "RUNNER_NAME=${RUNNER_NAME}"
          echo "RUNNER_OS=${RUNNER_OS} ${RUNNER_ARCH}"
          echo "CPUS=$(nproc)"
          free -m || true
          df -h "$GITHUB_WORKSPACE" / || true
          FREE_GB="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR==2 {print int($4/1024/1024)}')"
          echo "FREE_GB_WORKSPACE=${FREE_GB}"
          if [ "${FREE_GB}" -lt "${MIN_FREE_GB}" ]; then
            echo "CAPACITY=FAIL (only ${FREE_GB} GB free, need ${MIN_FREE_GB} GB)"
            exit 1
          fi
          echo "CAPACITY=OK"

      - name: runner build prerequisites (Samsung-era python 2 + core build tools)
        timeout-minutes: 15
        run: |
          set -uo pipefail
          # The vendor environment this archive was built in had /usr/bin/python == Python 2.7, and
          # two things on the build path need exactly that:
          #   1. the shipped toolchain wrapper
          #      (toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc)
          #      carries the python2-era shebang "#!/usr/bin/python";
          #   2. scripts/rkp_cfp/instrument.py - invoked from scripts/link-vmlinux.sh:373 while
          #      vmlinux is linked, because CONFIG_RKP_CFP_JOPP=y - is Python 2 source: it uses the
          #      Python 2 print statement (L1270) and imports the Python 2 only module "pipes".
          # ubuntu-22.04 ships no /usr/bin/python, and a python3 shim makes (2) die with
          # "SyntaxError: Missing parentheses in call to 'print'" after the whole kernel has been
          # compiled (run 36970048474). So install the interpreter the vendor used.
          # This is a build environment fix: not one byte of the Samsung source, defconfig,
          # patch or toolchain changes.
          PY2_BIN="$(command -v python2.7 || command -v python2 || true)"
          if [ -z "${PY2_BIN}" ]; then
            sudo apt-get update -qq >/dev/null 2>&1 || true
            sudo apt-get install -y --no-install-recommends python2.7 >/dev/null 2>&1 \
              || sudo apt-get install -y --no-install-recommends python2 >/dev/null 2>&1 || true
            PY2_BIN="$(command -v python2.7 || command -v python2 || true)"
          fi
          if [ -z "${PY2_BIN}" ]; then
            echo "PYTHON2_AVAILABLE=NO"
            echo "PREREQUISITES=FAIL (the Samsung vmlinux post-link step is Python 2 and no Python 2 interpreter could be installed)"
            exit 1
          fi
          sudo ln -sf "${PY2_BIN}" /usr/bin/python || true
          PYTHON_VERSION="$(python --version 2>&1 || true)"
          PYTHON_MAJOR="$(python -c 'import sys; print(sys.version_info[0])' 2>/dev/null || echo unknown)"
          PYTHON3_VERSION="$(python3 --version 2>&1 || true)"
          echo "PYTHON2_BIN=${PY2_BIN}"
          echo "PYTHON_BIN=/usr/bin/python"
          echo "PYTHON_VERSION=${PYTHON_VERSION}"
          echo "PYTHON_MAJOR=${PYTHON_MAJOR}"
          echo "PYTHON3_VERSION=${PYTHON3_VERSION}"
          if [ "${PYTHON_MAJOR}" != "2" ]; then
            echo "PYTHON_IS_PY2=NO"
            echo "PREREQUISITES=FAIL (python on PATH is not Python 2; the Samsung vmlinux post-link step would fail)"
            exit 1
          fi
          echo "PYTHON_IS_PY2=YES"
          mkdir -p "${RESULTS}"
          {
            echo "PYTHON_BIN=/usr/bin/python"
            echo "PYTHON2_BIN=${PY2_BIN}"
            echo "PYTHON_VERSION=${PYTHON_VERSION}"
            echo "PYTHON_MAJOR=${PYTHON_MAJOR}"
            echo "PYTHON_IS_PY2=YES"
            echo "PYTHON3_VERSION=${PYTHON3_VERSION}"
            echo "PYTHON_ROLE=python=Python2 (vendor toolchain wrapper + Samsung scripts/rkp_cfp/instrument.py); python3=Python3 (the Samsung scripts/crypto|fmp post-link helpers declare py3)"
          } > "${RESULTS}/python-env.txt"
          cat "${RESULTS}/python-env.txt"
          HOST_DEPS=""
          for tool in bc bison flex make gcc ld sed awk; do
            if ! command -v "${tool}" >/dev/null 2>&1; then HOST_DEPS="${HOST_DEPS} ${tool}"; fi
          done
          if [ -n "${HOST_DEPS}" ]; then
            echo "HOST_DEPS_MISSING=${HOST_DEPS}"
            sudo apt-get install -y --no-install-recommends ${HOST_DEPS} >/dev/null 2>&1 \
              || echo "HOST_DEPS_INSTALL=FAIL (continuing; the build phases decide)"
          else
            echo "HOST_DEPS_MISSING=none"
          fi
          echo "PREREQUISITES=OK"

      - name: checkout private source (read-only, no persisted credentials)
        uses: actions/checkout@v4
        with:
          repository: Sharkecho/note9-01
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false
          path: source-repo

      - name: private source identity (short SHA + content hashes only, never the commit title)
        run: |
          set -uo pipefail
          PRIVATE_SOURCE_SHA_SHORT="$(git -C "${SOURCE_REPO_DIR}" rev-parse --short=7 HEAD)"
          echo "PRIVATE_SOURCE_REPO=Sharkecho/note9-01"
          echo "PRIVATE_SOURCE_REF=${{ inputs.source_ref }}"
          echo "PRIVATE_SOURCE_SHA_SHORT=${PRIVATE_SOURCE_SHA_SHORT}"
          RECIPE="${GITHUB_WORKSPACE}/${SOURCE_REPO_DIR}/kernel/scripts/build_kernel.sh"
          PATCH="${GITHUB_WORKSPACE}/${SOURCE_REPO_DIR}/kernel/patches/K1_UAC2_MINIMAL.patch"
          [ -f "${RECIPE}" ] || { echo "BUILD_RECIPE=ABSENT"; echo "SOURCE_IDENTITY=FAIL"; exit 1; }
          [ -f "${PATCH}" ] || { echo "SOURCE_DELTA_PATCH=ABSENT"; echo "SOURCE_IDENTITY=FAIL"; exit 1; }
          echo "RECIPE_PATH=kernel/scripts/build_kernel.sh"
          echo "RECIPE_SHA256=$(sha256sum "${RECIPE}" | awk '{print $1}')"
          echo "PATCH_PATH=kernel/patches/K1_UAC2_MINIMAL.patch"
          echo "PATCH_SHA256=$(sha256sum "${PATCH}" | awk '{print $1}')"
          echo "SOURCE_IDENTITY=OK"

      - name: "phase 1 · acquire the pinned source asset"
        env:
          SOURCE_TOKEN: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
        run: |
          set -uo pipefail
          mkdir -p downloads
          if [ -n "${{ inputs.source_url }}" ]; then
            echo "SOURCE_MODE=DIRECT_URL"
            curl -fL --retry 3 --retry-delay 5 -o "${SOURCE_ARCHIVE}" "${{ inputs.source_url }}" \
              || { echo "SOURCE_INTEGRITY=FAIL (download failed)"; exit 1; }
          else
            echo "SOURCE_MODE=PRIVATE_RELEASE_ASSET"
            echo "SOURCE_RELEASE_TAG=${{ inputs.source_asset_tag }}"
            echo "SOURCE_ASSET_NAME=${{ inputs.source_asset_name }}"
            GH_TOKEN="${SOURCE_TOKEN}" gh release download "${{ inputs.source_asset_tag }}" \
              --repo Sharkecho/note9-01 \
              --pattern "${{ inputs.source_asset_name }}" \
              --dir downloads --clobber \
              || { echo "SOURCE_INTEGRITY=FAIL (release asset download failed)"; exit 1; }
          fi
          [ -f "${SOURCE_ARCHIVE}" ] || { echo "SOURCE_INTEGRITY=FAIL (asset missing after download)"; exit 1; }

          EXPECTED_INPUT="$(printf '%s' "${{ needs.preflight.outputs.source_sha256 }}" | tr 'A-F' 'a-f')"
          EXPECTED_FIXED="$(printf '%s' "${KERNEL_SOURCE_SHA256_FIXED}" | tr 'A-F' 'a-f')"
          [ "${EXPECTED_INPUT}" = "${EXPECTED_FIXED}" ] \
            || { echo "SOURCE_INTEGRITY=FAIL (input sha256 is not the pinned asset hash)"; exit 1; }

          SIZE_ACTUAL="$(stat -c '%s' "${SOURCE_ARCHIVE}")"
          echo "SOURCE_SIZE_ACTUAL=${SIZE_ACTUAL}"
          echo "SOURCE_SIZE_EXPECTED=${KERNEL_SOURCE_SIZE_FIXED}"
          if [ "${SIZE_ACTUAL}" != "${KERNEL_SOURCE_SIZE_FIXED}" ]; then
            echo "SOURCE_INTEGRITY=FAIL (downloaded asset size mismatch)"; exit 1
          fi

          SHA_ACTUAL="$(sha256sum "${SOURCE_ARCHIVE}" | awk '{print $1}' | tr 'A-F' 'a-f')"
          echo "SOURCE_SHA256_ACTUAL=${SHA_ACTUAL}"
          if [ "${SHA_ACTUAL}" != "${EXPECTED_FIXED}" ]; then
            echo "SOURCE_INTEGRITY=FAIL (downloaded asset sha256 mismatch)"; exit 1
          fi

          gzip -t "${SOURCE_ARCHIVE}" || { echo "SOURCE_INTEGRITY=FAIL (gzip integrity check failed)"; exit 1; }
          echo "SOURCE_GZIP_INTEGRITY=OK"

          MEMBERS="$(tar -tzf "${SOURCE_ARCHIVE}" | wc -l)"
          echo "SOURCE_MEMBERS=${MEMBERS}"
          if [ "${MEMBERS}" != "${KERNEL_SOURCE_MEMBERS_FIXED}" ]; then
            echo "SOURCE_INTEGRITY=FAIL (member count mismatch)"; exit 1
          fi

          # The static .incbin payload that init/_uh.S:40 embeds must ship inside the
          # archive: no kbuild rule generates or copies it, so its presence is the
          # precondition of the official in-tree build (run-3 blocker, asserted here
          # in seconds instead of 12 seconds into an assembler run).
          UH_IN_ARCHIVE="$(tar -tzf "${SOURCE_ARCHIVE}" | grep -c -E '(^|/)init/uh(\.[0-9]+g)?\.elf$' || true)"
          echo "UH_BLOB_MEMBERS_IN_ARCHIVE=${UH_IN_ARCHIVE}"
          [ "${UH_IN_ARCHIVE}" -ge 1 ] \
            || { echo "SOURCE_INTEGRITY=FAIL (the init/_uh.S .incbin payload is not in the archive)"; exit 1; }
          echo "SAMSUNG_OFFICIAL_BUILD_MODE=IN_TREE"
          echo "OFFICIAL_USES_O=NO"

          mkdir -p "${STOCK_SRC}"
          tar -xzf "${SOURCE_ARCHIVE}" -C "${STOCK_SRC}" || { echo "SOURCE_INTEGRITY=FAIL (extract failed)"; exit 1; }
          SRC_FILES="$(find "${STOCK_SRC}" -type f | wc -l)"
          SRC_SYMLINKS="$(find "${STOCK_SRC}" -type l | wc -l)"
          echo "SRC_FILES=${SRC_FILES}"
          echo "SRC_SYMLINKS=${SRC_SYMLINKS}"
          echo "EXTRACT_TARGET=${STOCK_SRC} (phase 1 of 2: the stock tree)"
          [ "${SRC_SYMLINKS}" -gt 0 ] || { echo "SOURCE_INTEGRITY=FAIL (no symlinks after extract)"; exit 1; }
          [ -f "${STOCK_SRC}/Makefile" ] || { echo "SOURCE_INTEGRITY=FAIL (no Makefile at tree root)"; exit 1; }
          [ -f "${STOCK_SRC}/init/uh.8g.elf" ] \
            || { echo "SOURCE_INTEGRITY=FAIL (init/uh.8g.elf missing after extract)"; exit 1; }
          [ -f "${STOCK_SRC}/init/_uh.S" ] \
            || { echo "SOURCE_INTEGRITY=FAIL (init/_uh.S missing after extract)"; exit 1; }
          echo "SOURCE_INTEGRITY=PASS"

      - name: "phase 1b · pristine source check"
        run: |
          set -uo pipefail
          mkdir -p "${RESULTS}"
          DEFCONFIG_PATH="${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}"
          [ -f "${DEFCONFIG_PATH}" ] || { echo "PRISTINE=FAIL (defconfig missing)"; exit 1; }
          DEFCONFIG_SHA256="$(sha256sum "${DEFCONFIG_PATH}" | awk '{print $1}')"
          echo "DEFCONFIG=${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}"
          echo "DEFCONFIG_SHA256=${DEFCONFIG_SHA256}"
          [ "${DEFCONFIG_SHA256}" = "${DEFCONFIG_SHA256_BEFORE_FIXED}" ] \
            || { echo "PRISTINE=FAIL (defconfig sha256 differs from the pinned stock hash)"; exit 1; }
          [ -f "${STOCK_SRC}/drivers/usb/gadget/function/f_uac2.c" ] \
            || { echo "PRISTINE=FAIL (f_uac2.c absent from the Samsung tree)"; exit 1; }
          MODIFIED="$(find "${STOCK_SRC}" -name '*.orig' -o -name '*.rej' | wc -l)"
          echo "SOURCE_PATCH_RESIDUE=${MODIFIED}"
          # A fresh extraction must not already carry build state: the in-tree build is
          # only meaningful - and only reproducible - from a pristine tree.
          [ ! -f "${STOCK_SRC}/.config" ] \
            || { echo "PRISTINE=FAIL (the freshly extracted stock tree already has .config)"; exit 1; }
          [ ! -f "${STOCK_SRC}/arch/arm64/boot/Image" ] \
            || { echo "PRISTINE=FAIL (the freshly extracted stock tree already has an Image)"; exit 1; }
          echo "SOURCE_TREE_BUILD_STATE=absent"
          echo "BUILD_MODE_SAMSUNG=${BUILD_MODE_SAMSUNG}"
          echo "OFFICIAL_USES_O=NO"
          echo "SAMSUNG_OFFICIAL_BUILD_MODE=IN_TREE"
          echo "SAMSUNG_EQUIVALENT_BUILD=YES (vendor build_kernel.sh also builds in the source tree)"
          echo "UH_BLOB_PATH=init/uh.8g.elf"
          echo "UH_BLOB_SIZE=$(stat -c '%s' "${STOCK_SRC}/init/uh.8g.elf")"
          echo "UH_BLOB_SHA256=$(sha256sum "${STOCK_SRC}/init/uh.8g.elf" | awk '{print $1}')"
          echo "UH_BLOB_GENERATED_OR_STATIC=STATIC (shipped inside the signed source archive; no kbuild rule generates or copies it)"
          {
            echo "PRIVATE_SOURCE_REPO=Sharkecho/note9-01"
            echo "PRIVATE_SOURCE_REF=${{ inputs.source_ref }}"
            echo "PRIVATE_SOURCE_SHA_SHORT=$(git -C "${SOURCE_REPO_DIR}" rev-parse --short=7 HEAD)"
            echo "SOURCE_ASSET=${{ inputs.source_asset_name }}"
            echo "SOURCE_ASSET_TAG=${{ inputs.source_asset_tag }}"
            echo "SOURCE_SHA256=${{ needs.preflight.outputs.source_sha256 }}"
            echo "SOURCE_SIZE=${KERNEL_SOURCE_SIZE_FIXED}"
            echo "SOURCE_MEMBERS=${KERNEL_SOURCE_MEMBERS_FIXED}"
            echo "DEFCONFIG=${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}"
            echo "DEFCONFIG_SHA256=${DEFCONFIG_SHA256}"
            echo "RUNNER_LABEL=${{ inputs.runner }}"
            echo "DEVICE_EXPECTED=${{ inputs.device }}"
            echo "KERNEL_VERSION=$(make -s -C "${STOCK_SRC}" kernelversion)"
          } > "${RESULTS}/source-identity.txt"
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "RUNNER=${{ inputs.runner }}"
            echo "BUILD_MODE=${{ inputs.build_mode }}"
            echo "SAMSUNG_OFFICIAL_BUILD_MODE=IN_TREE"
            echo "OFFICIAL_USES_O=NO"
            echo "SOURCE_MODE=private release asset ${KERNEL_SOURCE_ASSET}"
            echo "SOURCE_SHA256=${{ needs.preflight.outputs.source_sha256 }}"
            echo "SOURCE_SIZE=${KERNEL_SOURCE_SIZE_FIXED}"
            echo "SOURCE_MEMBERS=${KERNEL_SOURCE_MEMBERS_FIXED}"
            echo "DEFCONFIG=${{ inputs.defconfig }}"
            echo "DEFCONFIG_SHA256_BEFORE=${DEFCONFIG_SHA256_BEFORE_FIXED}"
            echo "DEFCONFIG_SHA256_AFTER=${DEFCONFIG_SHA256_AFTER_FIXED}"
            echo "DEVICE=${{ inputs.device }}"
            echo "DEVICE_WRITES=0"
            echo "K2_STARTED=NO"
          } > "${RESULTS}/run-metadata.txt"
          cat "${RESULTS}/source-identity.txt"
          cat "${RESULTS}/run-metadata.txt"
          echo "PRISTINE=PASS"

      - name: "phase 3 · UAC2 dependency check (Samsung 4.9.118 tree)"
        run: |
          set -uo pipefail
          OUT="${RESULTS}/uac2-dependencies.txt"
          : > "${OUT}"
          record() { echo "$*" | tee -a "${OUT}"; }

          record "### Kconfig entry (drivers/usb/gadget/Kconfig)"
          record "$(awk '/^config USB_CONFIGFS_F_UAC2$/,/^$/' "${STOCK_SRC}/drivers/usb/gadget/Kconfig")"
          record "### Kconfig entry (drivers/usb/gadget/function? USB_F_UAC2)"
          record "$(grep -rn -A 6 '^config USB_F_UAC2$' "${STOCK_SRC}/drivers/usb/gadget/Kconfig" || true)"
          record "### Implementation present"
          record "f_uac2.c   : $(ls -l "${STOCK_SRC}/drivers/usb/gadget/function/f_uac2.c" 2>/dev/null || echo ABSENT)"
          record "u_audio.c  : $(ls -l "${STOCK_SRC}/drivers/usb/gadget/function/u_audio.c" 2>/dev/null || echo 'ABSENT (this tree keeps UAC2 self-contained in f_uac2.c)')"
          record "Makefile   : $(grep -n 'uac2' "${STOCK_SRC}/drivers/usb/gadget/function/Makefile" || echo ABSENT)"
          record "### defconfig state"
          record "target line: $(grep -n 'CONFIG_USB_CONFIGFS_F_UAC2' "${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}")"

          need() {
            SYM="$1"
            if grep -q "^${SYM}=y" "${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}"; then
              record "DEP_${SYM}=y"
            else
              record "DEP_${SYM}=MISSING"
              echo "UAC2_DEPENDENCIES=FAIL (${SYM} is not =y in the stock defconfig)"
              exit 1
            fi
          }
          need CONFIG_USB_GADGET
          need CONFIG_USB_CONFIGFS
          need CONFIG_USB_LIBCOMPOSITE
          need CONFIG_SND
          need CONFIG_SND_PCM
          need CONFIG_USB_DWC3
          need CONFIG_USB_F_FS
          grep -q 'dwc3.*udc\|udc' "${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}" \
            && record "UDC_DRIVER=CONFIG_USB_DWC3 (present in defconfig)" || record "UDC_DRIVER=see CONFIG_USB_DWC3"
          record "TARGET_LINE_COUNT=$(grep -c 'CONFIG_USB_CONFIGFS_F_UAC2' "${STOCK_SRC}/arch/arm64/configs/${{ inputs.defconfig }}")"
          record "CONFIG_DELTA_COUNT=1"
          record "SOURCE_DELTA_COUNT=0"
          echo "UAC2_DEPENDENCIES=PASS"

      - name: "phase 2 · stock baseline clean build (unmodified source)"
        if: ${{ inputs.build_mode != 'uac2' }}
        run: |
          set -uo pipefail
          mkdir -p "${RESULTS}/stock"
          # Build environment gate (defence in depth): scripts/link-vmlinux.sh runs the Samsung
          # Python 2 post-link instrumentation between the final link and the Image. Fail here by
          # name rather than minutes later with an opaque SyntaxError from inside that script.
          BUILD_PYTHON_MAJOR="$(python -c 'import sys; print(sys.version_info[0])' 2>/dev/null || echo unknown)"
          echo "BUILD_PYTHON_MAJOR=${BUILD_PYTHON_MAJOR}"
          [ "${BUILD_PYTHON_MAJOR}" = "2" ] \
            || { echo "STOCK_BUILD=FAIL (python on PATH is not Python 2; the Samsung vmlinux post-link step would fail)"; exit 1; }
          RECIPE="${GITHUB_WORKSPACE}/${SOURCE_REPO_DIR}/kernel/scripts/build_kernel.sh"
          bash "${RECIPE}" --src "${GITHUB_WORKSPACE}/${STOCK_SRC}" --out "${GITHUB_WORKSPACE}/${STOCK_OUT}" \
            --build-mode "${BUILD_MODE_SAMSUNG}" \
            --defconfig "${{ inputs.defconfig }}" \
            --expect-defconfig-sha256 "${DEFCONFIG_SHA256_BEFORE_FIXED}" \
            --expect-uac2-config not_set \
            2>&1 | tee "${RESULTS}/stock/recipe.txt"
          # Stage what the recipe wrote into its own evidence directory BEFORE any gate below can
          # exit: on a failed build this is exactly the material that names the blocker (in run
          # 36970048474 these copies sat after the BUILD_RECIPE=OK gate, so the published artifact
          # held recipe.txt only - no .config, no failure extract, no build tail).
          for ev in failure-summary.txt build-tail.txt .config SHA256SUMS config-evidence.sha256; do
            [ -f "${STOCK_OUT}/${ev}" ] && cp -f "${STOCK_OUT}/${ev}" "${RESULTS}/stock/${ev}" || true
          done
          echo "STAGED_FROM_STOCK_OUT=$(ls -1 "${RESULTS}/stock" | tr '\n' ' ')"
          grep -q '^BUILD_RECIPE=OK$' "${RESULTS}/stock/recipe.txt" \
            || { echo "STOCK_BUILD=FAIL (recipe did not report OK)"; exit 1; }
          # The stock phase must have run in the vendor's own mode - an O= build is a
          # different compile path and is not an acceptable stock baseline.
          grep -E '^(BUILD_MODE|IN_TREE_BUILD|OFFICIAL_USES_O|SAMSUNG_OFFICIAL_BUILD_MODE|SAMSUNG_EQUIVALENT_BUILD|BUILD_COMMAND_USES_O|KBUILD_OBJTREE|UH_BLOB_PRESENT|UH_BLOB_PATH|UH_BLOB_SIZE|UH_BLOB_SHA256|UH_BLOB_GENERATED_OR_STATIC)=' \
            "${RESULTS}/stock/recipe.txt" | tee "${RESULTS}/stock/build-semantics.txt"
          grep -q '^IN_TREE_BUILD=YES$' "${RESULTS}/stock/recipe.txt" \
            || { echo "STOCK_BUILD=FAIL (stock phase did not build in-tree)"; exit 1; }
          grep -q '^BUILD_COMMAND_USES_O=NO' "${RESULTS}/stock/recipe.txt" \
            || { echo "STOCK_BUILD=FAIL (stock phase passed O= to make)"; exit 1; }
          grep -q '^DEFCONFIG_SHA256_AFTER_BUILD=' "${RESULTS}/stock/recipe.txt" \
            || { echo "STOCK_BUILD=FAIL (no post-build defconfig hash evidence)"; exit 1; }

          cp "${STOCK_OUT}/arch/arm64/boot/Image" "${RESULTS}/stock/Image"
          cp "${STOCK_OUT}/.config" "${RESULTS}/stock/.config"
          cp "${STOCK_OUT}/SHA256SUMS" "${RESULTS}/stock/SHA256SUMS"
          {
            head -n 60 "${STOCK_OUT}/build.log"
            echo "----- [trimmed: warnings and errors] -----"
            grep -n -E 'warning:|error:|Error [0-9]+|\*\*\*' "${STOCK_OUT}/build.log" | head -n 200 || true
            echo "----- [tail] -----"
            tail -n 150 "${STOCK_OUT}/build.log"
          } > "${RESULTS}/stock/build.log"

          STOCK_IMAGE_SIZE="$(stat -c '%s' "${RESULTS}/stock/Image")"
          STOCK_IMAGE_SHA256="$(sha256sum "${RESULTS}/stock/Image" | awk '{print $1}')"
          STOCK_CONFIG_SHA256="$(sha256sum "${RESULTS}/stock/.config" | awk '{print $1}')"
          echo "STOCK_IMAGE_SIZE=${STOCK_IMAGE_SIZE}"
          echo "STOCK_IMAGE_SHA256=${STOCK_IMAGE_SHA256}"
          echo "STOCK_CONFIG_SHA256=${STOCK_CONFIG_SHA256}"
          echo "STOCK_BUILD_LOG_LINES=$(wc -l < "${RESULTS}/stock/build.log")"
          grep -E '^(GCC_VERSION|TOOLCHAIN_MODE|BUILD_SECONDS|BUILD_WARNINGS|BUILD_ERRORS|UAC2_SYMBOL_STATUS|MODULES_BUILT)=' "${RESULTS}/stock/recipe.txt" || true
          for ev in flag-scope-target.txt flag-scope-target-fcommon.txt flag-scope-host.txt; do
            [ -f "${STOCK_OUT}/${ev}" ] && cp "${STOCK_OUT}/${ev}" "${RESULTS}/stock/${ev}" || true
          done
          echo "STOCK_BUILD=PASS"
          # Free the stock tree before the UAC2 phase extracts its own pristine copy: one
          # tree at a time keeps peak disk use inside a standard ubuntu-22.04 runner. The
          # Image, .config, logs and hashes this phase produced are already captured above.
          rm -rf "${STOCK_SRC}"
          echo "PURGE_STOCK_SRC=DONE (stock tree removed; only evidence retained)"
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      - name: "phase 4 · fresh UAC2 tree + minimal config delta (config only)"
        if: ${{ inputs.build_mode != 'stock' }}
        run: |
          set -uo pipefail
          mkdir -p "${RESULTS}/uac2"
          # Isolation by construction: the UAC2 phase never reuses the stock tree. It
          # extracts its own copy from the SAME verified archive (size + sha256 + member
          # count re-checked), and only that copy is patched.
          SIZE_ACTUAL="$(stat -c '%s' "${SOURCE_ARCHIVE}")"
          [ "${SIZE_ACTUAL}" = "${KERNEL_SOURCE_SIZE_FIXED}" ] \
            || { echo "UAC2_DELTA=FAIL (archive size changed before the second extraction)"; exit 1; }
          SHA_ACTUAL="$(sha256sum "${SOURCE_ARCHIVE}" | awk '{print $1}' | tr 'A-F' 'a-f')"
          [ "${SHA_ACTUAL}" = "$(printf '%s' "${KERNEL_SOURCE_SHA256_FIXED}" | tr 'A-F' 'a-f')" ] \
            || { echo "UAC2_DELTA=FAIL (archive sha256 changed before the second extraction)"; exit 1; }
          MEMBERS_ACTUAL="$(tar -tzf "${SOURCE_ARCHIVE}" | wc -l)"
          [ "${MEMBERS_ACTUAL}" = "${KERNEL_SOURCE_MEMBERS_FIXED}" ] \
            || { echo "UAC2_DELTA=FAIL (archive member count changed before the second extraction)"; exit 1; }
          [ ! -d "${UAC2_SRC}" ] \
            || { echo "UAC2_DELTA=FAIL (${UAC2_SRC} already exists; refusing to reuse a tree)"; exit 1; }
          mkdir -p "${UAC2_SRC}"
          tar -xzf "${SOURCE_ARCHIVE}" -C "${UAC2_SRC}" \
            || { echo "UAC2_DELTA=FAIL (second extraction failed)"; exit 1; }
          [ -f "${UAC2_SRC}/Makefile" ] || { echo "UAC2_DELTA=FAIL (no Makefile in the UAC2 tree)"; exit 1; }
          [ -f "${UAC2_SRC}/init/uh.8g.elf" ] \
            || { echo "UAC2_DELTA=FAIL (the .incbin payload is missing from the UAC2 tree)"; exit 1; }
          [ ! -f "${UAC2_SRC}/.config" ] \
            || { echo "UAC2_DELTA=FAIL (the freshly extracted UAC2 tree already has .config)"; exit 1; }
          echo "UAC2_SRC=${UAC2_SRC}"
          echo "UAC2_SRC_FRESH_EXTRACT=YES (independent copy of the same verified archive)"
          echo "STOCK_TREE_REUSED=NO"
          echo "UH_BLOB_SHA256=$(sha256sum "${UAC2_SRC}/init/uh.8g.elf" | awk '{print $1}')"

          DEFCONFIG_PATH="${UAC2_SRC}/arch/arm64/configs/${{ inputs.defconfig }}"
          PATCH="${GITHUB_WORKSPACE}/${SOURCE_REPO_DIR}/kernel/patches/K1_UAC2_MINIMAL.patch"
          BEFORE="$(sha256sum "${DEFCONFIG_PATH}" | awk '{print $1}')"
          [ "${BEFORE}" = "${DEFCONFIG_SHA256_BEFORE_FIXED}" ] \
            || { echo "UAC2_DELTA=FAIL (defconfig is not the pinned stock file before patching)"; exit 1; }
          git apply -p1 --directory="${UAC2_SRC}" --verbose "${PATCH}" \
            || { echo "UAC2_DELTA=FAIL (patch did not apply)"; exit 1; }
          AFTER="$(sha256sum "${DEFCONFIG_PATH}" | awk '{print $1}')"
          echo "DEFCONFIG_SHA256_BEFORE=${BEFORE}"
          echo "DEFCONFIG_SHA256_AFTER=${AFTER}"
          [ "${AFTER}" = "${DEFCONFIG_SHA256_AFTER_FIXED}" ] \
            || { echo "UAC2_DELTA=FAIL (patched defconfig hash is not the reproducible expected hash)"; exit 1; }
          if grep -q '^# CONFIG_USB_CONFIGFS_F_UAC2 is not set$' "${DEFCONFIG_PATH}"; then
            echo "UAC2_DELTA=FAIL (conflicting 'is not set' line still present)"; exit 1
          fi
          [ "$(grep -c '^CONFIG_USB_CONFIGFS_F_UAC2=y$' "${DEFCONFIG_PATH}")" = "1" ] \
            || { echo "UAC2_DELTA=FAIL (expected exactly one CONFIG_USB_CONFIGFS_F_UAC2=y line)"; exit 1; }
          REMOVED="$(grep -c -- '^-[# ]*CONFIG_' "${PATCH}" || true)"
          ADDED="$(grep -c -- '^+[# ]*CONFIG_' "${PATCH}" || true)"
          echo "PATCH_REMOVED_CONFIG_LINES=${REMOVED}"
          echo "PATCH_ADDED_CONFIG_LINES=${ADDED}"
          [ "${REMOVED}" = "1" ] && [ "${ADDED}" = "1" ] \
            || { echo "UAC2_DELTA=FAIL (the K1 delta must touch exactly one config line)"; exit 1; }
          cp "${PATCH}" "${RESULTS}/uac2/config-delta.diff"
          echo "CONFIG_DELTA_COUNT=1"
          echo "SOURCE_DELTA_COUNT=0"
          echo "UAC2_DELTA=PASS"

      - name: "phase 5 · UAC2 clean build (fresh tree, in-tree build)"
        if: ${{ inputs.build_mode != 'stock' }}
        run: |
          set -uo pipefail
          mkdir -p "${RESULTS}/uac2"
          BUILD_PYTHON_MAJOR="$(python -c 'import sys; print(sys.version_info[0])' 2>/dev/null || echo unknown)"
          echo "BUILD_PYTHON_MAJOR=${BUILD_PYTHON_MAJOR}"
          [ "${BUILD_PYTHON_MAJOR}" = "2" ] \
            || { echo "UAC2_BUILD=FAIL (python on PATH is not Python 2; the Samsung vmlinux post-link step would fail)"; exit 1; }
          RECIPE="${GITHUB_WORKSPACE}/${SOURCE_REPO_DIR}/kernel/scripts/build_kernel.sh"
          bash "${RECIPE}" --src "${GITHUB_WORKSPACE}/${UAC2_SRC}" --out "${GITHUB_WORKSPACE}/${UAC2_OUT}" \
            --build-mode "${BUILD_MODE_SAMSUNG}" \
            --defconfig "${{ inputs.defconfig }}" \
            --expect-defconfig-sha256 "${DEFCONFIG_SHA256_AFTER_FIXED}" \
            --expect-uac2-config y \
            2>&1 | tee "${RESULTS}/uac2/recipe.txt"
          for ev in failure-summary.txt build-tail.txt .config SHA256SUMS config-evidence.sha256; do
            [ -f "${UAC2_OUT}/${ev}" ] && cp -f "${UAC2_OUT}/${ev}" "${RESULTS}/uac2/${ev}" || true
          done
          echo "STAGED_FROM_UAC2_OUT=$(ls -1 "${RESULTS}/uac2" | tr '\n' ' ')"
          grep -q '^BUILD_RECIPE=OK$' "${RESULTS}/uac2/recipe.txt" \
            || { echo "UAC2_BUILD=FAIL (recipe did not report OK)"; exit 1; }
          grep -E '^(BUILD_MODE|IN_TREE_BUILD|OFFICIAL_USES_O|SAMSUNG_OFFICIAL_BUILD_MODE|SAMSUNG_EQUIVALENT_BUILD|BUILD_COMMAND_USES_O|KBUILD_OBJTREE|UH_BLOB_PRESENT|UH_BLOB_PATH|UH_BLOB_SIZE|UH_BLOB_SHA256)=' \
            "${RESULTS}/uac2/recipe.txt" | tee "${RESULTS}/uac2/build-semantics.txt"
          grep -q '^IN_TREE_BUILD=YES$' "${RESULTS}/uac2/recipe.txt" \
            || { echo "UAC2_BUILD=FAIL (uac2 phase did not build in-tree)"; exit 1; }
          grep -q '^BUILD_COMMAND_USES_O=NO' "${RESULTS}/uac2/recipe.txt" \
            || { echo "UAC2_BUILD=FAIL (uac2 phase passed O= to make)"; exit 1; }

          cp "${UAC2_OUT}/arch/arm64/boot/Image" "${RESULTS}/uac2/Image"
          cp "${UAC2_OUT}/.config" "${RESULTS}/uac2/.config"
          cp "${UAC2_OUT}/SHA256SUMS" "${RESULTS}/uac2/SHA256SUMS"
          {
            head -n 60 "${UAC2_OUT}/build.log"
            echo "----- [trimmed: warnings and errors] -----"
            grep -n -E 'warning:|error:|Error [0-9]+|\*\*\*' "${UAC2_OUT}/build.log" | head -n 200 || true
            echo "----- [tail] -----"
            tail -n 150 "${UAC2_OUT}/build.log"
          } > "${RESULTS}/uac2/build.log"

          echo "UAC2_IMAGE_SIZE=$(stat -c '%s' "${RESULTS}/uac2/Image")"
          echo "UAC2_IMAGE_SHA256=$(sha256sum "${RESULTS}/uac2/Image" | awk '{print $1}')"
          echo "UAC2_CONFIG_SHA256=$(sha256sum "${RESULTS}/uac2/.config" | awk '{print $1}')"
          grep -E '^(GCC_VERSION|TOOLCHAIN_MODE|BUILD_SECONDS|BUILD_WARNINGS|BUILD_ERRORS|UAC2_SYMBOL_STATUS|MODULES_BUILT)=' "${RESULTS}/uac2/recipe.txt" || true
          for ev in flag-scope-target.txt flag-scope-target-fcommon.txt flag-scope-host.txt; do
            [ -f "${UAC2_OUT}/${ev}" ] && cp "${UAC2_OUT}/${ev}" "${RESULTS}/uac2/${ev}" || true
          done
          echo "UAC2_BUILD=PASS"
          rm -rf "${UAC2_SRC}"
          echo "PURGE_UAC2_SRC=DONE (uac2 tree removed; only evidence retained)"
          df -h "$GITHUB_WORKSPACE" | tail -n 1

      - name: "phase 6+7 · static verification and stock-vs-uac2 comparison"
        if: ${{ inputs.build_mode == 'compare' }}
        run: |
          set -uo pipefail
          STOCK_CONFIG="${RESULTS}/stock/.config"
          UAC2_CONFIG="${RESULTS}/uac2/.config"
          [ -f "${STOCK_CONFIG}" ] || { echo "STATIC_VERIFY=FAIL (stock .config missing)"; exit 1; }
          [ -f "${UAC2_CONFIG}" ] || { echo "STATIC_VERIFY=FAIL (uac2 .config missing)"; exit 1; }

          diff -u "${STOCK_CONFIG}" "${UAC2_CONFIG}" > "${RESULTS}/config.diff" || true
          CHANGED="$(grep -c -E '^[-+]CONFIG_' "${RESULTS}/config.diff" || true)"
          echo "CONFIG_DIFF_CHANGED_LINES=${CHANGED}"
          grep -E '^[-+]CONFIG_' "${RESULTS}/config.diff" || true

          UNEXPECTED="$(grep -E '^[-+]CONFIG_' "${RESULTS}/config.diff" \
            | grep -v -E 'CONFIG_USB_CONFIGFS_F_UAC2|CONFIG_USB_F_UAC2' | wc -l || true)"
          echo "EXPECTED_CONFIG_DELTA=2"
          echo "UNEXPECTED_CONFIG_DRIFT=${UNEXPECTED}"

          STOCK_SIZE="$(stat -c '%s' "${RESULTS}/stock/Image")"
          UAC2_SIZE="$(stat -c '%s' "${RESULTS}/uac2/Image")"
          IMAGE_SIZE_DELTA=$(( UAC2_SIZE - STOCK_SIZE ))
          STOCK_WARN="$(grep -E '^BUILD_WARNINGS=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_WARN="$(grep -E '^BUILD_WARNINGS=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          BUILD_WARNING_DELTA=$(( ${UAC2_WARN:-0} - ${STOCK_WARN:-0} ))
          STOCK_SYM="$(grep -E '^UAC2_SYMBOL_STATUS=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_SYM="$(grep -E '^UAC2_SYMBOL_STATUS=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_MODS="$(grep -E '^MODULES_BUILT=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_MODS="$(grep -E '^MODULES_BUILT=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_HOSTCFLAGS="$(grep -E '^HOSTCFLAGS_EFFECTIVE=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2- || true)"
          UAC2_HOSTCFLAGS="$(grep -E '^HOSTCFLAGS_EFFECTIVE=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2- || true)"
          STOCK_SCOPE="$(grep -E '^HOSTCFLAGS_SCOPE_PROOF=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2- || true)"
          UAC2_SCOPE="$(grep -E '^HOSTCFLAGS_SCOPE_PROOF=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2- || true)"
          STOCK_DTC="$(grep -E '^DTC_BUILD=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_DTC="$(grep -E '^DTC_BUILD=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_TGT_HITS="$(grep -E '^TARGET_FCOMMON_HITS=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_TGT_HITS="$(grep -E '^TARGET_FCOMMON_HITS=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_TGT_LINES="$(grep -E '^TARGET_CC_LINES=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_TGT_LINES="$(grep -E '^TARGET_CC_LINES=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_HOST_FLAGS="$(grep -E '^HOST_CC_VERSION=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2- || true)"
          STOCK_TGT_WHOLE="$(grep -E '^TARGET_WHOLEFILE_FCOMMON_HITS=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_TGT_WHOLE="$(grep -E '^TARGET_WHOLEFILE_FCOMMON_HITS=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_CFG_FUAC2="$(grep -E '^BUILT_CONFIG_F_UAC2_STATE=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_CFG_FUAC2="$(grep -E '^BUILT_CONFIG_F_UAC2_STATE=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_CFG_VERIFIED="$(grep -E '^UAC2_CONFIG_VERIFIED=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_CFG_VERIFIED="$(grep -E '^UAC2_CONFIG_VERIFIED=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_MODE="$(grep -E '^SAMSUNG_OFFICIAL_BUILD_MODE=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_MODE="$(grep -E '^SAMSUNG_OFFICIAL_BUILD_MODE=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_INTREE="$(grep -E '^IN_TREE_BUILD=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_INTREE="$(grep -E '^IN_TREE_BUILD=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_USES_O="$(grep -E '^BUILD_COMMAND_USES_O=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_USES_O="$(grep -E '^BUILD_COMMAND_USES_O=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"
          STOCK_UH_BLOB="$(grep -E '^UH_BLOB_SHA256=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2 || true)"
          UAC2_UH_BLOB="$(grep -E '^UH_BLOB_SHA256=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2 || true)"

          {
            echo "STOCK_CONFIG_SHA256=$(sha256sum "${STOCK_CONFIG}" | awk '{print $1}')"
            echo "UAC2_CONFIG_SHA256=$(sha256sum "${UAC2_CONFIG}" | awk '{print $1}')"
            echo "IMAGE_SIZE_DELTA=${IMAGE_SIZE_DELTA}"
            echo "UAC2_SYMBOL_STATUS=${UAC2_SYM}"
            echo "BUILD_WARNING_DELTA=${BUILD_WARNING_DELTA}"
            echo "HOST_FIX_SCOPE=HOST_ONLY"
            echo "HOSTCFLAGS_EFFECTIVE=${STOCK_HOSTCFLAGS:-n/a}"
            echo "DTC_BUILD=stock:${STOCK_DTC:-n/a} uac2:${UAC2_DTC:-n/a}"
            echo "TARGET_FCOMMON_HITS=stock:${STOCK_TGT_HITS:-n/a} uac2:${UAC2_TGT_HITS:-n/a}"
            echo "TARGET_CC_LINES=stock:${STOCK_TGT_LINES:-n/a} uac2:${UAC2_TGT_LINES:-n/a}"
            echo "TARGET_WHOLEFILE_FCOMMON_HITS=stock:${STOCK_TGT_WHOLE:-n/a} uac2:${UAC2_TGT_WHOLE:-n/a} (diagnostic only: whole transcript, includes reprinted host commands)"
            echo "BUILT_CONFIG_F_UAC2=stock:${STOCK_CFG_FUAC2:-n/a} uac2:${UAC2_CFG_FUAC2:-n/a} (read from the generated .config, not from the patch input)"
            echo "SAMSUNG_OFFICIAL_BUILD_MODE=${STOCK_MODE:-n/a} (vendor build_kernel.sh:8,10 / AndroidKernel.mk:66,98 never pass O=)"
            echo "OFFICIAL_USES_O=NO"
            echo "IN_TREE_BUILD=stock:${STOCK_INTREE:-n/a} uac2:${UAC2_INTREE:-n/a}"
            echo "BUILD_COMMAND_USES_O=stock:${STOCK_USES_O:-n/a} uac2:${UAC2_USES_O:-n/a}"
            echo "UH_BLOB_SHA256=stock:${STOCK_UH_BLOB:-n/a} uac2:${UAC2_UH_BLOB:-n/a} (init/uh.8g.elf, the init/_uh.S .incbin payload)"
          } > "${RESULTS}/stock-vs-uac2.txt"

          {
            echo "K1 STATIC VERIFICATION (offline, no device involved)"
            echo "stock Image      : $(stat -c '%s' "${RESULTS}/stock/Image") bytes  $(sha256sum "${RESULTS}/stock/Image" | awk '{print $1}')"
            echo "uac2  Image      : $(stat -c '%s' "${RESULTS}/uac2/Image") bytes  $(sha256sum "${RESULTS}/uac2/Image" | awk '{print $1}')"
            echo "image size delta : ${IMAGE_SIZE_DELTA} bytes"
            echo "config changed   : ${CHANGED} lines (expected 2)"
            echo "unexpected drift : ${UNEXPECTED} lines"
            echo "f_uac2 symbol    : stock=${STOCK_SYM:-n/a} uac2=${UAC2_SYM:-n/a}"
            echo "modules built    : stock=${STOCK_MODS:-n/a} uac2=${UAC2_MODS:-n/a}"
            echo "warnings delta   : ${BUILD_WARNING_DELTA} (stock=${STOCK_WARN:-n/a} uac2=${UAC2_WARN:-n/a})"
            echo "uac2 .config     :"
            grep -E 'CONFIG_USB_CONFIGFS_F_UAC2|CONFIG_USB_F_UAC2|CONFIG_SND_PCM|CONFIG_USB_LIBCOMPOSITE' "${UAC2_CONFIG}" || true
            echo "stock .config    :"
            grep -E 'CONFIG_USB_CONFIGFS_F_UAC2|CONFIG_USB_F_UAC2|CONFIG_SND_PCM|CONFIG_USB_LIBCOMPOSITE' "${STOCK_CONFIG}" || true
            echo "conflicting 'is not set' lines in uac2 .config: $(grep -c '^# CONFIG_USB_CONFIGFS_F_UAC2 is not set$' "${UAC2_CONFIG}" || true)"
            echo "host fix scope   : HOST_ONLY (HOST_BUILD_COMPATIBILITY_FIX, not a kernel source patch)"
            echo "host cc          : ${STOCK_HOST_FLAGS:-n/a}"
            echo "hostflags        : ${STOCK_HOSTCFLAGS:-n/a}"
            echo "host dtc         : stock=${STOCK_DTC:-n/a} uac2=${UAC2_DTC:-n/a}"
            echo "host-only proof  : stock=${STOCK_SCOPE:-n/a} uac2=${UAC2_SCOPE:-n/a}"
            echo "target cc lines  : stock=${STOCK_TGT_LINES:-n/a} uac2=${UAC2_TGT_LINES:-n/a} (target probe must be non-empty)"
            echo "target -fcommon  : stock=${STOCK_TGT_HITS:-n/a} uac2=${UAC2_TGT_HITS:-n/a} (intersection with target cc lines; must both be 0)"
            echo "whole-file hits  : stock=${STOCK_TGT_WHOLE:-n/a} uac2=${UAC2_TGT_WHOLE:-n/a} (diagnostic; host commands reprinted by -B are expected here)"
            echo "built .config    : stock CONFIG_USB_CONFIGFS_F_UAC2=${STOCK_CFG_FUAC2:-n/a} uac2=${UAC2_CFG_FUAC2:-n/a} (verified from .config, not from the patch)"
            echo "build mode       : ${STOCK_MODE:-n/a} (Samsung official; the vendor scripts never pass O=)"
            echo "in-tree build    : stock=${STOCK_INTREE:-n/a} uac2=${UAC2_INTREE:-n/a}  (assembler CWD = tree root)"
            echo "O= used          : stock=${STOCK_USES_O:-n/a} uac2=${UAC2_USES_O:-n/a}  (must be NO for both phases)"
            echo "uh .incbin blob  : ${STOCK_UH_BLOB:-n/a} (init/uh.8g.elf; identical in both phases)"
          } > "${RESULTS}/static-verification.txt"
          cat "${RESULTS}/static-verification.txt"

          {
            echo "K1 BUILD REPORT"
            echo "run            : ${GITHUB_RUN_ID} ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "runner         : ${{ inputs.runner }}"
            echo "source mode    : private release asset ${{ inputs.source_asset_tag }}/${{ inputs.source_asset_name }}"
            echo "source sha256  : ${{ needs.preflight.outputs.source_sha256 }}"
            echo "source sha     : $(grep -E '^PRIVATE_SOURCE_SHA_SHORT=' "${RESULTS}/source-identity.txt" | cut -d= -f2) (short)"
            echo "defconfig      : ${{ inputs.defconfig }}"
            echo "gcc (stock)    : $(grep -E '^GCC_VERSION=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2-)"
            echo "gcc (uac2)     : $(grep -E '^GCC_VERSION=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2-)"
            echo "stock build s  : $(grep -E '^BUILD_SECONDS=' "${RESULTS}/stock/recipe.txt" | cut -d= -f2)"
            echo "uac2  build s  : $(grep -E '^BUILD_SECONDS=' "${RESULTS}/uac2/recipe.txt" | cut -d= -f2)"
            echo "config delta   : CONFIG_DELTA_COUNT=1 (one defconfig switch, CONFIG_USB_CONFIGFS_F_UAC2)  SOURCE_DELTA_COUNT=0  built .config changed lines=${CHANGED} (the switch plus the dependency it selects)"
            echo "host fix       : HOST_FIX_SCOPE=HOST_ONLY  HOSTCFLAGS = ${STOCK_HOSTCFLAGS:-n/a}"
            echo "host dtc       : stock=${STOCK_DTC:-n/a} uac2=${UAC2_DTC:-n/a}"
            echo "flag scope     : target_cc_lines stock=${STOCK_TGT_LINES:-n/a} uac2=${UAC2_TGT_LINES:-n/a}; target -fcommon hits stock=${STOCK_TGT_HITS:-n/a} uac2=${UAC2_TGT_HITS:-n/a}"
            echo "build mode     : ${STOCK_MODE:-n/a}  OFFICIAL_USES_O=NO  IN_TREE_BUILD stock=${STOCK_INTREE:-n/a} uac2=${UAC2_INTREE:-n/a}"
            echo "uh .incbin blob: init/uh.8g.elf sha256=${STOCK_UH_BLOB:-n/a} (static payload shipped in the archive)"
            echo "image safety   : the built Image is not published from this public farm (only size + sha256 are); PRIVATE_IMAGE_PERSISTENCE=PENDING"
            echo "artefacts      : published as text = SHA256SUMS config.diff config-delta.diff static-verification.txt stock-vs-uac2.txt build-report.txt plus build logs, recipes and markers; withheld = the built Image (size + sha256 only) and the resolved .config (sha256 + changed lines only)"
            echo "device writes  : 0 (this workflow cannot reach a device)"
          } > "${RESULTS}/build-report.txt"
          cat "${RESULTS}/build-report.txt"

          # Samsung-official build semantics are part of the acceptance evidence, not a
          # convenience choice: both phases must have built in-tree with no O= anywhere.
          if [ "${STOCK_INTREE:-x}" != "YES" ] || [ "${UAC2_INTREE:-x}" != "YES" ]; then
            echo "STATIC_VERIFY=FAIL (a phase did not build in-tree: stock=${STOCK_MODE:-n/a}/${STOCK_INTREE:-n/a} uac2=${UAC2_MODE:-n/a}/${UAC2_INTREE:-n/a})"
            exit 1
          fi
          case "${STOCK_USES_O:-x}" in NO*) : ;; *) echo "STATIC_VERIFY=FAIL (stock phase passed O= to make: ${STOCK_USES_O:-n/a})"; exit 1 ;; esac
          case "${UAC2_USES_O:-x}" in NO*) : ;; *) echo "STATIC_VERIFY=FAIL (uac2 phase passed O= to make: ${UAC2_USES_O:-n/a})"; exit 1 ;; esac
          if [ -z "${STOCK_UH_BLOB:-}" ] || [ "${STOCK_UH_BLOB}" != "${UAC2_UH_BLOB:-}" ]; then
            echo "STATIC_VERIFY=FAIL (the init/_uh.S .incbin payload differs between phases: stock=${STOCK_UH_BLOB:-n/a} uac2=${UAC2_UH_BLOB:-n/a})"
            exit 1
          fi
          echo "SAMSUNG_OFFICIAL_BUILD_MODE=IN_TREE"
          echo "OFFICIAL_USES_O=NO"
          echo "UH_BLOB_SHA256=${STOCK_UH_BLOB}"

          if [ "${CHANGED}" != "2" ] || [ "${UNEXPECTED}" != "0" ]; then
            echo "STATIC_VERIFY=FAIL (unexplained config drift: changed=${CHANGED} unexpected=${UNEXPECTED})"
            exit 1
          fi
          if [ "${UAC2_SYM}" != "present" ]; then
            echo "STATIC_VERIFY=FAIL (f_uac2 not found in the uac2 built-in objects)"
            exit 1
          fi
          if [ "${STOCK_DTC:-FAIL}" != "PASS" ] || [ "${UAC2_DTC:-FAIL}" != "PASS" ]; then
            echo "STATIC_VERIFY=FAIL (host dtc tool did not build: stock=${STOCK_DTC:-n/a} uac2=${UAC2_DTC:-n/a})"
            exit 1
          fi
          if [ "${STOCK_TGT_HITS:-x}" != "0" ] || [ "${UAC2_TGT_HITS:-x}" != "0" ]; then
            echo "STATIC_VERIFY=FAIL (-fcommon reached the ARCH=arm64 target compile flags: stock=${STOCK_TGT_HITS:-n/a} uac2=${UAC2_TGT_HITS:-n/a})"
            exit 1
          fi
          if [ "${STOCK_TGT_LINES:-0}" = "0" ] || [ "${UAC2_TGT_LINES:-0}" = "0" ] \
             || [ "${STOCK_TGT_LINES:-0}" = "" ] || [ "${UAC2_TGT_LINES:-0}" = "" ]; then
            echo "STATIC_VERIFY=FAIL (flag-scope evidence inconclusive: target cc lines stock=${STOCK_TGT_LINES:-none} uac2=${UAC2_TGT_LINES:-none})"
            exit 1
          fi
          if [ "${STOCK_CFG_VERIFIED:-FAIL}" != "PASS" ] || [ "${UAC2_CFG_VERIFIED:-FAIL}" != "PASS" ]; then
            echo "STATIC_VERIFY=FAIL (built .config UAC2 state was not verified: stock=${STOCK_CFG_VERIFIED:-n/a} uac2=${UAC2_CFG_VERIFIED:-n/a})"
            exit 1
          fi
          if [ "${STOCK_CFG_FUAC2:-x}" != "not_set" ] || [ "${UAC2_CFG_FUAC2:-x}" != "y" ]; then
            echo "STATIC_VERIFY=FAIL (built .config UAC2 state is not the expected one: stock=${STOCK_CFG_FUAC2:-n/a} uac2=${UAC2_CFG_FUAC2:-n/a})"
            exit 1
          fi
          echo "HOST_FIX_SCOPE=HOST_ONLY"
          echo "HOSTCFLAGS_EFFECTIVE=${STOCK_HOSTCFLAGS:-n/a}"
          echo "TARGET_FCOMMON_HITS=0"
          echo "STATIC_VERIFY=PASS"
          {
            echo "EXPECTED_CONFIG_DELTA=2"
            echo "UNEXPECTED_CONFIG_DRIFT=${UNEXPECTED}"
            echo "CONFIG_DELTA_COUNT=1"
            echo "SOURCE_DELTA_COUNT=0"
            echo "IMAGE_SIZE_DELTA=${IMAGE_SIZE_DELTA}"
            echo "BUILD_WARNING_DELTA=${BUILD_WARNING_DELTA}"
            echo "STOCK_CONFIG_SHA256=$(sha256sum "${STOCK_CONFIG}" | awk '{print $1}')"
            echo "UAC2_CONFIG_SHA256=$(sha256sum "${UAC2_CONFIG}" | awk '{print $1}')"
            echo "HOST_FIX_SCOPE=HOST_ONLY"
            echo "HOSTCFLAGS_EFFECTIVE=${STOCK_HOSTCFLAGS:-n/a}"
            echo "DTC_BUILD=stock:${STOCK_DTC:-n/a} uac2:${UAC2_DTC:-n/a}"
            echo "TARGET_FCOMMON_HITS=0"
            echo "TARGET_CC_LINES=stock:${STOCK_TGT_LINES:-n/a} uac2:${UAC2_TGT_LINES:-n/a}"
            echo "TARGET_WHOLEFILE_FCOMMON_HITS=stock:${STOCK_TGT_WHOLE:-n/a} uac2:${UAC2_TGT_WHOLE:-n/a}"
            echo "BUILT_CONFIG_F_UAC2=stock:${STOCK_CFG_FUAC2:-n/a} uac2:${UAC2_CFG_FUAC2:-n/a}"
            echo "UAC2_CONFIG_VERIFIED=PASS (read from the generated .config, not from the patch input)"
            echo "UAC2_SYMBOL_STATUS=${UAC2_SYM}"
            echo "STATIC_VERIFY=PASS"
          } > "${RESULTS}/markers.txt"
          cat "${RESULTS}/markers.txt"

      - name: "phase 8a · stage the evidence allowlist (no source tree, archive, binary or secret)"
        if: ${{ always() }}
        run: |
          set -uo pipefail
          rm -rf evidence
          mkdir -p evidence
          # A run that fails early must still leave usable evidence behind: the failure
          # summary, the tail of the build log, the resolved .config and the hashes are
          # what make a blocker diagnosable without re-running the build.
          #
          # The three comparisons the K1 specification asks for are staged here too: a run
          # that built both images and then failed the upload was one missing line in this
          # loop away from publishing no verification text at all (run 36974962825 uploaded
          # 15 files while the results directory held the comparison, the static verification
          # and the build report).
          for f in SUMMARY.txt markers.txt run-metadata.txt source-identity.txt uac2-dependencies.txt python-env.txt \
                   static-verification.txt stock-vs-uac2.txt build-report.txt config.diff; do
            [ -f "${RESULTS}/${f}" ] && cp -f "${RESULTS}/${f}" evidence/
          done
          # Backfill from the recipe's own evidence directory when a phase died before it copied
          # these out (or when a step-level exit skipped the copy): a partially staged result must
          # not cost the next run its diagnosis. Only these named text files are taken - never the
          # Image the recipe also leaves in that directory.
          for pair in "stock:${STOCK_OUT}" "uac2:${UAC2_OUT}"; do
            d="${pair%%:*}"; out="${pair#*:}"
            mkdir -p "${RESULTS}/${d}"
            for name in failure-summary.txt build-tail.txt .config SHA256SUMS config-evidence.sha256; do
              [ -f "${RESULTS}/${d}/${name}" ] && continue
              [ -f "${out}/${name}" ] && cp -f "${out}/${name}" "${RESULTS}/${d}/${name}" || true
            done
          done
          for d in stock uac2; do
            [ -d "${RESULTS}/${d}" ] || continue
            mkdir -p "evidence/${d}"
            # .config is deliberately absent from this list even though the recipe leaves one in
            # every phase directory: the resolved configuration is a derivative of the vendor
            # defconfig, so only its sha256 (markers.txt) and the changed lines (config.diff,
            # config-delta.diff) leave this public farm. upload-artifact would skip a dotfile
            # anyway, so keeping it out of the allowlist keeps the published set honest.
            for name in build.log build-tail.txt failure-summary.txt recipe.txt build-semantics.txt config.diff config-delta.diff SHA256SUMS config-evidence.sha256; do
              [ -f "${RESULTS}/${d}/${name}" ] && cp -f "${RESULTS}/${d}/${name}" "evidence/${d}/${name}"
            done
            # The built Image binaries are deliberately NOT uploaded: this is a PUBLIC
            # build farm and a compiled kernel image is a derivative of proprietary
            # Samsung source. Their size and sha256 travel as text instead.
          done
          if find evidence -type f \( -name '*.tar.gz' -o -name '*.o' -o -name '*.S' -o -name '*.c' -o -name '*.h' -o -name '*.ko' -o -name '.git*' \) | grep -q .; then
            echo "EVIDENCE_ALLOWLIST=FAIL (a file class that must not leave the runner reached the evidence set)"
            find evidence -type f | head -n 20
            exit 1
          fi
          # Kernel binaries never leave this public farm: only their size and sha256 travel.
          if find evidence -type f \( -name 'Image' -o -name 'Image.*' -o -name 'zImage' -o -name 'vmlinux' -o -name 'vmlinux.*' -o -name '*.img' \) | grep -q .; then
            echo "EVIDENCE_ALLOWLIST=FAIL (a kernel binary reached the evidence set)"
            find evidence -type f | grep -E '(Image|zImage|vmlinux|\.img$)' | head -n 20
            exit 1
          fi
          if grep -rIl -E 'gh[pousr]_[A-Za-z0-9]{20,}|github_pat_[A-Za-z0-9_]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----' evidence >/dev/null 2>&1; then
            echo "EVIDENCE_ALLOWLIST=FAIL (a credential-looking string reached the evidence set)"
            exit 1
          fi
          echo "EVIDENCE_FILES=$(find evidence -type f | wc -l)"
          echo "EVIDENCE_BYTES=$(du -sb evidence | awk '{print $1}')"
          echo "EVIDENCE_ALLOWLIST=PASS (logs, failure extracts, configs, metadata and hashes only)"
          echo "PUBLIC_CONFIG_DUMP=WITHHELD (the resolved .config stays on the runner; its sha256 and the changed lines are published instead)"
          echo "PRIVATE_IMAGE_PERSISTENCE=PENDING (a public farm has no verified private artifact channel, so the built Image stays on the runner and only its size + sha256 are published)"
          find evidence -type f | sort

      - name: "phase 7a · build Samsung-native V2 Odin AP (splice-only, fail-closed)"
        if: ${{ success() && inputs.build_mode != 'stock' }}
        env:
          GH_TOKEN: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          PRIVATE_REPO: Sharkecho/note9-01
          STOCK_TAG: stock-boot-N960NKSU3FVG4
          STOCK_ASSET: N960NKSU3FVG4_SM-N960N_STOCK_BOOT.img
          STOCK_SHA256: a1c2fbd231d4fd6d6265bb1702b18fe9f1a461b80dd747ced32558dddfbe012f
          STOCK_SIZE: "35213856"
          KERNEL_SIZE: "31846408"
          KERNEL_OFFSET: "2048"
          SEANDROID_OFFSET: "35213312"
        run: |
          set -euo pipefail
          mkdir -p "${RESULTS}/v2"
          STOCK="${RESULTS}/v2/stock_boot.img"
          NEWBOOT="${RESULTS}/v2/NOTE9_UAC2_V2_N960N_boot.img"
          AP="${RESULTS}/v2/NOTE9_UAC2_V2_N960N_ODIN_AP.tar.md5"
          gh release download "$STOCK_TAG" --repo "$PRIVATE_REPO" --pattern "$STOCK_ASSET" --dir "${RESULTS}/v2" --clobber
          mv "${RESULTS}/v2/$STOCK_ASSET" "$STOCK"
          [ "$(stat -c '%s' "$STOCK")" = "$STOCK_SIZE" ]
          [ "$(sha256sum "$STOCK" | awk '{print $1}')" = "$STOCK_SHA256" ]
          [ "$(head -c 8 "$STOCK")" = "ANDROID!" ]
          KS="$(od -An -tu4 -N4 -j8 "$STOCK" | tr -d ' ')"
          PS="$(od -An -tu4 -N4 -j36 "$STOCK" | tr -d ' ')"
          [ "$KS" = "$KERNEL_SIZE" ] && [ "$PS" = "2048" ]
          [ "$(stat -c '%s' "${RESULTS}/uac2/Image")" = "$KERNEL_SIZE" ]
          dd if="$STOCK" of="${RESULTS}/v2/header.stock" bs=1 count="$KERNEL_OFFSET" status=none
          dd if="$STOCK" of="${RESULTS}/v2/postkernel.stock" bs=1 skip=$((KERNEL_OFFSET+KERNEL_SIZE)) status=none
          cp "$STOCK" "$NEWBOOT"
          dd if="${RESULTS}/uac2/Image" of="$NEWBOOT" bs=1 seek="$KERNEL_OFFSET" conv=notrunc status=none
          [ "$(stat -c '%s' "$NEWBOOT")" = "$STOCK_SIZE" ]
          cmp -s "${RESULTS}/v2/header.stock" <(head -c "$KERNEL_OFFSET" "$NEWBOOT")
          cmp -s "${RESULTS}/v2/postkernel.stock" <(tail -c +$((KERNEL_OFFSET+KERNEL_SIZE+1)) "$NEWBOOT")
          test "$(dd if="$NEWBOOT" bs=1 skip="$SEANDROID_OFFSET" count=16 status=none)" = "SEANDROIDENFORCE"
          WANT="$(sha256sum "${RESULTS}/uac2/Image" | awk '{print $1}')"
          GOT="$(dd if="$NEWBOOT" bs=1 skip="$KERNEL_OFFSET" count="$KERNEL_SIZE" status=none | sha256sum | awk '{print $1}')"
          [ "$WANT" = "$GOT" ]
          echo "NON_KERNEL_BYTE_DIFF=0"
          echo "SEANDROIDENFORCE=PASS"
          echo "ROUNDTRIP_KERNEL_SHA256=PASS"
          python3 "${SOURCE_REPO_DIR}/scripts/samsung_lz4.py" compress "$NEWBOOT" "${RESULTS}/v2/boot.img.lz4"
          python3 "${SOURCE_REPO_DIR}/scripts/samsung_lz4.py" verify "${RESULTS}/v2/boot.img.lz4" "$NEWBOOT"
          WORK="${RESULTS}/v2/tarstage"; mkdir -p "$WORK"; cp "${RESULTS}/v2/boot.img.lz4" "$WORK/boot.img.lz4"
          TAR="${RESULTS}/v2/AP.tar"
          tar --format=ustar --mode=0664 --owner=1000 --group=1000 --uname=dpi --gname=dpi -C "$WORK" -cf "$TAR" boot.img.lz4
          MD5="$(md5sum "$TAR" | awk '{print $1}')"
          cp "$TAR" "$AP"; printf '%s' "$MD5" | xxd -r -p >> "$AP"
          PAYLOAD=$(( $(stat -c '%s' "$AP") - 16 ))
          [ "$(head -c "$PAYLOAD" "$AP" | md5sum | awk '{print $1}')" = "$(tail -c 16 "$AP" | xxd -p | tr -d '\n')" ]
          sha256sum "$NEWBOOT" "${RESULTS}/v2/boot.img.lz4" "$AP" > "${RESULTS}/v2/SHA256SUMS"
          echo "V2_ODIN_AP_BUILD=PASS"
          cat "${RESULTS}/v2/SHA256SUMS"

      - name: "phase 7b · persist Samsung-native V2 to PRIVATE release"
        if: ${{ success() && inputs.build_mode != 'stock' }}
        env:
          GH_TOKEN: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          PRIVATE_REPO: Sharkecho/note9-01
        run: |
          set -euo pipefail
          TAG="kernel-v2-$(date -u +%Y%m%dT%H%M%SZ)"
          AP="${RESULTS}/v2/NOTE9_UAC2_V2_N960N_ODIN_AP.tar.md5"
          gh release create "$TAG" "$AP#NOTE9_UAC2_V2_N960N_ODIN_AP.tar.md5" "${RESULTS}/v2/SHA256SUMS#SHA256SUMS" --repo "$PRIVATE_REPO" --title "NEW VERIFIED BUILD — Note9 SM-N960N UAC2 V2 Odin AP" --notes "Samsung-native splice-only V2. Stock boot SHA256 pinned; only kernel bytes replaced; non-kernel bytes identical; SEANDROIDENFORCE retained; LZ4 round-trip verified. Build farm run ${GITHUB_RUN_ID}."
          echo "V2_RELEASE_TAG=$TAG"
          echo "V2_PRIVATE_PERSISTENCE=PASS"

      - name: "phase 8 · upload build evidence"
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: note9-01-k1-uac2
          path: evidence/
          retention-days: 7
          if-no-files-found: error
          compression-level: 6

      - name: "phase 8 (failure path) · upload failure evidence"
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: note9-01-k1-uac2-failure
          path: evidence/
          retention-days: 7
          if-no-files-found: warn
          compression-level: 6

      - name: "cleanup · drop the source trees and the source archive from the runner"
        if: ${{ always() }}
        run: |
          set -uo pipefail
          rm -rf "${STOCK_SRC}" "${UAC2_SRC}" "${SOURCE_ARCHIVE}"
          echo "CLEANUP=DONE (stock tree, uac2 tree and the source archive removed)"
          df -h "$GITHUB_WORKSPACE" | tail -n 1 || true

      - name: final markers
        if: ${{ always() }}
        run: |
          set -uo pipefail
          {
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "RUN_URL=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo "RUNNER=${{ inputs.runner }}"
            echo "BUILD_MODE=${{ inputs.build_mode }}"
            echo "UAC2_DEPENDENCIES=$( [ -f "${RESULTS}/uac2-dependencies.txt" ] && echo PASS || echo NOT_RUN )"
            echo "DEVICE_WRITES=0"
            echo "K2_STARTED=NO"
            for pair in "stock:STOCK" "uac2:UAC2"; do
              dir="${pair%%:*}"; tag="${pair##*:}"
              if [ -f "${RESULTS}/${dir}/Image" ]; then
                echo "${tag}_IMAGE_SIZE=$(stat -c '%s' "${RESULTS}/${dir}/Image")"
                echo "${tag}_IMAGE_SHA256=$(sha256sum "${RESULTS}/${dir}/Image" | awk '{print $1}')"
              else
                echo "${tag}_IMAGE_SIZE=absent"
                echo "${tag}_IMAGE_SHA256=absent"
              fi
            done
            if [ -f "${RESULTS}/markers.txt" ]; then
              grep -E '^(UNEXPECTED_CONFIG_DRIFT|IMAGE_SIZE_DELTA|HOST_FIX_SCOPE|HOSTCFLAGS_EFFECTIVE|DTC_BUILD|TARGET_FCOMMON_HITS|TARGET_WHOLEFILE_FCOMMON_HITS|TARGET_CC_LINES|BUILT_CONFIG_F_UAC2|UAC2_CONFIG_VERIFIED|SAMSUNG_OFFICIAL_BUILD_MODE|OFFICIAL_USES_O|IN_TREE_BUILD|BUILD_COMMAND_USES_O|UH_BLOB_SHA256|STATIC_VERIFY)=' "${RESULTS}/markers.txt" || true
            else
              echo "UNEXPECTED_CONFIG_DRIFT=unknown (static verification did not run)"
              echo "STATIC_VERIFY=NOT_REACHED"
            fi
            # Even when the run dies in phase 2 or 5, the log must carry the real failure
            # text, the build semantics that were actually used, and the interpreter that was
            # actually used (run 36970048474 died on a python interpreter mismatch).
            if [ -f "${RESULTS}/python-env.txt" ]; then
              echo "=== build interpreter ==="
              cat "${RESULTS}/python-env.txt"
            else
              echo "PYTHON_IS_PY2=unknown (the prerequisites step did not record the interpreter)"
            fi
            for d in stock uac2; do
              if [ -f "${RESULTS}/${d}/failure-summary.txt" ]; then
                echo "=== ${d} failure summary ==="
                cat "${RESULTS}/${d}/failure-summary.txt"
              fi
              if [ -f "${RESULTS}/${d}/build-semantics.txt" ]; then
                echo "=== ${d} build semantics ==="
                cat "${RESULTS}/${d}/build-semantics.txt"
              fi
            done
            echo "SOURCE_INTEGRITY=$([ -f "${RESULTS}/source-identity.txt" ] && echo PASS || echo UNKNOWN)"
          } | tee -a "${RESULTS}/SUMMARY.txt" || true
          df -h "$GITHUB_WORKSPACE" | tail -n 1 || true

          cp out/uac2/.config "$GITHUB_WORKSPACE/V2.config"
          make O=out/uac2 ARCH=arm64 -j"$(nproc)"
          test -s out/uac2/arch/arm64/boot/Image
          cp out/uac2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.uac2"
          DTBDIR=out/uac2/arch/arm64/boot/dts/exynos
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_eur_open_*.dtb' | sort)
          test "${#DTBS[@]}" -eq 8
          cat "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb.uac2.img"
          test -s "$GITHUB_WORKSPACE/dtb.uac2.img"
          printf '%s\n' "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb-components.txt"
          sha256sum "$GITHUB_WORKSPACE/Image.uac2" "$GITHUB_WORKSPACE/dtb.uac2.img"

      - name: Build proven Exynos9810 DT image
        run: |
          set -euo pipefail
          sudo apt-get install -y libfdt-dev
          curl -fL --retry 5 -o dtbtool.c \
            "https://raw.githubusercontent.com/ananjaser1211/Apollo/30656faf075847e98f0f60a8b4282a25c7e23f80/scripts/dtbtool_exynos/dtbtool.c"
          gcc -O2 dtbtool.c -lfdt -o dtbtool-exynos
          DTBDIR="$GITHUB_WORKSPACE/kernel/out/uac2/arch/arm64/boot/dts/exynos"
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_*.dtb' | sort)
          test "${#DTBS[@]}" -gt 0
          ./dtbtool-exynos --pagesize 2048 --platform 0x50a6 --subtype 0x217584da -o dt.img "${DTBS[@]}"
          test -s dt.img
          test "$(dd if=dt.img bs=4 count=1 status=none)" = "DTBH"
          sha256sum dt.img

      - name: Verify frozen GOLD identity when requested
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$(sha256sum Image.uac2 | awk '{print $1}')"
          DT_SHA="$(sha256sum dt.img | awk '{print $1}')"
          echo "IMAGE_SHA256=$IMAGE_SHA"
          echo "DT_SHA256=$DT_SHA"
          # V2 starts from the proven GOLD V1. If source/toolchain inputs are unchanged,
          # identities must remain exact; otherwise stop rather than publishing a new package.
          test "$IMAGE_SHA" = "3b70691c79625811fe0b53920046fde0cd3b6492d64784273b7e2034fd5021c6"
          test "$DT_SHA" = "c83411e3e994566b21b27fecdf13518103a7d49640fa8a0bd42d4b3e1ddf9a35"

      - name: Build N960N recovery repack package
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o apollo.tar.gz \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"
          tar -xzf apollo.tar.gz
          ROOT="$(find . -maxdepth 1 -type d -name 'exynos9810-kernel-*' | head -1)"
          cp -a "$ROOT/Apollo/kernelzip" installer
          chmod +x installer/floyd/tools/magiskboot || true
          rm -f installer/floyd/*-kernel installer/floyd/*-dtb
          cp Image.uac2 installer/floyd/kernel
          cp dt.img installer/floyd/extra
          cat > installer/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD="/proc/self/fd/$2"
          ZIP="$3"
          ui_print(){ echo -e "ui_print $1\nui_print" > "$OUTFD"; }
          CMD="$(cat /proc/cmdline 2>/dev/null)"
          echo "$CMD" | grep -q 'N960N' || { ui_print "! SM-N960N required"; exit 1; }
          rm -rf /tmp/n9uac2 /tmp/n9uac2-work
          mkdir -p /tmp/n9uac2 /tmp/n9uac2-work
          cd /tmp/n9uac2
          unzip -o "$ZIP" >/dev/null || exit 1
          chmod 755 floyd/tools/*
          BB=floyd/tools/busybox
          BOOT="$($BB find /dev/block/platform -iname boot | head -1)"
          [ -n "$BOOT" ] || { ui_print "! boot partition not found"; exit 1; }
          dd if="$BOOT" of=/tmp/n9uac2-work/original-boot.img bs=4096 || exit 1
          cd /tmp/n9uac2-work
          cp /tmp/n9uac2/floyd/tools/magiskboot ./magiskboot
          chmod 755 magiskboot
          ./magiskboot unpack original-boot.img || exit 1
          [ -f kernel ] && [ -f extra ] || exit 1
          cp /tmp/n9uac2/floyd/kernel kernel
          cp /tmp/n9uac2/floyd/extra extra
          ./magiskboot repack -n original-boot.img || exit 1
          [ -s new-boot.img ] || exit 1
          ui_print "- Repack verified; no automatic boot write"
          ui_print "- new boot: /tmp/n9uac2-work/new-boot.img"
          sync
          EOF
          chmod 755 installer/META-INF/com/google/android/update-binary
          {
            echo "DEVICE=SM-N960N"
            echo "ROM=LineageOS 20"
            echo "KERNEL_COMMIT=$KERNEL_COMMIT"
            echo "KERNEL_SHA256=$(sha256sum Image.uac2 | awk '{print $1}')"
            echo "DT_SHA256=$(sha256sum dt.img | awk '{print $1}')"
            echo "MODE=RECOVERY_REPACK_NO_AUTOWRITE"
          } > installer/BUILD-IDENTITY.txt
          (cd installer && zip -r9 ../Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip .)
          unzip -t Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip
          sha256sum Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip > Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip.sha256

      - name: Upload unified V2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: note9-linuxos-kernel-v2
          path: |
            Image.baseline
            Image.uac2
            dt.img
            Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip
            Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip.sha256
            diagnostic-errors.txt
            diagnostic-summary.txt
          retention-days: 30

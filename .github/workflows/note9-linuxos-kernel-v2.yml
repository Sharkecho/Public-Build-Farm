name: Note9 LinuxOS Kernel V2 — Build + Package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_exynos9810
  KERNEL_COMMIT: 6a9461f9460ca51d1217e5069a5d5556fcc79e63
  DEFCONFIG: exynos9810-crownlte_defconfig
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r416183/clang-r416183.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Install mature build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev             python3 rsync unzip zip zstd curl cpio

      - name: Checkout exact running-kernel source
        run: |
          git clone --filter=blob:none "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach "$KERNEL_COMMIT"
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"

      - name: Install pinned AOSP Clang
        run: |
          mkdir -p "$GITHUB_WORKSPACE/compiler/clang-r416183"
          curl -fL --retry 4 "$CLANG_URL" | tar -xz -C "$GITHUB_WORKSPACE/compiler/clang-r416183"
          "$GITHUB_WORKSPACE/compiler/clang-r416183/bin/clang" --version

      - name: Import Apollo GCC 4.9 companion toolchain
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/apollo.tar.gz"
          SRC="$RUNNER_TEMP/apollo-src"
          curl -fL --retry 5 --retry-all-errors --connect-timeout 20 \
            -o "$ARCHIVE" \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"
          mkdir -p "$SRC"
          tar -xzf "$ARCHIVE" -C "$SRC"
          ROOT="$(find "$SRC" -mindepth 1 -maxdepth 1 -type d | head -1)"
          TOOLCHAIN="$ROOT/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          test -d "$TOOLCHAIN/bin"
          mkdir -p "$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp"
          cp -a "$TOOLCHAIN" "$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/"
          DEST="$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          # GitHub branch archives do not reliably preserve executable mode for every
          # nested prebuilt. Restore it for compiler wrappers and real executables.
          find "$DEST/bin" -type f -exec chmod +x {} +
          if [ -d "$DEST/libexec" ]; then
            find "$DEST/libexec" -type f -exec chmod +x {} +
          fi
          # GitHub tar archives can materialize the GCC plugin symlink without
          # the unversioned name expected by -fuse-linker-plugin. Recreate the
          # canonical link from the shipped versioned plugin.
          LTO_DIR="$DEST/libexec/gcc/aarch64-linux-android/4.9.x"
          test -s "$LTO_DIR/liblto_plugin.so.0.0.0"
          ln -sfn liblto_plugin.so.0.0.0 "$LTO_DIR/liblto_plugin.so.0"
          ln -sfn liblto_plugin.so.0 "$LTO_DIR/liblto_plugin.so"
          chmod +x "$LTO_DIR"/cc1 "$LTO_DIR"/cc1plus "$LTO_DIR"/collect2 "$LTO_DIR"/lto-wrapper "$LTO_DIR"/lto1
          GCC="$DEST/bin/aarch64-linux-android-gcc"
          test -x "$GCC"
          test -e "$LTO_DIR/liblto_plugin.so"
          "$GCC" --version
          "$GCC" -print-file-name=liblto_plugin.so

      - name: Apply proven Apollo legacy DPU compatibility patch
        working-directory: kernel
        run: |
          set -euo pipefail
          FILE="drivers/video/fbdev/exynos/dpu_9810/decon_reg.c"
          grep -q 'const double decon_clocks_table' "$FILE"
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/video/fbdev/exynos/dpu_9810/decon_reg.c")
          s=p.read_text()
          s=s.replace("const double decon_clocks_table[][CLK_ID_MAX] = {",
                      "const unsigned long decon_clocks_table[][CLK_ID_MAX] = {")
          s=s.replace("{41.7, 137.5, 400, 66, 62.5, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},",
                      "{41, 137, 400, 66, 62, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},")
          s=s.replace("{ 141, 137.5, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},",
                      "{ 141, 137, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},")
          p.write_text(s)
          PY
          grep -q 'const unsigned long decon_clocks_table' "$FILE"
          ! grep -qE '41\.7|137\.5|62\.5' "$FILE"
          git diff --check
          git diff -- "$FILE"

      - name: Diagnostic compile — collect legacy failures
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          ANDROID_MAJOR_VERSION: q
          PLATFORM_VERSION: 13.0.0
        run: |
          set -uo pipefail
          TC="$GITHUB_WORKSPACE/compiler/clang-r416183"
          export PATH="$TC/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
          export LLVM=1
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=format -Wno-error=enum-compare"
          rm -rf out/diagnostic
          mkdir -p out/diagnostic
          make O=out/diagnostic ARCH=arm64 "$DEFCONFIG"
          set +e
          make -k O=out/diagnostic ARCH=arm64 -j"$(nproc)" 2>&1 | tee "$GITHUB_WORKSPACE/diagnostic-build.log"
          RC=${PIPESTATUS[0]}
          set -e
          grep -E 'error:|fatal error:|undefined reference|Error [0-9]+' "$GITHUB_WORKSPACE/diagnostic-build.log" | sort -u > "$GITHUB_WORKSPACE/diagnostic-errors.txt" || true
          echo "DIAGNOSTIC_MAKE_RC=$RC" | tee "$GITHUB_WORKSPACE/diagnostic-summary.txt"
          echo "DIAGNOSTIC_ERROR_COUNT=$(wc -l < "$GITHUB_WORKSPACE/diagnostic-errors.txt")" | tee -a "$GITHUB_WORKSPACE/diagnostic-summary.txt"
          cat "$GITHUB_WORKSPACE/diagnostic-errors.txt" || true
          # Diagnostic failure is evidence, not a job failure. Formal build below remains the gate.
          exit 0

      - name: Build crownlte baseline using mature out-of-tree pattern
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          ANDROID_MAJOR_VERSION: q
          PLATFORM_VERSION: 13.0.0
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/compiler/clang-r416183"
          export PATH="$TC/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
          export LLVM=1
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=format -Wno-error=enum-compare"
          mkdir -p out/baseline
          make O=out/baseline ARCH=arm64 "$DEFCONFIG"
          make O=out/baseline ARCH=arm64 -j"$(nproc)"
          test -s out/baseline/arch/arm64/boot/Image
          cp out/baseline/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.baseline"
          sha256sum "$GITHUB_WORKSPACE/Image.baseline"

      - name: Build UAC2 variant from same verified source
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          ANDROID_MAJOR_VERSION: q
          PLATFORM_VERSION: 13.0.0
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/compiler/clang-r416183"
          export PATH="$TC/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip
          export LLVM=1
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=format -Wno-error=enum-compare"
          mkdir -p out/uac2
          make O=out/uac2 ARCH=arm64 "$DEFCONFIG"
          scripts/config --file out/uac2/.config -e USB_CONFIGFS_F_UAC2
          scripts/config --file out/uac2/.config -d USB_G_ANDROID
          scripts/config --file out/uac2/.config -d USB_ANDROID_SAMSUNG_COMPOSITE
          make O=out/uac2 ARCH=arm64 olddefconfig
          grep '^CONFIG_USB_CONFIGFS_F_UAC2=y
          make O=out/uac2 ARCH=arm64 -j"$(nproc)"
          test -s out/uac2/arch/arm64/boot/Image
          cp out/uac2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.uac2"
          DTBDIR=out/uac2/arch/arm64/boot/dts/exynos
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_eur_open_*.dtb' | sort)
          test "${#DTBS[@]}" -eq 8
          cat "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb.uac2.img"
          test -s "$GITHUB_WORKSPACE/dtb.uac2.img"
          printf '%s\n' "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb-components.txt"
          sha256sum "$GITHUB_WORKSPACE/Image.uac2" "$GITHUB_WORKSPACE/dtb.uac2.img"

      - name: Build proven Exynos9810 DT image
        run: |
          set -euo pipefail
          sudo apt-get install -y libfdt-dev
          curl -fL --retry 5 -o dtbtool.c \
            "https://raw.githubusercontent.com/ananjaser1211/Apollo/30656faf075847e98f0f60a8b4282a25c7e23f80/scripts/dtbtool_exynos/dtbtool.c"
          gcc -O2 dtbtool.c -lfdt -o dtbtool-exynos
          DTBDIR="$GITHUB_WORKSPACE/kernel/out/uac2/arch/arm64/boot/dts/exynos"
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_*.dtb' | sort)
          test "${#DTBS[@]}" -gt 0
          ./dtbtool-exynos --pagesize 2048 --platform 0x50a6 --subtype 0x217584da -o dt.img "${DTBS[@]}"
          test -s dt.img
          test "$(dd if=dt.img bs=4 count=1 status=none)" = "DTBH"
          sha256sum dt.img

      - name: Verify V2 protected USB capabilities
        run: |
          set -euo pipefail
          IMAGE_SHA="$(sha256sum Image.uac2 | awk '{print $1}')"
          DT_SHA="$(sha256sum dt.img | awk '{print $1}')"
          echo "V2_IMAGE_SHA256=$IMAGE_SHA"
          echo "V2_DT_SHA256=$DT_SHA"
          test "$IMAGE_SHA" != "3b70691c79625811fe0b53920046fde0cd3b6492d64784273b7e2034fd5021c6"
          grep '^CONFIG_USB_CONFIGFS_F_UAC2=y
      - name: Build N960N recovery repack package
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o apollo.tar.gz \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"
          tar -xzf apollo.tar.gz
          ROOT="$(find . -maxdepth 1 -type d -name 'exynos9810-kernel-*' | head -1)"
          cp -a "$ROOT/Apollo/kernelzip" installer
          chmod +x installer/floyd/tools/magiskboot || true
          rm -f installer/floyd/*-kernel installer/floyd/*-dtb
          cp Image.uac2 installer/floyd/kernel
          cp dt.img installer/floyd/extra
          cat > installer/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD="/proc/self/fd/$2"
          ZIP="$3"
          ui_print(){ echo -e "ui_print $1\nui_print" > "$OUTFD"; }
          CMD="$(cat /proc/cmdline 2>/dev/null)"
          echo "$CMD" | grep -q 'N960N' || { ui_print "! SM-N960N required"; exit 1; }
          rm -rf /tmp/n9uac2 /tmp/n9uac2-work
          mkdir -p /tmp/n9uac2 /tmp/n9uac2-work
          cd /tmp/n9uac2
          unzip -o "$ZIP" >/dev/null || exit 1
          chmod 755 floyd/tools/*
          BB=floyd/tools/busybox
          BOOT="$($BB find /dev/block/platform -iname boot | head -1)"
          [ -n "$BOOT" ] || { ui_print "! boot partition not found"; exit 1; }
          dd if="$BOOT" of=/tmp/n9uac2-work/original-boot.img bs=4096 || exit 1
          cd /tmp/n9uac2-work
          cp /tmp/n9uac2/floyd/tools/magiskboot ./magiskboot
          chmod 755 magiskboot
          ./magiskboot unpack original-boot.img || exit 1
          [ -f kernel ] && [ -f extra ] || exit 1
          cp /tmp/n9uac2/floyd/kernel kernel
          cp /tmp/n9uac2/floyd/extra extra
          ./magiskboot repack -n original-boot.img || exit 1
          [ -s new-boot.img ] || exit 1
          ui_print "- Repack verified; no automatic boot write"
          ui_print "- new boot: /tmp/n9uac2-work/new-boot.img"
          sync
          EOF
          chmod 755 installer/META-INF/com/google/android/update-binary
          {
            echo "DEVICE=SM-N960N"
            echo "ROM=LineageOS 20"
            echo "KERNEL_COMMIT=$KERNEL_COMMIT"
            echo "KERNEL_SHA256=$(sha256sum Image.uac2 | awk '{print $1}')"
            echo "DT_SHA256=$(sha256sum dt.img | awk '{print $1}')"
            echo "V2_DISABLE=CONFIG_USB_G_ANDROID,CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE"
            echo "MODE=RECOVERY_REPACK_NO_AUTOWRITE"
            echo "STATUS=V2_TEST_NOT_DEVICE_VALIDATED"
          } > installer/BUILD-IDENTITY.txt
          (cd installer && zip -r9 ../Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip .)
          unzip -t Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip
          sha256sum Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip > Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip.sha256

      - name: Upload unified V2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: note9-linuxos-kernel-v2
          path: |
            Image.baseline
            Image.uac2
            dt.img
            Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip
            Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip.sha256
            diagnostic-errors.txt
            diagnostic-summary.txt
            V2.config
          retention-days: 30
 out/uac2/.config
          grep '^# CONFIG_USB_G_ANDROID is not set
          make O=out/uac2 ARCH=arm64 -j"$(nproc)"
          test -s out/uac2/arch/arm64/boot/Image
          cp out/uac2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.uac2"
          DTBDIR=out/uac2/arch/arm64/boot/dts/exynos
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_eur_open_*.dtb' | sort)
          test "${#DTBS[@]}" -eq 8
          cat "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb.uac2.img"
          test -s "$GITHUB_WORKSPACE/dtb.uac2.img"
          printf '%s\n' "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb-components.txt"
          sha256sum "$GITHUB_WORKSPACE/Image.uac2" "$GITHUB_WORKSPACE/dtb.uac2.img"

      - name: Build proven Exynos9810 DT image
        run: |
          set -euo pipefail
          sudo apt-get install -y libfdt-dev
          curl -fL --retry 5 -o dtbtool.c \
            "https://raw.githubusercontent.com/ananjaser1211/Apollo/30656faf075847e98f0f60a8b4282a25c7e23f80/scripts/dtbtool_exynos/dtbtool.c"
          gcc -O2 dtbtool.c -lfdt -o dtbtool-exynos
          DTBDIR="$GITHUB_WORKSPACE/kernel/out/uac2/arch/arm64/boot/dts/exynos"
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_*.dtb' | sort)
          test "${#DTBS[@]}" -gt 0
          ./dtbtool-exynos --pagesize 2048 --platform 0x50a6 --subtype 0x217584da -o dt.img "${DTBS[@]}"
          test -s dt.img
          test "$(dd if=dt.img bs=4 count=1 status=none)" = "DTBH"
          sha256sum dt.img

      - name: Verify frozen GOLD identity when requested
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$(sha256sum Image.uac2 | awk '{print $1}')"
          DT_SHA="$(sha256sum dt.img | awk '{print $1}')"
          echo "IMAGE_SHA256=$IMAGE_SHA"
          echo "DT_SHA256=$DT_SHA"
          # V2 starts from the proven GOLD V1. If source/toolchain inputs are unchanged,
          # identities must remain exact; otherwise stop rather than publishing a new package.
          test "$IMAGE_SHA" = "3b70691c79625811fe0b53920046fde0cd3b6492d64784273b7e2034fd5021c6"
          test "$DT_SHA" = "c83411e3e994566b21b27fecdf13518103a7d49640fa8a0bd42d4b3e1ddf9a35"

      - name: Build N960N recovery repack package
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o apollo.tar.gz \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"
          tar -xzf apollo.tar.gz
          ROOT="$(find . -maxdepth 1 -type d -name 'exynos9810-kernel-*' | head -1)"
          cp -a "$ROOT/Apollo/kernelzip" installer
          chmod +x installer/floyd/tools/magiskboot || true
          rm -f installer/floyd/*-kernel installer/floyd/*-dtb
          cp Image.uac2 installer/floyd/kernel
          cp dt.img installer/floyd/extra
          cat > installer/META-INF/com/google/android/update-binary <<'EOF'
          #!/sbin/sh
          OUTFD="/proc/self/fd/$2"
          ZIP="$3"
          ui_print(){ echo -e "ui_print $1\nui_print" > "$OUTFD"; }
          CMD="$(cat /proc/cmdline 2>/dev/null)"
          echo "$CMD" | grep -q 'N960N' || { ui_print "! SM-N960N required"; exit 1; }
          rm -rf /tmp/n9uac2 /tmp/n9uac2-work
          mkdir -p /tmp/n9uac2 /tmp/n9uac2-work
          cd /tmp/n9uac2
          unzip -o "$ZIP" >/dev/null || exit 1
          chmod 755 floyd/tools/*
          BB=floyd/tools/busybox
          BOOT="$($BB find /dev/block/platform -iname boot | head -1)"
          [ -n "$BOOT" ] || { ui_print "! boot partition not found"; exit 1; }
          dd if="$BOOT" of=/tmp/n9uac2-work/original-boot.img bs=4096 || exit 1
          cd /tmp/n9uac2-work
          cp /tmp/n9uac2/floyd/tools/magiskboot ./magiskboot
          chmod 755 magiskboot
          ./magiskboot unpack original-boot.img || exit 1
          [ -f kernel ] && [ -f extra ] || exit 1
          cp /tmp/n9uac2/floyd/kernel kernel
          cp /tmp/n9uac2/floyd/extra extra
          ./magiskboot repack -n original-boot.img || exit 1
          [ -s new-boot.img ] || exit 1
          ui_print "- Repack verified; no automatic boot write"
          ui_print "- new boot: /tmp/n9uac2-work/new-boot.img"
          sync
          EOF
          chmod 755 installer/META-INF/com/google/android/update-binary
          {
            echo "DEVICE=SM-N960N"
            echo "ROM=LineageOS 20"
            echo "KERNEL_COMMIT=$KERNEL_COMMIT"
            echo "KERNEL_SHA256=$(sha256sum Image.uac2 | awk '{print $1}')"
            echo "DT_SHA256=$(sha256sum dt.img | awk '{print $1}')"
            echo "MODE=RECOVERY_REPACK_NO_AUTOWRITE"
          } > installer/BUILD-IDENTITY.txt
          (cd installer && zip -r9 ../Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip .)
          unzip -t Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip
          sha256sum Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip > Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip.sha256

      - name: Upload unified V2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: note9-linuxos-kernel-v2
          path: |
            Image.baseline
            Image.uac2
            dt.img
            Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip
            Note9-LinuxOS-Kernel-UAC2-V2-TEST-Recovery.zip.sha256
            diagnostic-errors.txt
            diagnostic-summary.txt
          retention-days: 30
 out/uac2/.config
          grep '^# CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE is not set
          make O=out/uac2 ARCH=arm64 -j"$(nproc)"
          test -s out/uac2/arch/arm64/boot/Image
          cp out/uac2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.uac2"
          DTBDIR=out/uac2/arch/arm64/boot/dts/exynos
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_eur_open_*.dtb' | sort)
          test "${#DTBS[@]}" -eq 8
          cat "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb.uac2.img"
          test -s "$GITHUB_WORKSPACE/dtb.uac2.img"
          printf '%s\n' "${DTBS[@]}" > "$GITHUB_WORKSPACE/dtb-components.txt"
          sha256sum "$GITHUB_WORKSPACE/Image.uac2" "$GITHUB_WORKSPACE/dtb.uac2.img"

      - name: Build proven Exynos9810 DT image
        run: |
          set -euo pipefail
          sudo apt-get install -y libfdt-dev
          curl -fL --retry 5 -o dtbtool.c \
            "https://raw.githubusercontent.com/ananjaser1211/Apollo/30656faf075847e98f0f60a8b4282a25c7e23f80/scripts/dtbtool_exynos/dtbtool.c"
          gcc -O2 dtbtool.c -lfdt -o dtbtool-exynos
          DTBDIR="$GITHUB_WORKSPACE/kernel/out/uac2/arch/arm64/boot/dts/exynos"
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_*.dtb' | sort)
          test "${#DTBS[@]}" -gt 0
          ./dtbtool-exynos --pagesize 2048 --platform 0x50a6 --subtype 0x217584da -o dt.img "${DTBS[@]}"
          test -s dt.img
          test "$(dd if=dt.img bs=4 count=1 status=none)" = "DTBH"
          sha256sum dt.img

      - name: Verify frozen GOLD identity when requested
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          IMAGE_SHA="$(sha256sum Image.uac2 | awk '{print $1}')"
          DT_SHA="$(sha256sum dt.img | awk '{print $1}')"
          echo "IMAGE_SHA256=$IMAGE_SHA"
          echo "DT_SHA256=$DT_SHA"
          # V2 starts from the proven GOLD V1. If source/toolchain inputs are unchanged,
          # identities must remain exact; otherwise stop rather than publishing a new package.
          test "$IMAGE_SHA" = "3b70691c79625811fe0b53920046fde0cd3b6492d64784273b7e2034fd5021c6"
          test "$DT_SHA" = "c83411e3e994566b21b27fecdf13518103a7d49640fa8a0bd42d4b3e1ddf9a35"

      - name: Build N960N recovery repack package
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o apollo.tar.gz \
            "https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz"

name: Note9 LineageOS20 Kernel V2 — Build + ONE-SHOT

on:
  workflow_dispatch:
    inputs:
      resume_from:
        description: "Resume checkpoint"
        required: true
        default: "auto"
        type: choice
        options:
          - auto
          - config
          - build
          - package
          - full

permissions:
  contents: read

env:
  KERNEL_REPO: https://github.com/LineageOS/android_kernel_samsung_exynos9810
  KERNEL_COMMIT: 6a9461f9460ca51d1217e5069a5d5556fcc79e63
  DEFCONFIG: exynos9810-crownlte_defconfig
  CLANG_URL: https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/llvm-r416183/clang-r416183.tar.gz
  APOLLO_URL: https://github.com/Redminote11tech/exynos9810-kernel/archive/refs/heads/duhan-%284.9.337%29.tar.gz

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Resolve resume checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED: ${{ inputs.resume_from }}
        run: |
          set -euo pipefail
          mkdir -p resume
          if [ "$REQUESTED" = full ]; then echo "RESUME=full" >> "$GITHUB_ENV"; exit 0; fi
          RESUME=full
          gh run list --repo "$GITHUB_REPOSITORY" --workflow note9-linuxos-kernel-v2.yml --status success --limit 20 --json databaseId -q '.[].databaseId' > resume/runs.txt || true
          while read -r RUN; do
            [ -n "$RUN" ] || continue
            rm -rf resume/probe && mkdir -p resume/probe
            if gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name note9-lineageos20-kernel-v2-oneshot --dir resume/probe >/dev/null 2>&1; then
              test -s resume/probe/Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip || continue
              unzip -t resume/probe/Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip >/dev/null || continue
              cp -a resume/probe/. .
              RESUME=package
              echo "CHECKPOINT_RUN=$RUN" >> "$GITHUB_ENV"
              break
            fi
            rm -rf resume/probe && mkdir -p resume/probe
            if gh run download "$RUN" --repo "$GITHUB_REPOSITORY" --name note9-v2-build-checkpoint --dir resume/probe >/dev/null 2>&1; then
              test -s resume/probe/Image.uac2 && test -s resume/probe/dt.img || continue
              test "$(dd if=resume/probe/dt.img bs=4 count=1 status=none)" = "DTBH" || continue
              cp -a resume/probe/. .
              RESUME=build
              echo "CHECKPOINT_RUN=$RUN" >> "$GITHUB_ENV"
              break
            fi
          done < resume/runs.txt
          [ "$REQUESTED" = auto ] || RESUME="$REQUESTED"
          echo "RESUME=$RESUME" >> "$GITHUB_ENV"
          echo "RESUME_SELECTED=$RESUME"

      - name: Dependencies and frozen sources
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y bc bison build-essential flex git libssl-dev libelf-dev python3 rsync unzip zip zstd curl cpio libfdt-dev
          git clone --filter=blob:none "$KERNEL_REPO" kernel
          cd kernel
          git fetch --depth=1 origin "$KERNEL_COMMIT"
          git checkout --detach "$KERNEL_COMMIT"
          test "$(git rev-parse HEAD)" = "$KERNEL_COMMIT"
          cd ..
          mkdir -p compiler/clang-r416183
          curl -fL --retry 4 "$CLANG_URL" | tar -xz -C compiler/clang-r416183
          curl -fL --retry 5 -o apollo.tar.gz "$APOLLO_URL"
          mkdir apollo && tar -xzf apollo.tar.gz -C apollo
          ROOT="$(find apollo -mindepth 1 -maxdepth 1 -type d | head -1)"
          TC="$ROOT/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          test -d "$TC/bin"
          mkdir -p kernel/toolchain/gcc-cfp/gcc-ibv-jopp
          cp -a "$TC" kernel/toolchain/gcc-cfp/gcc-ibv-jopp/
          DEST="$GITHUB_WORKSPACE/kernel/toolchain/gcc-cfp/gcc-ibv-jopp/aarch64-linux-android-4.9"
          find "$DEST/bin" -type f -exec chmod +x {} +
          find "$DEST/libexec" -type f -exec chmod +x {} + || true
          LTO="$DEST/libexec/gcc/aarch64-linux-android/4.9.x"
          test -s "$LTO/liblto_plugin.so.0.0.0"
          ln -sfn liblto_plugin.so.0.0.0 "$LTO/liblto_plugin.so.0"
          ln -sfn liblto_plugin.so.0 "$LTO/liblto_plugin.so"

      - name: Apply frozen DPU compatibility patch
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("drivers/video/fbdev/exynos/dpu_9810/decon_reg.c")
          s=p.read_text()
          s=s.replace("const double decon_clocks_table[][CLK_ID_MAX] = {","const unsigned long decon_clocks_table[][CLK_ID_MAX] = {")
          s=s.replace("{41.7, 137.5, 400, 66, 62.5, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},","{41, 137, 400, 66, 62, 1440 * 2560, MIC_COMP_RATIO_1_3,  0},")
          s=s.replace("{ 141, 137.5, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},","{ 141, 137, 400, 66,  141, 1440 * 2560,    MIC_COMP_BYPASS,  0},")
          p.write_text(s)
          PY
          grep -q 'const unsigned long decon_clocks_table' drivers/video/fbdev/exynos/dpu_9810/decon_reg.c
          git diff --check

      - name: Restore authoritative V1 config checkpoint
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p audit
          gh run download 37322657420 --repo "$GITHUB_REPOSITORY" --name note9-v2-preflight-config-audit --dir audit
          V1="$(find audit -type f -name V1.config | head -1)"
          test -s "$V1"
          cp "$V1" V1.config
          sha256sum V1.config | tee V1.config.sha256

      - name: Derive V2 config and audit USB capabilities
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        working-directory: kernel
        run: |
          set -euo pipefail
          mkdir -p out/v2
          cp "$GITHUB_WORKSPACE/V1.config" out/v2/.config
          scripts/config --file out/v2/.config -d USB_G_ANDROID
          scripts/config --file out/v2/.config -d USB_ANDROID_SAMSUNG_COMPOSITE
          make O=out/v2 ARCH=arm64 olddefconfig
          cp out/v2/.config "$GITHUB_WORKSPACE/V2.config"

          KEYS="USB_CONFIGFS USB_CONFIGFS_F_UAC2 USB_F_UAC2 USB_CONFIGFS_F_FS USB_F_FS USB_CONFIGFS_NCM USB_CONFIGFS_RNDIS USB_F_NCM USB_F_RNDIS USB_XHCI_HCD USB_XHCI_PLATFORM USB_DWC3_DUAL_ROLE USB_RTL8152 USB_G_ANDROID USB_ANDROID_SAMSUNG_COMPOSITE"
          : > "$GITHUB_WORKSPACE/USB-CAPABILITY-AUDIT.txt"
          for x in $KEYS; do
            V1="$(grep -E "^CONFIG_${x}=|^# CONFIG_${x} is not set$" "$GITHUB_WORKSPACE/V1.config" | head -1 || true)"
            V2="$(grep -E "^CONFIG_${x}=|^# CONFIG_${x} is not set$" out/v2/.config | head -1 || true)"
            printf '%-42s | V1: %-48s | V2: %s\n' "CONFIG_${x}" "${V1:-ABSENT}" "${V2:-ABSENT}" | tee -a "$GITHUB_WORKSPACE/USB-CAPABILITY-AUDIT.txt"
          done
          diff -u "$GITHUB_WORKSPACE/V1.config" out/v2/.config > "$GITHUB_WORKSPACE/V1-to-V2.config.diff" || true

          python3 - <<'PY'
          from pathlib import Path
          def read(p):
              d={}
              for line in Path(p).read_text().splitlines():
                  if line.startswith("CONFIG_") and "=" in line:
                      k,v=line.split("=",1); d[k]=v
                  elif line.startswith("# CONFIG_") and line.endswith(" is not set"):
                      d[line.split()[1]]="n"
              return d
          v1=read("../V1.config")
          v2=read("out/v2/.config")
          protected=[
              "CONFIG_USB_CONFIGFS","CONFIG_USB_CONFIGFS_F_UAC2","CONFIG_USB_F_UAC2",
              "CONFIG_USB_CONFIGFS_F_FS","CONFIG_USB_F_FS","CONFIG_USB_CONFIGFS_NCM",
              "CONFIG_USB_CONFIGFS_RNDIS","CONFIG_USB_F_NCM","CONFIG_USB_F_RNDIS",
              "CONFIG_USB_XHCI_HCD","CONFIG_USB_XHCI_PLATFORM","CONFIG_USB_DWC3_DUAL_ROLE",
              "CONFIG_USB_RTL8152"
          ]
          bad=[]
          for k in protected:
              # Preserve the already device-validated V1 value exactly; do not invent =y.
              if v1.get(k) is None:
                  bad.append(f"{k}: absent in authoritative V1")
              elif v2.get(k) != v1.get(k):
                  bad.append(f"{k}: V1={v1.get(k)} V2={v2.get(k)}")
          for k in ("CONFIG_USB_G_ANDROID","CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE"):
              if v2.get(k)!="n":
                  bad.append(f"{k}: expected n, got {v2.get(k)}")
          if bad:
              print("V2_USB_GATE=FAIL")
              print("\n".join(bad))
              raise SystemExit(1)
          print("V2_USB_GATE=PASS")
          PY

      - name: Save config checkpoint even on gate failure
        if: ${{ always() && (env.RESUME == 'full' || env.RESUME == 'config') }}
        uses: actions/upload-artifact@v4
        with:
          name: note9-v2-config-checkpoint
          path: |
            V1.config
            V1.config.sha256
            V2.config
            USB-CAPABILITY-AUDIT.txt
            V1-to-V2.config.diff
          retention-days: 30
          if-no-files-found: warn

      - name: Build V2 kernel
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        working-directory: kernel
        env:
          ARCH: arm64
          SUBARCH: arm64
          ANDROID_MAJOR_VERSION: q
          PLATFORM_VERSION: 13.0.0
        run: |
          set -euo pipefail
          TC="$GITHUB_WORKSPACE/compiler/clang-r416183"
          export PATH="$TC/bin:$PATH"
          export CC=clang LD=ld.lld AR=llvm-ar NM=llvm-nm
          export OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump READELF=llvm-readelf STRIP=llvm-strip LLVM=1
          export KCFLAGS="-Wno-error=unused-variable -Wno-error=strict-prototypes -Wno-error=return-type -Wno-error=format -Wno-error=enum-compare"
          make O=out/v2 ARCH=arm64 -j"$(nproc)"
          test -s out/v2/arch/arm64/boot/Image
          test -s out/v2/drivers/usb/gadget/function/f_uac2.o
          test -s out/v2/drivers/usb/gadget/function/usb_f_uac2.o
          cp out/v2/arch/arm64/boot/Image "$GITHUB_WORKSPACE/Image.uac2"

      - name: Build frozen Exynos9810 DTBH
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        run: |
          set -euo pipefail
          curl -fL --retry 5 -o dtbtool.c "https://raw.githubusercontent.com/ananjaser1211/Apollo/30656faf075847e98f0f60a8b4282a25c7e23f80/scripts/dtbtool_exynos/dtbtool.c"
          gcc -O2 dtbtool.c -lfdt -o dtbtool-exynos
          DTBDIR="$GITHUB_WORKSPACE/kernel/out/v2/arch/arm64/boot/dts/exynos"
          mapfile -t DTBS < <(find "$DTBDIR" -maxdepth 1 -type f -name 'exynos9810-crownlte_*.dtb' | sort)
          test "${#DTBS[@]}" -gt 0
          ./dtbtool-exynos --pagesize 2048 --platform 0x50a6 --subtype 0x217584da -o dt.img "${DTBS[@]}"
          test -s dt.img
          test "$(dd if=dt.img bs=4 count=1 status=none)" = "DTBH"

      - name: Save build checkpoint
        if: ${{ env.RESUME == 'full' || env.RESUME == 'config' }}
        uses: actions/upload-artifact@v4
        with:
          name: note9-v2-build-checkpoint
          path: |
            Image.uac2
            dt.img
            V2.config
          retention-days: 30

      - name: Materialize audited ONE-SHOT installer
        if: ${{ env.RESUME != 'package' }}
        run: |
          cat > pipeline-v2-install.sh <<'ONE_SHOT_EOF'
          #!/sbin/sh
          # Note9 SM-N960N V2 ONE-SHOT Boot Installer
          # Recovery-only. Fail closed before the single boot write.
          set -u
          
          OUTFD="/proc/self/fd/${2:-1}"
          ZIP="${3:-}"
          WORK=/tmp/n9-v2-oneshot
          PAYLOAD=/tmp/n9-v2-payload
          ui_print(){ echo -e "ui_print $1\nui_print" > "$OUTFD"; }
          die(){ ui_print "! $1"; exit 1; }
          
          [ -n "$ZIP" ] || die "installer zip missing"
          rm -rf "$WORK" "$PAYLOAD"
          mkdir -p "$WORK" "$PAYLOAD" || die "workspace create failed"
          cd "$PAYLOAD" || die "payload workspace unavailable"
          unzip -o "$ZIP" >/dev/null || die "zip extraction failed"
          
          BB=floyd/tools/busybox
          MB=floyd/tools/magiskboot
          [ -x "$BB" ] || chmod 755 "$BB" || die "busybox unavailable"
          [ -x "$MB" ] || chmod 755 "$MB" || die "magiskboot unavailable"
          [ -s floyd/kernel ] || die "V2 kernel missing"
          [ -s floyd/extra ] || die "V2 DT image missing"
          [ -s BUILD-IDENTITY.txt ] || die "build identity missing"
          
          # Device gate: accept either recovery cmdline identity or Android property when available.
          CMD="$(cat /proc/cmdline 2>/dev/null || true)"
          MODEL="$(getprop ro.product.model 2>/dev/null || true)"
          echo "$CMD $MODEL" | grep -q 'N960N' || die "SM-N960N required"
          
          BOOT="$($BB find /dev/block/platform -type l -iname boot 2>/dev/null | head -1)"
          [ -n "$BOOT" ] || BOOT="$($BB find /dev/block -type l -iname boot 2>/dev/null | head -1)"
          [ -n "$BOOT" ] || die "boot partition not found"
          
          ui_print "- N960N V2 ONE-SHOT preflight PASS"
          cd "$WORK" || die "workdir unavailable"
          
          # Persistent rollback copy first. /sdcard survives reboot; /tmp does not.
          ROLLBACK_DIR=/sdcard/Note9-V1-GOLD-Rollback
          mkdir -p "$ROLLBACK_DIR" || die "rollback directory unavailable"
          dd if="$BOOT" of="$ROLLBACK_DIR/boot-before-v2.img" bs=4096 || die "rollback backup failed"
          sha256sum "$ROLLBACK_DIR/boot-before-v2.img" > "$ROLLBACK_DIR/boot-before-v2.img.sha256" || die "rollback hash failed"
          cp "$ROLLBACK_DIR/boot-before-v2.img" original-boot.img || die "working boot copy failed"
          
          cp "$PAYLOAD/$MB" ./magiskboot || die "magiskboot copy failed"
          chmod 755 magiskboot
          ./magiskboot unpack original-boot.img >/dev/null || die "boot unpack failed"
          [ -s kernel ] || die "original kernel missing after unpack"
          [ -s extra ] || die "original DT missing after unpack"
          
          cp "$PAYLOAD/floyd/kernel" kernel || die "kernel inject failed"
          cp "$PAYLOAD/floyd/extra" extra || die "DT inject failed"
          ./magiskboot repack -n original-boot.img >/dev/null || die "boot repack failed"
          [ -s new-boot.img ] || die "new boot missing"
          
          # Verify the repacked image can be parsed before touching the partition.
          mkdir verify && cd verify || die "verify workspace failed"
          cp ../new-boot.img .
          cp ../magiskboot .
          ./magiskboot unpack new-boot.img >/dev/null || die "new boot verification unpack failed"
          [ -s kernel ] || die "verified kernel missing"
          [ -s extra ] || die "verified DT missing"
          cmp -s kernel "$PAYLOAD/floyd/kernel" || die "kernel payload mismatch"
          cmp -s extra "$PAYLOAD/floyd/extra" || die "DT payload mismatch"
          cd "$WORK" || die "workdir return failed"
          
          NEW_SIZE="$(wc -c < new-boot.img)"
          PART_SIZE="$(blockdev --getsize64 "$BOOT" 2>/dev/null || echo 0)"
          [ "$PART_SIZE" -gt 0 ] || die "cannot read boot partition size"
          [ "$NEW_SIZE" -le "$PART_SIZE" ] || die "new boot exceeds partition"
          
          ui_print "- Backup + repack + verification PASS"
          ui_print "- Writing boot once"
          dd if=new-boot.img of="$BOOT" bs=4096 conv=fsync || die "boot write failed"
          sync
          
          # Read-back exactly the bytes written and compare byte-for-byte.
          dd if="$BOOT" of=boot-readback.img bs=1 count="$NEW_SIZE" 2>/dev/null || die "boot read-back failed"
          cmp -s new-boot.img boot-readback.img || die "boot read-back mismatch"
          sha256sum new-boot.img > "$ROLLBACK_DIR/v2-written-boot.sha256" || true
          cp "$PAYLOAD/BUILD-IDENTITY.txt" "$ROLLBACK_DIR/V2-BUILD-IDENTITY.txt" || true
          
          ui_print "- BOOT_WRITE=PASS"
          ui_print "- BOOT_READBACK=PASS"
          ui_print "- rollback: $ROLLBACK_DIR/boot-before-v2.img"
          ui_print "- V2 ONE-SHOT complete; reboot when ready"
          exit 0
          
          ONE_SHOT_EOF
          sed -i 's/^          //' pipeline-v2-install.sh
          chmod 755 pipeline-v2-install.sh
          sh -n pipeline-v2-install.sh

      - name: Build V2 ONE-SHOT recovery package
        if: ${{ env.RESUME != 'package' }}
        run: |
          set -euo pipefail
          ROOT="$(find apollo -mindepth 1 -maxdepth 1 -type d | head -1)"
          cp -a "$ROOT/Apollo/kernelzip" installer
          chmod +x installer/floyd/tools/magiskboot installer/floyd/tools/busybox || true
          rm -f installer/floyd/*-kernel installer/floyd/*-dtb
          cp Image.uac2 installer/floyd/kernel
          cp dt.img installer/floyd/extra
          cp pipeline-v2-install.sh installer/META-INF/com/google/android/update-binary
          chmod 755 installer/META-INF/com/google/android/update-binary
          KERNEL_SHA="$(sha256sum Image.uac2 | awk '{print $1}')"
          DT_SHA="$(sha256sum dt.img | awk '{print $1}')"
          cat > installer/BUILD-IDENTITY.txt <<EOF
          DEVICE=SM-N960N
          CODENAME=crownlte
          ROM=LineageOS20
          KERNEL_COMMIT=$KERNEL_COMMIT
          KERNEL_SHA256=$KERNEL_SHA
          DT_SHA256=$DT_SHA
          V2_DISABLE=CONFIG_USB_G_ANDROID,CONFIG_USB_ANDROID_SAMSUNG_COMPOSITE
          UAC2=PASS
          FUNCTIONFS=PASS
          NCM_RNDIS=PASS
          DWC3_DUAL_ROLE=PASS
          RTL8152=PASS
          MODE=V2_ONE_SHOT
          STATUS=V2_TEST
          EOF
          (cd installer && zip -r9 ../Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip .)
          unzip -t Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip
          sha256sum Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip > Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip.sha256

      - name: Upload only canonical V2 outputs
        uses: actions/upload-artifact@v4
        with:
          name: note9-lineageos20-kernel-v2-oneshot
          path: |
            Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip
            Note9-LineageOS20-Kernel-V2-ONE-SHOT.zip.sha256
            Image.uac2
            dt.img
            V1.config
            V1.config.sha256
            V2.config
          retention-days: 30

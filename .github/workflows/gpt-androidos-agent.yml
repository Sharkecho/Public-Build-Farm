name: GPT-AndroidOS Agent Android Build

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/gpt-androidos-agent.yml'
      - 'requests/gpt-androidos/build.json'
      - 'scripts/gpt-androidos-public-patch.py'
  workflow_dispatch:
    inputs:
      upload_apk:
        description: "Publish the debug APK publicly (only open-source ClawGUI + generic GUI aliases)"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: gpt-androidos-agent-public
  cancel-in-progress: false

jobs:
  agent-debug-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - name: Checkout public build scripts
        uses: actions/checkout@v4
        with:
          path: farm
          persist-credentials: false

      - name: Checkout pinned public ClawGUI source
        uses: actions/checkout@v4
        with:
          repository: ZJU-REAL/ClawGUI
          ref: d990d3e3f2390ced708771d9681d3c4f9a6cbef5
          path: upstream
          sparse-checkout: |
            clawgui-app
          persist-credentials: false

      - name: Verify source revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C upstream rev-parse HEAD)"
          test "$actual" = "d990d3e3f2390ced708771d9681d3c4f9a6cbef5"
          echo "CLAWGUI_SOURCE_SHA=$actual" >> "$GITHUB_ENV"

      - name: Minimal public audio GUI integration
        shell: bash
        run: |
          set -euo pipefail
          python3 farm/scripts/gpt-androidos-public-patch.py --source upstream/clawgui-app
          python3 farm/scripts/gpt-androidos-public-patch.py --source upstream/clawgui-app --verify-only
          # No private repo clone, root privileges, audio data, ROM, or model files.
          test -f upstream/clawgui-app/app/src/main/AndroidManifest.xml

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK 36 with explicit SDK root
        shell: bash
        run: |
          set -euo pipefail
          # Some public runners no longer export ANDROID_HOME or have sdkmanager on PATH.
          sdkroot="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          mkdir -p "$sdkroot"
          echo "ANDROID_HOME=$sdkroot" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdkroot" >> "$GITHUB_ENV"
          manager=""
          if command -v sdkmanager >/dev/null 2>&1; then
            manager="$(command -v sdkmanager)"
          elif [ -d "$sdkroot/cmdline-tools" ]; then
            manager="$(find "$sdkroot/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | sort -V | tail -n 1)"
          fi
          if [ -z "$manager" ]; then
            mkdir -p "$sdkroot/cmdline-tools"
            curl -fsSL --retry 3 --connect-timeout 20 -o "$RUNNER_TEMP/android-cmdline.zip"               "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            unzip -q "$RUNNER_TEMP/android-cmdline.zip" -d "$RUNNER_TEMP"
            mv "$RUNNER_TEMP/cmdline-tools" "$sdkroot/cmdline-tools/latest"
            manager="$sdkroot/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager at: $manager"
          yes | "$manager" --sdk_root="$sdkroot" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          "$manager" --sdk_root="$sdkroot" --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          test -d "$sdkroot/platforms/android-36"
          test -d "$sdkroot/build-tools/36.0.0"
          echo "ANDROID_SDK_PREPARED=YES"

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        shell: bash
        working-directory: upstream/clawgui-app
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --max-workers=2 :app:assembleDebug

      - name: Verify APK and publish sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          apk=upstream/clawgui-app/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -tq "$apk" >/dev/null
          sha256sum "$apk" | tee agent-apk-sha256.txt
          {
            echo "## GPT-AndroidOS Agent debug APK"
            echo
            echo "- Source: public ZJU-REAL/ClawGUI at \`$CLAWGUI_SOURCE_SHA\`"
            echo "- Patch: public GUI alias/label only, no audio native bridge"
            echo "- Android Debug APK: BUILD_VERIFIED"
            echo "- APK SHA-256: \`$(sha256sum "$apk" | cut -d ' ' -f 1)\`"
            echo "- Public APK upload enabled: \`${{ inputs.upload_apk }}\`"
            echo "- On-device/ROM/iPhone integration: UNVERIFIED"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v4
        with:
          name: gpt-androidos-debug-sha256
          path: agent-apk-sha256.txt
          retention-days: 3

      - name: Upload public debug APK only on explicit request
        if: ${{ inputs.upload_apk }}
        uses: actions/upload-artifact@v4
        with:
          name: gpt-androidos-public-debug-apk
          path: upstream/clawgui-app/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 3

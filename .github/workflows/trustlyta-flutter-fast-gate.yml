name: Trustlyta Flutter Fast Gate
on:
  push:
    paths:
      - 'requests/ai-translator/flutter-fast.json'
      - '.github/workflows/trustlyta-flutter-fast-gate.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  flutter-fast:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    outputs:
      source_sha: ${{ steps.revision.outputs.sha }}
      failed_step: ${{ steps.diagnose.outputs.failed_step }}
    steps:
      - id: checkout
        uses: actions/checkout@v4
        with:
          path: farm
          persist-credentials: false
      - id: revision
        name: Read pinned private revision
        shell: bash
        run: |
          set -euo pipefail
          ref="$(python3 -c 'import json; print(json.load(open("farm/requests/ai-translator/flutter-fast.json"))["source_sha"])')"
          [[ "$ref" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$ref" >> "$GITHUB_OUTPUT"
      - id: source
        uses: actions/checkout@v4
        with:
          repository: Sharkecho/ai-translator
          ref: ${{ steps.revision.outputs.sha }}
          token: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - id: setup
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - id: deps
        working-directory: source/mobile
        run: flutter pub get
      - id: widget
        name: Run focused Flutter widget regression
        working-directory: source/mobile
        run: flutter test test/app_theme_test.dart test/widget_test.dart test/floating_audio_orb_test.dart test/startup_diagnostics_test.dart
      - id: diagnose
        if: ${{ always() }}
        env:
          CHECKOUT: ${{ steps.checkout.outcome }}
          REVISION: ${{ steps.revision.outcome }}
          SOURCE: ${{ steps.source.outcome }}
          SETUP: ${{ steps.setup.outcome }}
          DEPS: ${{ steps.deps.outcome }}
          WIDGET: ${{ steps.widget.outcome }}
        run: |
          failed=none
          for item in "checkout:$CHECKOUT" "revision:$REVISION" "source:$SOURCE" "setup:$SETUP" "dependencies:$DEPS" "widget:$WIDGET"; do
            if [ "${item#*:}" = failure ]; then failed="${item%%:*}"; break; fi
          done
          echo "failed_step=$failed" >> "$GITHUB_OUTPUT"
  report:
    needs: [flutter-fast]
    if: ${{ always() }}
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        env:
          TEST_RESULT: ${{ needs.flutter-fast.result }}
          FAILED_STEP: ${{ needs.flutter-fast.outputs.failed_step }}
          SOURCE_SHA: ${{ needs.flutter-fast.outputs.source_sha }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const path='status/ai-translator/flutter-fast.json';
            const safe=new Set(['none','checkout','revision','source','setup','dependencies','widget']);
            const result=process.env.TEST_RESULT;
            const report={schema_version:1,gate:'trustlyta-flutter-fast',run_id:context.runId,source_sha:(process.env.SOURCE_SHA||'').match(/^[a-f0-9]{40}$/)?.[0]||null,result,failed_step:safe.has(process.env.FAILED_STEP)?process.env.FAILED_STEP:'runner_or_setup',verified_pass:result==='success',finished_at:new Date().toISOString()};
            let sha,previous;
            try {
              const file=(await github.rest.repos.getContent({owner,repo,path})).data;
              sha=file.sha;
              previous=JSON.parse(Buffer.from(file.content,'base64').toString());
            } catch(e) {if(e.status!==404)throw e;}
            if(previous && Number(previous.run_id)>context.runId) return;
            await github.rest.repos.createOrUpdateFileContents({owner,repo,path,sha,message:`gate(flutter-fast): record run ${context.runId}`,content:Buffer.from(JSON.stringify(report,null,2)+'\n').toString('base64')});

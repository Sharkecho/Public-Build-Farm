name: Trustlyta Unsigned Release Staging
on:
  push:
    paths:
      - '.github/workflows/trustlyta-update-unsigned.yml'
      - 'requests/ai-translator/update-build.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: trustlyta-update-staging
  cancel-in-progress: true
jobs:
  build-unsigned:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          path: farm
          persist-credentials: false
      - name: Read immutable update build request
        shell: bash
        run: |
          set -euo pipefail
          echo "SOURCE_SHA=$(python3 -c 'import json; print(json.load(open("farm/requests/ai-translator/update-build.json"))["source_sha"])')" >> "$GITHUB_ENV"
          echo "REVIEW_BUILD_NUMBER=$(python3 -c 'import json; print(json.load(open("farm/requests/ai-translator/update-build.json"))["version_code"])')" >> "$GITHUB_ENV"
      - name: Validate immutable source and version
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REVIEW_BUILD_NUMBER" =~ ^[0-9]{1,7}$ ]]
          test "$REVIEW_BUILD_NUMBER" -ge 100
      - uses: actions/checkout@v4
        with:
          repository: Sharkecho/ai-translator
          ref: ${{ env.SOURCE_SHA }}
          token: ${{ secrets.BUILD_FARM_SOURCE_TOKEN }}
          path: source
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Full Flutter regression and unsigned release compile
        working-directory: source/mobile
        env:
          TRUSTLYTA_UNSIGNED_UPDATE: 'true'
        run: |
          set -euo pipefail
          flutter pub get
          flutter analyze
          flutter test
          flutter build apk --release --build-number="$REVIEW_BUILD_NUMBER" --dart-define=API_BASE_URL=https://43-163-91-54.sslip.io
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg source_sha "$SOURCE_SHA" --argjson version_code "$REVIEW_BUILD_NUMBER" '{source_sha:$source_sha,version_code:$version_code}' > build/app/outputs/flutter-apk/source-proof.json
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "UNSIGNED_VERSION_CODE=$REVIEW_BUILD_NUMBER" >> "$GITHUB_STEP_SUMMARY"
      - name: Encrypt unsigned candidate before public artifact upload
        working-directory: farm
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'cryptography>=45,<51'
          python3 -m unittest discover -s tests -p test_m2_apk_envelope.py -v
          mkdir -p "$RUNNER_TEMP/trustlyta-unsigned"
          python3 scripts/m2_apk_envelope.py encrypt \
            --input ../source/mobile/build/app/outputs/flutter-apk/app-release.apk \
            --output "$RUNNER_TEMP/trustlyta-unsigned/apk.enc" \
            --manifest "$RUNNER_TEMP/trustlyta-unsigned/manifest.json" \
            --source-sha "$SOURCE_SHA" \
            --public-key security/m2_apk_review_public.pem
          cp ../source/mobile/build/app/outputs/flutter-apk/source-proof.json \
            "$RUNNER_TEMP/trustlyta-unsigned/source-proof.json"
      - uses: actions/upload-artifact@v4
        with:
          name: trustlyta-unsigned-update-v${{ env.REVIEW_BUILD_NUMBER }}-encrypted
          path: |
            ${{ runner.temp }}/trustlyta-unsigned/apk.enc
            ${{ runner.temp }}/trustlyta-unsigned/manifest.json
            ${{ runner.temp }}/trustlyta-unsigned/source-proof.json
          retention-days: 2
          if-no-files-found: error
